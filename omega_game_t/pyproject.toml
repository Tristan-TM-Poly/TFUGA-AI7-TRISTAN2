[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-game-t"
version = "1.0.3"
description = "Deterministic Omega GAME-SIM-EVO research lab with integrated OAKBench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omega-game = "omega_game.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omega_game*"]
