name: Omega Synergy N R2 OAKBench

on:
  workflow_dispatch:
  push:
    branches: [feat/omega-synergy-n-r2-max]
    paths:
      - 'omega_synergy_n_t/**'
      - 'tests/test_*synergy*'
      - 'tests/test_mobius.py'
      - 'tests/test_factorial.py'
      - 'tests/test_spectrum_hypergraph.py'
      - 'tests/test_search_oak_experiment.py'
      - 'tests/test_ledger_reporting_cli.py'
      - 'tests/test_information_tensor_bayes_pr.py'
      - 'docs/canon/OMEGA_SYNERGY_N_T_INFINITY_R2.md'
      - 'docs/architecture/OMEGA_SYNERGY_N_R2_ARCHITECTURE.md'
      - 'docs/security/OMEGA_SYNERGY_N_R2_THREAT_MODEL.md'
      - 'schemas/n_order_*.schema.json'
      - 'policies/omega_synergy_n_r2_policy.json'
      - 'examples/omega_synergy_n_r2_demo.py'
      - 'tools/omega_synergy_n_r2.py'
      - 'pyproject.toml'
      - '.github/workflows/omega-synergy-n-r2-oakbench.yml'
  pull_request:
    paths:
      - 'omega_synergy_n_t/**'
      - 'tests/test_mobius.py'
      - 'tests/test_factorial.py'
      - 'tests/test_spectrum_hypergraph.py'
      - 'tests/test_search_oak_experiment.py'
      - 'tests/test_ledger_reporting_cli.py'
      - 'tests/test_information_tensor_bayes_pr.py'
      - 'docs/canon/OMEGA_SYNERGY_N_T_INFINITY_R2.md'
      - 'docs/architecture/OMEGA_SYNERGY_N_R2_ARCHITECTURE.md'
      - 'docs/security/OMEGA_SYNERGY_N_R2_THREAT_MODEL.md'
      - 'schemas/n_order_*.schema.json'
      - 'policies/omega_synergy_n_r2_policy.json'
      - 'examples/omega_synergy_n_r2_demo.py'
      - 'tools/omega_synergy_n_r2.py'
      - 'pyproject.toml'
      - '.github/workflows/omega-synergy-n-r2-oakbench.yml'

permissions:
  contents: read

concurrency:
  group: omega-synergy-n-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-court:
    name: Exact court / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile R2
        run: python -m compileall -q omega_synergy_n_t examples/omega_synergy_n_r2_demo.py tools/omega_synergy_n_r2.py
      - name: Run 96-test R2 court
        run: |
          python -m pytest -q \
            tests/test_mobius.py \
            tests/test_factorial.py \
            tests/test_spectrum_hypergraph.py \
            tests/test_search_oak_experiment.py \
            tests/test_ledger_reporting_cli.py \
            tests/test_information_tensor_bayes_pr.py
      - name: Generate deterministic evidence twice
        env:
          SOURCE_DATE_EPOCH: '1785795360'
        run: |
          rm -rf /tmp/synergy-n-a /tmp/synergy-n-b
          python -m omega_synergy_n_t demo --fixture synergy_os_order4 --output-dir /tmp/synergy-n-a >/tmp/demo-a.json
          python -m omega_synergy_n_t demo --fixture synergy_os_order4 --output-dir /tmp/synergy-n-b >/tmp/demo-b.json
          python -m omega_synergy_n_t audit --bundle-dir /tmp/synergy-n-a >/tmp/audit-a.json
      - name: Validate schemas, exact interaction and authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schemas=Path('schemas'); root=Path('/tmp/synergy-n-a')
          measurements=json.loads((root/'measurements.json').read_text())
          interactions=json.loads((root/'interactions.json').read_text())
          spectrum=json.loads((root/'spectrum.json').read_text())
          experiment=json.loads((root/'experiment.json').read_text())
          manifest=json.loads((root/'manifest.json').read_text())
          audit=json.loads(Path('/tmp/audit-a.json').read_text())
          Draft202012Validator(json.loads((schemas/'n_order_measurements.schema.json').read_text())).validate(measurements)
          interaction_schema=json.loads((schemas/'n_order_interaction.schema.json').read_text())
          for item in interactions: Draft202012Validator(interaction_schema).validate(item)
          Draft202012Validator(json.loads((schemas/'n_order_spectrum.schema.json').read_text())).validate(spectrum)
          Draft202012Validator(json.loads((schemas/'n_order_experiment.schema.json').read_text())).validate(experiment)
          order4=[x for x in interactions if x['order']==4]
          assert len(order4)==1 and abs(order4[0]['proper_interaction']-.7)<1e-12
          assert order4[0]['net_synergy']>0
          assert audit['valid'] is True
          assert manifest['authority']=='review_only'
          assert manifest['human_review_required'] is True
          assert manifest['automatic_merge_allowed'] is False
          assert manifest['automatic_publication_allowed'] is False
          PY
      - name: Verify deterministic replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/synergy-n-a/manifest.json').read_text())
          b=json.loads(Path('/tmp/synergy-n-b/manifest.json').read_text())
          assert a['merkle_root']==b['merkle_root']
          assert a['artifacts']==b['artifacts']
          PY
      - name: Audit immutable action refs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          refs=re.findall(r'uses:\s*([^\s#]+)',Path('.github/workflows/omega-synergy-n-r2-oakbench.yml').read_text())
          moving=[ref for ref in refs if not re.search(r'@[0-9a-f]{40}$',ref)]
          assert not moving,moving
          PY
      - name: Stage R2 evidence
        if: matrix.python-version == '3.13'
        run: |
          mkdir -p reports/omega-synergy-n-r2-ci
          cp -R /tmp/synergy-n-a/. reports/omega-synergy-n-r2-ci/
          cp /tmp/audit-a.json reports/omega-synergy-n-r2-ci/
      - name: Upload R2 evidence
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-synergy-n-r2-${{ github.run_id }}
          path: reports/omega-synergy-n-r2-ci
          if-no-files-found: error
          retention-days: 30
