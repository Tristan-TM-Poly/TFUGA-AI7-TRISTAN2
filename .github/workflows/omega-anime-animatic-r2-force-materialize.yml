name: Force Materialize Omega Anime Animatic R2

on:
  push:
    branches:
      - "feat/omega-anime-t-r0-1"
    paths:
      - ".github/workflows/omega-anime-animatic-r2-force-materialize.yml"
      - "tools/anime_animatic_r2_force.ready"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-anime-animatic-r2-materialize-refs-heads-feat-omega-anime-t-r0-1
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omega-anime-t-r0-1
          fetch-depth: 1

      - name: Execute atomic materialization with diagnostic receipt
        shell: bash
        run: |
          set +e
          rm -f /tmp/r2-stage-*.ok /tmp/r2-materializer.log
          (
            set -euo pipefail

            python - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          root = Path.cwd().resolve()
          payload_root = Path('tools/anime_animatic_r2_payload')
          expected_parts = {
              'part-00.b64': '393dd99024fe29cb5767eb9d5e8cad283307b8b076aadf39c9b4a99334f86916',
              'part-01.b64': '356ecf02fb38df3d7b2edb5520815269c4504f139a2a7ec0e218ce3eeaf50d05',
              'part-02.b64': 'b4a80ecab8d675a8fed472a29c2ab7a9729a554aa77cefd1a23c48a575f72c51',
              'part-03.b64': '2d47c3d3fd8fb07026b93c384a0cb46274bf51901ba19cdbf924acb993944562',
          }
          encoded_parts = []
          for name, expected in expected_parts.items():
              encoded = (payload_root / name).read_text(encoding='ascii').strip()
              actual = hashlib.sha256(encoded.encode('ascii')).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{name}: hash mismatch {actual} != {expected}')
              encoded_parts.append(encoded)

          archive = base64.b64decode(''.join(encoded_parts), validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected_archive = '60ca43c5fee5f323bb8bc8073e606900add8444ac646c5cd59f28afc149061c3'
          if digest != expected_archive:
              raise SystemExit(f'archive hash mismatch {digest} != {expected_archive}')

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              for member in bundle.getmembers():
                  destination = (root / member.name).resolve()
                  if root not in destination.parents and destination != root:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              bundle.extractall(root)

          Path('/tmp/r2-stage-reconstruct.ok').write_text(digest, encoding='utf-8')
          print({'parts': len(expected_parts), 'archive_bytes': len(archive), 'sha256': digest})
          PY

            python - <<'PY'
          from pathlib import Path

          path = Path('pyproject.toml')
          text = path.read_text(encoding='utf-8')
          entry = 'omega-anime-animatic = "omega_anime_animatic_t.__main__:main"'
          marker = '\n[tool.pytest.ini_options]'
          if marker not in text:
              raise SystemExit('pyproject pytest marker missing')
          if entry not in text:
              text = text.replace(marker, f'\n{entry}\n{marker}', 1)
              path.write_text(text, encoding='utf-8')
          Path('/tmp/r2-stage-pyproject.ok').write_text(entry, encoding='utf-8')
          PY

            python -m pip install --upgrade pip pytest jsonschema
            python -m compileall \
              omega_anime_animatic_t \
              tests/test_omega_anime_animatic_t_r2.py \
              examples/omega_anime_animatic_r2_demo.py
            pytest -q tests/test_omega_anime_animatic_t_r2.py --durations=20
            python -m omega_anime_animatic_t validate-demo
            rm -rf /tmp/eighth-fire-r2
            python -m omega_anime_animatic_t compile-demo --output-dir /tmp/eighth-fire-r2
            touch /tmp/r2-stage-tests.ok

            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          actual = Path('/tmp/eighth-fire-r2')
          tracked = Path('generated/omega_anime_animatic_t/eighth_fire_r2')
          timeline = json.loads((actual / 'timeline.json').read_text(encoding='utf-8'))
          manifest = json.loads((actual / 'manifest.json').read_text(encoding='utf-8'))
          schema = json.loads(Path('schemas/animatic-timeline-r2.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator(schema).validate(timeline)

          assert len(timeline['scenes']) == 5
          assert len(timeline['shots']) == 30
          assert timeline['duration_s'] == 180.0
          assert timeline['shots'][0]['start_s'] == 0.0
          assert timeline['shots'][-1]['end_s'] == 180.0
          assert timeline['shots'][-1]['dialogue'] == 'Et maintenant, elle te voit.'
          assert manifest['external_network_dependencies'] == 0
          assert manifest['self_contained_browser_player'] is True

          html = (actual / 'eighth-fire-animatic.html').read_text(encoding='utf-8')
          assert '<canvas' in html and 'AudioContext' in html
          assert 'fetch(' not in html and 'https://' not in html and 'http://' not in html

          names = {
              'audio-cues.jsonl',
              'edit-decision-list.csv',
              'eighth-fire-animatic.html',
              'manifest.json',
              'report.md',
              'storyboard-contact-sheet.svg',
              'subtitles.fr.vtt',
              'timeline.json',
          }
          assert {path.name for path in actual.iterdir()} == names
          assert {path.name for path in tracked.iterdir()} == names
          for name in sorted(names):
              actual_hash = hashlib.sha256((actual / name).read_bytes()).hexdigest()
              tracked_hash = hashlib.sha256((tracked / name).read_bytes()).hexdigest()
              assert actual_hash == tracked_hash, (name, actual_hash, tracked_hash)

          Path('/tmp/r2-stage-proof.ok').write_text(manifest['manifest_sha256'], encoding='utf-8')
          print({
              'proof': manifest['manifest_sha256'],
              'scenes': 5,
              'shots': 30,
              'duration_s': 180,
              'artifacts': len(names),
          })
          PY
          ) > /tmp/r2-materializer.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ $status -ne 0 ]]; then
            mkdir -p generated/omega_anime_animatic_t
            stage="START"
            [[ -f /tmp/r2-stage-reconstruct.ok ]] && stage="RECONSTRUCTED"
            [[ -f /tmp/r2-stage-pyproject.ok ]] && stage="PYPROJECT_PATCHED"
            [[ -f /tmp/r2-stage-tests.ok ]] && stage="TESTED"
            [[ -f /tmp/r2-stage-proof.ok ]] && stage="PROVED"
            {
              echo "status=FAILURE"
              echo "stage=$stage"
              echo "head=$GITHUB_SHA"
              echo "--- log tail ---"
              tail -n 160 /tmp/r2-materializer.log
            } > generated/omega_anime_animatic_t/materializer-diagnostic.txt
            git add -- generated/omega_anime_animatic_t/materializer-diagnostic.txt
            if ! git diff --cached --quiet; then
              git commit -m "test(anime): record R2 materializer failure at ${stage}"
              git push origin HEAD:feat/omega-anime-t-r0-1
            fi
            exit $status
          fi

          mkdir -p generated/omega_anime_animatic_t
          printf '%s\n' 'omega-anime-animatic/r2' > generated/omega_anime_animatic_t/.materialized-r2
          rm -f generated/omega_anime_animatic_t/materializer-diagnostic.txt
          rm -rf tools/anime_animatic_r2_payload
          rm -f tools/anime_animatic_r2_force.ready
          rm -f .github/workflows/omega-anime-animatic-r2-materialize.yml
          rm -f .github/workflows/omega-anime-animatic-r2-force-materialize.yml

          git add -- \
            omega_anime_animatic_t \
            tests/test_omega_anime_animatic_t_r2.py \
            examples/omega_anime_animatic_r2_demo.py \
            docs/omega_anime_animatic_t_r2.md \
            schemas/animatic-timeline-r2.schema.json \
            policies/omega_anime_animatic_r2.json \
            generated/omega_anime_animatic_t \
            .github/workflows/omega-anime-animatic-r2.yml \
            pyproject.toml
          git add -u -- \
            tools/anime_animatic_r2_payload \
            tools/anime_animatic_r2_force.ready \
            .github/workflows/omega-anime-animatic-r2-materialize.yml \
            .github/workflows/omega-anime-animatic-r2-force-materialize.yml
          git diff --cached --stat
          git commit -m "feat(anime): materialize Omega Anime Animatic R2"
          git push origin HEAD:feat/omega-anime-t-r0-1
