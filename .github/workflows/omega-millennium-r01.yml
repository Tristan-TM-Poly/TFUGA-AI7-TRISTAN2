name: Omega Millennium R0.1 OAKBench
# Branch-scoped validation for draft PR #286; no theorem-solution claim.

on:
  push:
    branches:
      - feat/omega-millennium-t-r0-1
    paths:
      - "omega_millennium_t/**"
      - "tests/test_omega_millennium_*.py"
      - "schemas/omega_millennium_*.json"
      - "docs/omega_millennium_t/**"
      - "examples/omega_millennium_demo.py"
      - "pyproject.toml"
      - ".github/workflows/omega-millennium-r01.yml"
  pull_request:
    paths:
      - "omega_millennium_t/**"
      - "tests/test_omega_millennium_*.py"
      - "schemas/omega_millennium_*.json"
      - "docs/omega_millennium_t/**"
      - "examples/omega_millennium_demo.py"
      - "pyproject.toml"
      - ".github/workflows/omega-millennium-r01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile source and fixtures
        run: python -m compileall -q omega_millennium_t tests/test_omega_millennium_t.py tests/test_omega_millennium_cli.py examples/omega_millennium_demo.py
      - name: Run targeted tests
        run: pytest -q tests/test_omega_millennium_t.py tests/test_omega_millennium_cli.py
      - name: Validate JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          for path in sorted(Path('schemas').glob('omega_millennium_*.schema.json')):
              schema = json.loads(path.read_text(encoding='utf-8'))
              validator_for(schema).check_schema(schema)
              print('VALID_SCHEMA', path)
          PY
      - name: Run deterministic benchmark twice
        run: |
          python -m omega_millennium_t.cli benchmark --output /tmp/benchmark-a.json
          python -m omega_millennium_t.cli benchmark --output /tmp/benchmark-b.json
          cmp /tmp/benchmark-a.json /tmp/benchmark-b.json
          python -m omega_millennium_t.cli campaign --budget 127 --output /tmp/campaign.json
          python - <<'PY'
          import json
          benchmark = json.load(open('/tmp/benchmark-a.json', encoding='utf-8'))
          campaign = json.load(open('/tmp/campaign.json', encoding='utf-8'))
          assert benchmark['status'] == 'CERTIFIED_SOFTWARE_FIXTURE_R0_1'
          assert benchmark['solution_claimed'] is False
          assert benchmark['finite_test_is_not_proof'] is True
          assert campaign['solution_claimed'] is False
          assert campaign['scientific_validation_claimed'] is False
          assert campaign['permanent_total_cap'] is None
          assert sum(x['finite_budget_units'] for x in campaign['allocations']) == 127
          print('CERTIFIED_SOFTWARE_PROOF_RESEARCH_OS_R0_1')
          PY
