name: Omega Web HG R0.4 Sharded MAX

on:
  push:
    branches: [feat/omega-web-hg-best-sites-r04]
    paths:
      - "omega_web_hg_t/r04/**"
      - "tests/test_omega_web_hg_r04_max.py"
      - ".github/workflows/omega-web-hg-best-sites-sharded.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-web-hg-r04-sharded-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard_oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m compileall -q omega_web_hg_t/r04 tests/test_omega_web_hg_r04_max.py
      - run: pytest -q tests/test_omega_web_hg_r04_max.py
      - name: Validate deterministic four-shard partition
        run: |
          python -m omega_web_hg_t.r04.max_cli matrix --shard-count 4 > /tmp/matrix.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/matrix.json'))
          assert [row['shard_index'] for row in data['include']] == [0, 1, 2, 3]
          assert all(row['shard_count'] == 4 for row in data['include'])
          print('OMEGA_WEB_HG_R04_FOUR_SHARDS_VALID')
          PY

  max_metadata_shard:
    needs: shard_oakbench
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard_index: [0, 1, 2, 3]
    env:
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run one source-disjoint metadata shard
        run: |
          root="generated/omega_web_hg_r04_max/shard-${{ matrix.shard_index }}"
          python -m omega_web_hg_t.r04.max_cli run \
            --output-dir "$root" \
            --query "hypergraph fractal mycelial science engineering" \
            --item-budget 5000 \
            --page-size 100 \
            --max-pages-per-source 8 \
            --retries 4 \
            --max-bytes 2097152 \
            --shard-index "${{ matrix.shard_index }}" \
            --shard-count 4
          python -m omega_web_hg_t.r04.max_cli audit "$root"
      - name: Enforce metadata-only shard boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index = ${{ matrix.shard_index }}
          root = Path(f'generated/omega_web_hg_r04_max/shard-{index}')
          report = json.loads((root / 'campaign-report.json').read_text())
          assert report['shard']['index'] == index
          assert report['shard']['count'] == 4
          assert report['metadata_only'] is True
          assert report['raw_bodies_persisted'] is False
          assert report['full_text_collected'] is False
          assert report['permanent_total_cap'] is None
          records = [json.loads(line) for line in (root / 'records.jsonl').read_text().splitlines() if line]
          forbidden = {'abstract', 'authors', 'author', 'explanation', 'body', 'full_text'}
          assert all(not forbidden.intersection(record) for record in records)
          print(json.dumps({
              'shard': report['shard'],
              'record_count': report['record_count'],
              'request_count': report['request_count'],
              'mminus_count': report['mminus_count'],
              'report_sha256': report['report_sha256'],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega-web-hg-r04-max-shard-${{ matrix.shard_index }}
          path: generated/omega_web_hg_r04_max/shard-${{ matrix.shard_index }}
          if-no-files-found: error
          retention-days: 30

  aggregate_max_evidence:
    if: ${{ always() && needs.max_metadata_shard.result != 'skipped' }}
    needs: max_metadata_shard
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: omega-web-hg-r04-max-shard-*
          path: generated/downloaded-shards
          merge-multiple: false
      - name: Aggregate and require all four shards
        run: |
          python -m omega_web_hg_t.r04.max_cli aggregate \
            generated/downloaded-shards \
            --output-dir generated/omega_web_hg_r04_max_aggregate \
            --expected-shards 4
      - name: Enforce aggregate proof boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('generated/omega_web_hg_r04_max_aggregate')
          report = json.loads((root / 'aggregate-report.json').read_text())
          assert report['complete'] is True
          assert report['missing_shards'] == []
          assert report['metadata_only'] is True
          assert report['raw_bodies_persisted'] is False
          assert report['full_text_collected'] is False
          assert report['permanent_total_cap'] is None
          print(json.dumps({
              'record_count': report['record_count'],
              'request_count': report['request_count'],
              'mminus_count': report['mminus_count'],
              'source_counts': report['source_counts'],
              'record_merkle_root': report['record_merkle_root'],
              'report_sha256': report['report_sha256'],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega-web-hg-r04-max-aggregate-evidence
          path: generated/omega_web_hg_r04_max_aggregate
          if-no-files-found: error
          retention-days: 30
