name: Omega Problem Atlas R0.5 Identity Graph

on:
  push:
    branches: [feat/omega-problem-atlas-r0-5-alias-graph]
    paths:
      - "omega_millennium_t/r05/**"
      - "tests/test_omega_problem_atlas_r05_identity.py"
      - "schemas/omega_problem_identity_report_v5.schema.json"
      - "docs/omega_millennium_t/r05/**"
      - "pyproject.toml"
      - ".github/workflows/omega-problem-atlas-r05-identity.yml"
  pull_request:
    paths:
      - "omega_millennium_t/r05/**"
      - "tests/test_omega_problem_atlas_r05_identity.py"
      - "schemas/omega_problem_identity_report_v5.schema.json"
      - "docs/omega_millennium_t/r05/**"
      - "pyproject.toml"
      - ".github/workflows/omega-problem-atlas-r05-identity.yml"
  workflow_dispatch:

concurrency:
  group: omega-problem-atlas-r05-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  identity-graph:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile R0.5
        run: >-
          python -m compileall -q
          omega_millennium_t/r05
          tests/test_omega_problem_atlas_r05_identity.py
      - name: Run adversarial identity tests
        run: pytest -q tests/test_omega_problem_atlas_r05_identity.py
      - name: Generate deterministic multi-source fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [
              {
                  "source_id": "catalog_a",
                  "problem_id": "graph_parity_a",
                  "title": "Graph parity conjecture",
                  "front": "graphs_hypergraphs",
                  "source_locator": "catalog_a:graph_parity_a",
                  "source_verified_at": None,
                  "statement": "For every finite graph, property P holds.",
                  "aliases": ["Conjecture de parité des graphes"],
                  "status_receipt_id": "receipt::a",
                  "adapter_provenance_digest": "a" * 64,
                  "solution_claimed": False,
              },
              {
                  "source_id": "catalog_b",
                  "problem_id": "graph_parity_b",
                  "title": "Conjecture de parité des graphes",
                  "front": "graphs_hypergraphs",
                  "source_locator": "catalog_b:graph_parity_b",
                  "source_verified_at": None,
                  "statement": "For every finite graph, property P holds.",
                  "aliases": [],
                  "status_receipt_id": "receipt::b",
                  "adapter_provenance_digest": "b" * 64,
                  "solution_claimed": False,
              },
              {
                  "source_id": "catalog_c",
                  "problem_id": "graph_parity_variant",
                  "title": "Graph parity conjecture",
                  "front": "graphs_hypergraphs",
                  "source_locator": "catalog_c:graph_parity_variant",
                  "source_verified_at": None,
                  "statement": "There exists a finite graph for which property Q holds.",
                  "aliases": [],
                  "status_receipt_id": "receipt::c",
                  "adapter_provenance_digest": "c" * 64,
                  "solution_claimed": False,
              },
          ]
          Path('/tmp/identity-imports.jsonl').write_text(
              ''.join(json.dumps(row, sort_keys=True, ensure_ascii=False) + '\n' for row in rows),
              encoding='utf-8',
          )
          PY
      - name: Materialize twice and audit
        run: |
          python -m omega_millennium_t.r05.cli compile --import-jsonl /tmp/identity-imports.jsonl --output-dir /tmp/identity-a
          python -m omega_millennium_t.r05.cli compile --import-jsonl /tmp/identity-imports.jsonl --output-dir /tmp/identity-b
          diff -ru /tmp/identity-a /tmp/identity-b
          python -m omega_millennium_t.r05.cli audit /tmp/identity-a
      - name: Validate report schema and OAK invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path('schemas/omega_problem_identity_report_v5.schema.json').read_text())
          report = json.loads(Path('/tmp/identity-a/report.json').read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.validate(report, schema)

          assert report['source_record_count'] == 3
          assert report['canonical_problem_count'] == 2
          assert report['automatic_exact_statement_merge_edge_count'] == 1
          assert report['collision_quarantine_count'] == 1
          assert report['fuzzy_merge_count'] == 0
          assert report['title_only_merge_count'] == 0
          assert report['solution_claimed'] is False
          assert report['formal_proof_claimed'] is False
          assert report['scientific_validation_claimed'] is False
          assert report['permanent_total_cap'] is None
          print('CERTIFIED_IDENTITY_GRAPH_FIXTURE_R0_5')
          PY
