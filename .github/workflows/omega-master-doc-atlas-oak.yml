name: omega-master-doc-atlas-oak

on:
  pull_request:
    paths:
      - "omega_latex_t/master_doc_atlas.py"
      - "omega_latex_t/master_doc_atlas_cli.py"
      - "tests/test_omega_master_doc_atlas.py"
      - "schemas/omega_master_doc_atlas.schema.json"
      - "docs/theories/OMEGA_MASTER_DOC_ATLAS_T_R10.md"
      - "docs/generated/omega_master_doc_atlas/**"
      - ".github/workflows/omega-master-doc-atlas-oak.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oak:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile
        run: python -m compileall -q omega_latex_t/master_doc_atlas.py omega_latex_t/master_doc_atlas_cli.py tests/test_omega_master_doc_atlas.py
      - name: Tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_omega_master_doc_atlas.py
      - name: Validate schema and deterministic bundle
        if: matrix.python-version == '3.12'
        env:
          PYTHONPATH: .
        run: |
          rm -rf /tmp/master-atlas-a /tmp/master-atlas-b
          python -m omega_latex_t.master_doc_atlas_cli --output-dir /tmp/master-atlas-a
          python -m omega_latex_t.master_doc_atlas_cli --output-dir /tmp/master-atlas-b >/tmp/master-atlas-b.out
          cmp /tmp/master-atlas-a/MANIFEST.json /tmp/master-atlas-b/MANIFEST.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('schemas/omega_master_doc_atlas.schema.json').read_text())
          report=json.loads(Path('/tmp/master-atlas-a/master-atlas.json').read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(report)
          assert report['repository_count'] == 6
          assert report['totals']['module_observations'] == 5206
          assert report['totals']['public_symbol_observations'] == 26262
          assert report['totals']['claim_candidates'] == 33
          assert report['totals']['cross_repository_identical_module_hash_groups'] == 5
          assert 'REVIEW_BINDING_VOLUME != EVIDENCE_STRENGTH' in report['oak_boundaries']
          PY
      - name: Upload deterministic master atlas
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-master-doc-atlas-r10-${{ github.run_id }}
          path: /tmp/master-atlas-a/**
          if-no-files-found: error
          retention-days: 30
