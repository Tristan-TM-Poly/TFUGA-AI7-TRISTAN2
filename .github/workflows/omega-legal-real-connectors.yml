name: Omega Legal Real Connectors OAKBench

on:
  pull_request:
    paths:
      - "omega_legal_production_os_t/http_client.py"
      - "omega_legal_production_os_t/real_*.py"
      - "tests/test_omega_legal_real_connectors.py"
      - "docs/omega_legal_production_os_t/R03_R05_REAL.md"
      - ".github/workflows/omega-legal-real-*.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "omega_legal_production_os_t/http_client.py"
      - "omega_legal_production_os_t/real_*.py"
      - "tests/test_omega_legal_real_connectors.py"
      - ".github/workflows/omega-legal-real-*.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-connectors-oakbench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile real connector surface
        run: >-
          python -m compileall -q
          omega_legal_production_os_t/http_client.py
          omega_legal_production_os_t/real_providers.py
          omega_legal_production_os_t/real_execution.py
          omega_legal_production_os_t/real_cli.py
          tests/test_omega_legal_real_connectors.py
      - name: Run real connector OAKBench with fake transport
        run: python -m pytest -q tests/test_omega_legal_real_connectors.py
      - name: Verify CLI without credentials or network
        run: |
          python -m omega_legal_production_os_t.real_cli --help
          python -m omega_legal_production_os_t.real_cli doctor --provider gmail-send --allow-missing
          python -m omega_legal_production_os_t.real_cli doctor --provider github-release-draft --allow-missing
          python -m omega_legal_production_os_t.real_cli doctor --provider stripe-test-payment-intent --allow-missing
          python -m omega_legal_production_os_t.real_cli doctor --provider dropbox-sign-test --allow-missing
