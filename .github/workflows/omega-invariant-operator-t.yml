name: Omega Invariant Operator Genesis CI

on:
  pull_request:
    paths:
      - 'omega_invariant_operator_t/**'
      - 'tests/test_omega_invariant_operator_t.py'
      - 'docs/omega_invariant_operator_t/**'
      - '.github/workflows/omega-invariant-operator-t.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_omega_invariant_operator_t.py
      - name: Compile package
        run: python -m compileall -q omega_invariant_operator_t
      - name: Run deterministic TSP smoke
        run: python -m omega_invariant_operator_t tsp --nodes 5 --max-witnesses 8 > /tmp/omega-invariant-operator.json
