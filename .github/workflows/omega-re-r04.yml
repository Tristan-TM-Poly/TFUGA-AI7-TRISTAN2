name: Omega RE R0.4 OAKBench

on:
  pull_request:
    paths:
      - "omega_re_t/probabilistic_r04.py"
      - "omega_re_t/symbolic_merge.py"
      - "omega_re_t/active_causal.py"
      - "omega_re_t/authenticated_receipts.py"
      - "omega_re_t/baseline_execution.py"
      - "omega_re_t/r04_cli.py"
      - "tests/test_r04_*.py"
      - "docs/omega-re-t/FOUNDATION_R0_4.md"
      - "pyproject.toml"
      - ".github/workflows/omega-re-r04.yml"
  push:
    branches:
      - main
      - feat/omega-re-t-r0-4-max
    paths:
      - "omega_re_t/probabilistic_r04.py"
      - "omega_re_t/symbolic_merge.py"
      - "omega_re_t/active_causal.py"
      - "omega_re_t/authenticated_receipts.py"
      - "omega_re_t/baseline_execution.py"
      - "omega_re_t/r04_cli.py"
      - "tests/test_r04_*.py"
      - "docs/omega-re-t/FOUNDATION_R0_4.md"
      - "pyproject.toml"
      - ".github/workflows/omega-re-r04.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile R0.4
        run: python -m compileall -q omega_re_t tests/test_r04_*.py
      - name: Run R0.4 tests
        run: python -m pytest -q tests/test_r04_*.py
      - name: Run deterministic R0.4 demonstrations
        run: |
          python -m omega_re_t.r04_cli all --output /tmp/omega-re-r04-a.json
          python -m omega_re_t.r04_cli all --output /tmp/omega-re-r04-b.json
          cmp /tmp/omega-re-r04-a.json /tmp/omega-re-r04-b.json
