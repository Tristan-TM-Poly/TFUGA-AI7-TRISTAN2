name: Temporary Sync and Validate Production Quality Observatory

on:
  push:
    branches:
      - feat/omega-production-quality-observatory-r0-1
    paths:
      - '.github/workflows/sync-validate-production-quality-observatory-temporary.yml'

permissions:
  contents: write

jobs:
  sync-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/omega-production-quality-observatory-r0-1
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize current main non-destructively
        run: |
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest

      - name: Compile observatory
        run: python -m py_compile tools/production_quality_observatory.py

      - name: Run targeted tests
        run: python -m pytest -q tests/test_production_quality_observatory.py

      - name: Generate deterministic report
        run: |
          python tools/production_quality_observatory.py \
            --snapshot reports/production_quality_snapshot_2026-08-02.json \
            --policy policies/omega_production_quality_observatory_r0_1.json \
            --output-json generated/production-quality/report.json \
            --output-md generated/production-quality/report.md

      - name: Verify authority and anti-inflation invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('generated/production-quality/report.json').read_text(encoding='utf-8'))
          assert report['decision'] == 'REDUCE_WIP_AND_EXTERNALIZE'
          assert report['gates']['volume']['status'] == 'GREEN'
          assert report['gates']['volume']['actual_minimum'] == 81602080
          assert report['gates']['volume']['largest_virtual_plan'] == 10**15
          assert report['gates']['volume']['virtual_plan_excluded'] is True
          assert report['gates']['integration']['status'] == 'GREEN'
          assert report['gates']['wip']['status'] == 'RED'
          assert report['gates']['external_science']['status'] == 'RED'
          assert report['gates']['external_product']['status'] == 'RED'
          assert report['scalar_score_has_final_authority'] is False
          assert report['authority']['automatic_merge'] is False
          assert report['authority']['automatic_publication'] is False
          assert report['authority']['automatic_scientific_promotion'] is False
          assert report['authority']['automatic_product_claim'] is False
          assert report['authority']['human_approval_required'] is True
          PY

      - name: Write merge validation receipt
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          main_sha = subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip()
          tree_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          receipt = {
              'status': 'passed',
              'targeted_tests': 'passed',
              'decision': 'REDUCE_WIP_AND_EXTERNALIZE',
              'actual_minimum_heterogeneous_units': 81602080,
              'largest_virtual_plan': 10**15,
              'virtual_plan_counted_as_execution': False,
              'integration_gate': 'GREEN',
              'wip_gate': 'RED',
              'external_science_gate': 'RED',
              'external_product_gate': 'RED',
              'automatic_merge_runtime': False,
              'human_merge_authorization': True,
              'scalar_score_has_final_authority': False,
              'synchronized_main': main_sha,
              'validated_tree': tree_sha,
          }
          path = Path('reports/production_quality_observatory_merge_validation.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Remove temporary workflow and crystallize receipt
        run: |
          rm .github/workflows/sync-validate-production-quality-observatory-temporary.yml
          git add -- reports/production_quality_observatory_merge_validation.json
          git add -u -- .github/workflows/sync-validate-production-quality-observatory-temporary.yml
          git commit -m "test: validate production quality observatory on current main"
          git push origin HEAD:feat/omega-production-quality-observatory-r0-1
