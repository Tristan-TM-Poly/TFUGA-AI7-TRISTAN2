name: Ω Actions Optimizer CI

on:
  pull_request:
    paths:
      - 'omega_actions_t/**'
      - 'tests/test_omega_actions_t.py'
      - 'docs/OMEGA_ACTIONS_T.md'
      - 'pyproject.toml'
      - '.github/workflows/omega-actions-optimizer-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'omega_actions_t/**'
      - 'tests/test_omega_actions_t.py'
      - 'docs/OMEGA_ACTIONS_T.md'
      - 'pyproject.toml'
      - '.github/workflows/omega-actions-optimizer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-actions-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  optimizer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Run optimizer tests
        run: python -m pytest -q tests/test_omega_actions_t.py

      - name: Analyze repository workflows
        run: |
          python -m omega_actions_t.cli --root . \
            --json-out /tmp/OMEGA_ACTIONS_REPORT.json \
            --markdown-out /tmp/OMEGA_ACTIONS_REPORT.md
          test -s /tmp/OMEGA_ACTIONS_REPORT.json
          test -s /tmp/OMEGA_ACTIONS_REPORT.md
          grep -q 'Ω-ACTIONS-T∞' /tmp/OMEGA_ACTIONS_REPORT.md

      - name: OAK read-only guard
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('omega_actions_t'), Path('docs/OMEGA_ACTIONS_T.md')]
          blocked = ['secrets.', 'git push', 'gh pr merge', 'curl ', 'wget ']
          texts = []
          for root in roots:
              if root.is_dir():
                  texts.extend(path.read_text(encoding='utf-8', errors='ignore') for path in root.rglob('*.py'))
              elif root.exists():
                  texts.append(root.read_text(encoding='utf-8', errors='ignore'))
          joined = '\n'.join(texts)
          hits = [term for term in blocked if term in joined]
          if hits:
              raise SystemExit(f'OAK read-only guard failed: {hits}')
          print('OAK read-only guard passed')
          PY
