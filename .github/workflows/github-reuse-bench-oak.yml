name: Ω GitHub Reuse Bench OAK

on:
  pull_request:
    paths:
      - "omega_capability_os_t/github_memory_replay.py"
      - "tests/test_omega_capability_os_github_memory_replay.py"
      - "docs/OMEGA_GITHUB_CUMULATIVE_MEMORY_R0_8_REPLAY_BENCH.md"
      - ".github/workflows/github-reuse-bench-oak.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  reuse-bench-oak:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: R0.8 deterministic replay court tests
        run: python -m pytest -q tests/test_omega_capability_os_github_memory_replay.py
      - name: Compile sources
        run: python -m compileall -q omega_capability_os_t
      - name: Refresh all-PR metadata memory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_memory_cli build \
            --repository "$GITHUB_REPOSITORY" \
            --registry examples/capability_os_registry.json \
            --without-files \
            --output /tmp/omega-github-memory-r08.json
      - name: Run historical Decision Replay / Reuse Bench
        run: |
          python -m omega_capability_os_t.github_memory_replay court \
            /tmp/omega-github-memory-r08.json \
            --top-k 8 \
            --output /tmp/omega-github-reuse-bench-r08.json
      - name: R0.8 OAK assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/omega-github-reuse-bench-r08.json").read_text())
          assert report["schema"] == "omega-github-reuse-bench-court/v0.8.0", report.get("schema")
          assert report["oak"]["status"] == "PASS", report["oak"]
          assert report["oak"]["synthetic_policy_pass"] is True, report["oak"]
          assert report["oak"]["historical_temporal_leakage_free"] is True, report["oak"]
          assert report["historical_lineage"]["target_leakage_count"] == 0, report["historical_lineage"]
          assert report["historical_lineage"]["future_leakage_count"] == 0, report["historical_lineage"]
          assert all(row["passed"] for row in report["synthetic_policy_cases"]), report["synthetic_policy_cases"]
          assert len(report["fingerprint"]) == 64
          print(json.dumps({
              "status": report["oak"]["status"],
              "eligible_targets": report["historical_lineage"]["eligible_target_count"],
              "gold_lineage_refs": report["historical_lineage"]["gold_lineage_ref_count"],
              "micro_recall_at_8": report["historical_lineage"]["micro_recall_at_k"],
              "macro_recall_at_8": report["historical_lineage"]["macro_recall_at_k"],
              "mean_candidate_fraction": report["historical_lineage"]["mean_candidate_fraction"],
              "target_leakage_count": report["historical_lineage"]["target_leakage_count"],
              "future_leakage_count": report["historical_lineage"]["future_leakage_count"],
              "fingerprint": report["fingerprint"],
          }, indent=2))
          PY
      - name: Retain R0.8 replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: omega-github-reuse-bench-r08-${{ github.run_id }}
          path: /tmp/omega-github-reuse-bench-r08.json
          retention-days: 14
