name: Omega Anime Animatic R2

on:
  pull_request:
    paths:
      - "omega_anime_animatic_t/**"
      - "tests/test_omega_anime_animatic_t_r2.py"
      - "examples/omega_anime_animatic_r2_demo.py"
      - "docs/omega_anime_animatic_t_r2.md"
      - "schemas/animatic-timeline-r2.schema.json"
      - "policies/omega_anime_animatic_r2.json"
      - ".github/workflows/omega-anime-animatic-r2.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-anime-animatic-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  animatic-oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Compile source
        run: |
          python -m compileall \
            omega_anime_animatic_t \
            tests/test_omega_anime_animatic_t_r2.py \
            examples/omega_anime_animatic_r2_demo.py

      - name: Run R2 proof tests
        run: |
          pytest -q tests/test_omega_anime_animatic_t_r2.py --durations=20 \
            2>&1 | tee /tmp/omega-anime-animatic-r2-tests.log

      - name: Validate canonical timeline schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from omega_anime_animatic_t import build_eighth_fire_animatic_r2

          schema = json.loads(Path('schemas/animatic-timeline-r2.schema.json').read_text())
          timeline = build_eighth_fire_animatic_r2().to_dict()
          Draft202012Validator(schema).validate(timeline)
          assert len(timeline['scenes']) == 5
          assert len(timeline['shots']) == 30
          assert timeline['duration_s'] == 180.0
          print(json.dumps({'scenes': 5, 'shots': 30, 'duration_s': 180.0}, indent=2))
          PY

      - name: Compile self-contained animatic
        run: |
          rm -rf /tmp/eighth-fire-r2
          python -m omega_anime_animatic_t validate-demo
          python -m omega_anime_animatic_t compile-demo \
            --output-dir /tmp/eighth-fire-r2 \
            | tee /tmp/omega-anime-animatic-r2-manifest.json

      - name: Enforce audiovisual and network gates
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/eighth-fire-r2')
          expected = {
              'audio-cues.jsonl',
              'edit-decision-list.csv',
              'eighth-fire-animatic.html',
              'manifest.json',
              'report.md',
              'storyboard-contact-sheet.svg',
              'subtitles.fr.vtt',
              'timeline.json',
          }
          assert {path.name for path in root.iterdir()} == expected
          manifest = json.loads((root / 'manifest.json').read_text())
          timeline = json.loads((root / 'timeline.json').read_text())
          html = (root / 'eighth-fire-animatic.html').read_text()
          svg = (root / 'storyboard-contact-sheet.svg').read_text()
          assert manifest['external_network_dependencies'] == 0
          assert manifest['self_contained_browser_player'] is True
          assert manifest['guide_audio_only'] is True
          assert len(manifest['manifest_sha256']) == 64
          assert timeline['shots'][-1]['dialogue'] == 'Et maintenant, elle te voit.'
          assert '<canvas' in html and 'AudioContext' in html
          assert 'fetch(' not in html and 'http://' not in html and 'https://' not in html
          assert svg.count('data-shot=') == 30
          for name, record in manifest['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == record['sha256']
          print(json.dumps({
              'manifest': manifest['manifest_sha256'],
              'artifacts': len(expected),
              'network_dependencies': 0,
              'player': 'Canvas+WebAudio',
          }, indent=2))
          PY

      - name: Upload R2 animatic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eighth-fire-animatic-r2-py${{ matrix.python-version }}
          path: |
            /tmp/eighth-fire-r2
            /tmp/omega-anime-animatic-r2-tests.log
            /tmp/omega-anime-animatic-r2-manifest.json
          retention-days: 14
