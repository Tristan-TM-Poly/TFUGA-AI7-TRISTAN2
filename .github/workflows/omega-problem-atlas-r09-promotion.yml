name: Omega Problem Atlas R0.9 Promotion Gate

on:
  push:
    branches: [feat/omega-problem-atlas-r0-9-publication-ip-gate]
    paths:
      - "omega_millennium_t/r09/**"
      - "tests/test_omega_problem_atlas_r09*.py"
      - "schemas/omega_problem_promotion_*_v9.schema.json"
      - "docs/omega_millennium_t/r09/**"
      - "pyproject.toml"
      - ".github/workflows/omega-problem-atlas-r09-promotion.yml"
  pull_request:
    paths:
      - "omega_millennium_t/r09/**"
      - "tests/test_omega_problem_atlas_r09*.py"
      - "schemas/omega_problem_promotion_*_v9.schema.json"
      - "docs/omega_millennium_t/r09/**"
      - "pyproject.toml"
      - ".github/workflows/omega-problem-atlas-r09-promotion.yml"
  workflow_dispatch:

concurrency:
  group: omega-problem-atlas-r09-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promotion-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile R0.9 modules and tests
        run: >-
          python -m compileall -q
          omega_millennium_t/r09
          tests/test_omega_problem_atlas_r09_promotion_gate.py
          tests/test_omega_problem_atlas_r09_schema.py

      - name: Run R0.9 tests
        run: pytest -q tests/test_omega_problem_atlas_r09*.py

      - name: Verify CLI surface is dry-run only
        run: |
          python -m omega_millennium_t.r09.cli --help | tee /tmp/r09-help.txt
          grep -q "compile" /tmp/r09-help.txt
          grep -q "audit" /tmp/r09-help.txt
          ! grep -Eq "(^|[[:space:]])(submit|publish|file|release|send)([[:space:]]|$)" /tmp/r09-help.txt

      - name: Materialize two byte-identical fixtures
        run: |
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path
          from omega_millennium_t.r09 import audit_promotion_gate, compile_promotion_gate

          fixtures = runpy.run_path("tests/test_omega_problem_atlas_r09_promotion_gate.py")
          bundle = fixtures["_build_bundle"]()
          work = Path("generated/omega_problem_promotion_r09")
          work.mkdir(parents=True, exist_ok=True)
          bundle_path = work / "bundle.json"
          bundle_path.write_text(json.dumps(bundle, indent=2, sort_keys=True), encoding="utf-8")
          output_a = work / "output-a"
          output_b = work / "output-b"
          report_a = compile_promotion_gate(bundle_path, output_a)
          report_b = compile_promotion_gate(bundle_path, output_b)
          assert report_a == report_b
          assert report_a["gate_ready"] is True
          assert report_a["dry_run"] is True
          assert report_a["external_action_performed"] is False
          names_a = sorted(path.name for path in output_a.iterdir())
          names_b = sorted(path.name for path in output_b.iterdir())
          assert names_a == names_b
          for name in names_a:
              assert (output_a / name).read_bytes() == (output_b / name).read_bytes(), name
          audit = audit_promotion_gate(output_a)
          assert audit["valid"] is True, audit
          receipt = json.loads((output_a / "promotion_receipt.json").read_text(encoding="utf-8"))
          assert receipt["submission_performed"] is False
          assert receipt["publication_performed"] is False
          assert receipt["patent_filing_performed"] is False
          assert receipt["public_disclosure_performed"] is False
          assert receipt["prize_claim_submitted"] is False
          assert receipt["prize_or_clay_recognition_inferred"] is False
          assert receipt["mathematical_truth_probability_claimed"] is False
          PY

      - name: Validate generated report schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          report = json.loads(Path(
              "generated/omega_problem_promotion_r09/output-a/report.json"
          ).read_text(encoding="utf-8"))
          schema = json.loads(Path(
              "schemas/omega_problem_promotion_report_v9.schema.json"
          ).read_text(encoding="utf-8"))
          jsonschema.validate(report, schema)
          PY

      - name: Assert zero external-action and scientific-claim flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("generated/omega_problem_promotion_r09/output-a")
          receipt = json.loads((root / "promotion_receipt.json").read_text(encoding="utf-8"))
          report = json.loads((root / "report.json").read_text(encoding="utf-8"))
          forbidden_receipt_true = [
              "external_action_performed",
              "submission_performed",
              "publication_performed",
              "patent_filing_performed",
              "public_disclosure_performed",
              "prize_claim_submitted",
              "prize_or_clay_recognition_inferred",
              "novelty_or_correctness_self_approved",
              "mathematical_truth_probability_claimed",
              "proof_claimed_by_gate",
              "solution_claimed_by_gate",
          ]
          assert receipt["dry_run"] is True
          assert all(receipt[key] is False for key in forbidden_receipt_true)
          assert report["dry_run"] is True
          assert report["external_action_performed"] is False
          assert report["proof_claimed"] is False
          assert report["solution_claimed"] is False
          assert report["novelty_claimed_by_compiler"] is False
          assert report["prize_recognition_claimed"] is False
          PY
