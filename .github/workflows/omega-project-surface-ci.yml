name: Ω Project Script Surface

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "omega_actions_t/project_surface.py"
      - "omega_actions_t/trigger_hotspots.py"
      - "omega_latex_t/omega_doc_cli.py"
      - "tests/test_omega_actions_project_surface.py"
      - "tests/test_omega_actions_trigger_hotspots.py"
      - ".github/workflows/omega-project-surface-ci.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "omega_actions_t/project_surface.py"
      - "omega_actions_t/trigger_hotspots.py"
      - "omega_latex_t/omega_doc_cli.py"
      - "tests/test_omega_actions_project_surface.py"
      - "tests/test_omega_actions_trigger_hotspots.py"
      - ".github/workflows/omega-project-surface-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-project-surface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  project-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Test trigger-boundary tools
        run: >-
          python -m pytest -q
          tests/test_omega_actions_project_surface.py
          tests/test_omega_actions_trigger_hotspots.py

      - name: Validate Code Dojo script surface
        run: |
          python -m omega_actions_t.project_surface pyproject.toml \
            --prefix omega-code-dojo \
            --json-out /tmp/OMEGA_PROJECT_SURFACE_DOJO.json

      - name: Validate Omega LaTeX script surface
        run: |
          python -m omega_actions_t.project_surface pyproject.toml \
            --prefix omega-doc \
            --prefix omega-latex \
            --json-out /tmp/OMEGA_PROJECT_SURFACE_LATEX.json

      - name: Measure trigger hotspots
        run: |
          python -m omega_actions_t.trigger_hotspots --root . --top 12 \
            --json-out /tmp/OMEGA_TRIGGER_HOTSPOTS.json \
            | tee /tmp/OMEGA_TRIGGER_HOTSPOTS.txt

      - name: Summarize evidence
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          dojo = json.loads(Path('/tmp/OMEGA_PROJECT_SURFACE_DOJO.json').read_text())
          latex = json.loads(Path('/tmp/OMEGA_PROJECT_SURFACE_LATEX.json').read_text())
          hotspots = json.loads(Path('/tmp/OMEGA_TRIGGER_HOTSPOTS.json').read_text())
          print('## Ω Project Script Surface')
          print()
          print(f"- Code Dojo status: **{dojo['status']}**")
          print(f"- Code Dojo scripts: **{dojo['selected_script_count']}**")
          print(f"- Omega LaTeX status: **{latex['status']}**")
          print(f"- Omega LaTeX scripts: **{latex['selected_script_count']}**")
          print(f"- total structural violations: **{len(dojo['violations']) + len(latex['violations'])}**")
          print(f"- workflows scanned for trigger hotspots: **{hotspots['workflow_count']}**")
          print()
          print('### Top shared trigger paths')
          for item in hotspots['shared_hotspots'][:10]:
              print(f"- `{item['path']}` → **{item['workflow_count']} workflows**")
          PY
