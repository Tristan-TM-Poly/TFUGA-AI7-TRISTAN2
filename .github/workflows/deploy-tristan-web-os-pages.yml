name: Deploy Tristan Web OS to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - apps/tristan-8fire-site/**
      - .github/workflows/deploy-tristan-web-os-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: tristan-web-os-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build public Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Verify public site payload
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/tristan-8fire-site/index.html
          test -f apps/tristan-8fire-site/app.js
          test -f apps/tristan-8fire-site/sw.js
          test -f apps/tristan-8fire-site/app.webmanifest
          test -f apps/tristan-8fire-site/data/theories.json
          test -f apps/tristan-8fire-site/data/claims.json
          test -f apps/tristan-8fire-site/data/relations.json
          test -f apps/tristan-8fire-site/data/provenance.json
          test -f apps/tristan-8fire-site/data/build-manifest.json
          printf 'Tristan Web OS public payload verified.\n'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Tristan Web OS artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/tristan-8fire-site

  deploy:
    name: Publish live site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    name: Publish deployment receipt
    if: always()
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Write public deployment receipt to PR 248
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          DEPLOYED_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$DEPLOY_RESULT" = "success" ] && [ -n "$PAGE_URL" ]; then
            headline="## Tristan Web OS est publié"
            site_line="- **Site public :** ${PAGE_URL}"
            final_status="déploiement GitHub Pages réussi"
          else
            headline="## Diagnostic de publication Tristan Web OS"
            site_line="- **Site public :** non disponible"
            final_status="publication non confirmée; consulter l’exécution"
          fi

          body=$(cat <<EOF
          <!-- tristan-web-os-live-deployment -->
          ${headline}

          ${site_line}
          - **Build :** ${BUILD_RESULT}
          - **Déploiement :** ${DEPLOY_RESULT}
          - **Commit :** \`${DEPLOYED_SHA}\`
          - **Exécution :** ${RUN_URL}
          - **Statut :** ${final_status}

          Ce reçu est généré automatiquement par le pipeline de production de Tristan Web OS.
          EOF
          )
          gh api "repos/${GITHUB_REPOSITORY}/issues/248/comments" -f body="$body"
