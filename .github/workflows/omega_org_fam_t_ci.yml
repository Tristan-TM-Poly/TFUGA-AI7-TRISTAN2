name: omega-org-fam-t

on:
  push:
    paths:
      - "omega_org_fam_t/**"
      - "tests/test_omega_org_fam*.py"
      - "tools/generate_omega_org_fam_massive.py"
      - "schemas/omega_org_family*.json"
      - ".github/workflows/omega_org_fam_t_ci.yml"
  pull_request:
    paths:
      - "omega_org_fam_t/**"
      - "tests/test_omega_org_fam*.py"
      - "tools/generate_omega_org_fam_massive.py"
      - "schemas/omega_org_family*.json"
      - ".github/workflows/omega_org_fam_t_ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_omega_org_fam_t.py tests/test_omega_org_fam_massive.py
      - run: python tools/generate_omega_org_fam_massive.py --root "$RUNNER_TEMP/omega-org" --family-records 4096
