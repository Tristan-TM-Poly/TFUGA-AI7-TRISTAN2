name: Omega Real Connectors One-Shot Convergence

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-real-connectors-convergence
  cancel-in-progress: false

jobs:
  converge:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feat/omega-legal-production-r03-r05-real-connectors') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/feat/omega-legal-production-r03-r05-real-connectors')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omega-legal-production-r03-r05-real-connectors
          fetch-depth: 0
      - name: Merge current main with strict conflict allowlist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "omega-convergence-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch already contains current main."
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts detected:\n%s\n' "${conflicts[*]}"
            for path in "${conflicts[@]}"; do
              if [ "$path" != "pyproject.toml" ]; then
                echo "Unexpected conflict: $path" >&2
                git merge --abort
                exit 2
              fi
            done
            git checkout --ours -- pyproject.toml
            git add -- pyproject.toml
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain" >&2
            git merge --abort
            exit 3
          fi

          git commit -m "chore: converge real connectors with current main"
          git push origin HEAD:feat/omega-legal-production-r03-r05-real-connectors
