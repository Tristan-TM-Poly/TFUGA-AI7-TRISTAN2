name: Ω GitHub Cumulative Memory OAK

on:
  pull_request:
    paths:
      - "omega_capability_os_t/github_memory*.py"
      - "tests/test_omega_capability_os_github_memory.py"
      - "examples/github_memory_request.json"
      - "examples/capability_os_registry.json"
      - "docs/OMEGA_GITHUB_CUMULATIVE_MEMORY_T.md"
      - ".agents/skills/github-cumulative-memory/**"
      - ".github/workflows/github-cumulative-memory-oak.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  github-memory-oak:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: GitHub cumulative memory OAK court
        run: python -m pytest -q tests/test_omega_capability_os_github_memory.py
      - name: Compile sources
        run: python -m compileall -q omega_capability_os_t
      - name: Refresh all-PR metadata memory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_memory_cli build \
            --repository "$GITHUB_REPOSITORY" \
            --registry examples/capability_os_registry.json \
            --without-files \
            --output /tmp/omega-github-memory.json
      - name: Compile bounded LLMT context
        run: |
          python -m omega_capability_os_t.github_memory_cli context \
            /tmp/omega-github-memory.json \
            examples/github_memory_request.json \
            --max-items 8 \
            --output /tmp/omega-github-llmt-context.json
          python - <<'PY'
          import json
          from pathlib import Path

          memory = json.loads(Path("/tmp/omega-github-memory.json").read_text())
          context = json.loads(Path("/tmp/omega-github-llmt-context.json").read_text())
          assert memory["schema"] == "omega-github-memory-index/v0.1.0", memory.get("schema")
          assert len(memory["prs"]) >= 1, "live repository should expose at least one PR"
          assert len(memory["capabilities"]) >= 4, "Capability OS registry was not ingested"
          assert context["schema"] == "omega-github-llmt-context/v1", context.get("schema")
          assert context["decision"]["creation_allowed"] is False, context["decision"]
          assert context["decision"]["action"] in {"REUSE", "COMPOSE", "EXTEND", "INSPECT"}, context["decision"]
          assert len(memory["fingerprint"]) == 64
          assert len(context["fingerprint"]) == 64
          print(json.dumps({
              "pr_count": len(memory["prs"]),
              "capability_count": len(memory["capabilities"]),
              "decision": context["decision"]["action"],
              "residual_outputs": context["decision"]["residual_outputs"],
              "memory_fingerprint": memory["fingerprint"],
              "context_fingerprint": context["fingerprint"],
          }, indent=2))
          PY
      - name: Retain bounded memory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omega-github-cumulative-memory-${{ github.run_id }}
          path: |
            /tmp/omega-github-memory.json
            /tmp/omega-github-llmt-context.json
          retention-days: 14
