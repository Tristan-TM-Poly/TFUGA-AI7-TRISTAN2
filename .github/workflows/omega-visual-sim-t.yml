name: omega-visual-sim-t

on:
  push:
    paths:
      - "omega_visual_sim_t/**"
      - ".github/workflows/omega-visual-sim-t.yml"
  pull_request:
    paths:
      - "omega_visual_sim_t/**"
      - ".github/workflows/omega-visual-sim-t.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: omega_visual_sim_t/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e omega_visual_sim_t
      - name: Unit and negative tests
        run: cd omega_visual_sim_t && python -m unittest discover -s tests -v
      - name: Compile reference animation
        run: omega-visual render omega_visual_sim_t/examples/oscillator.json --output /tmp/omega-visual-demo
      - name: Verify provenance
        run: omega-visual verify /tmp/omega-visual-demo/manifest.json
      - name: Compile web-attachable SimCapsule
        run: omega-visual capsule omega_visual_sim_t/examples/oscillator.json --seed 7 --output /tmp/omega-visual-demo/capsule.json
      - name: Verify attachment invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          capsule = json.loads(Path('/tmp/omega-visual-demo/capsule.json').read_text())
          assert capsule['protocol'] == 'OMEGA-SIM-ATTACH/0.2'
          assert capsule['attachment']['slot'] == 'SimSlot'
          assert capsule['oak']['scientific_status'] == 'SIMULATED'
          assert capsule['oak']['simulation_is_proof'] is False
          assert capsule['reproducibility']['content_addressed'] is True
          PY
