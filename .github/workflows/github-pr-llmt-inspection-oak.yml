name: Ω GitHub PR LLMT Inspection OAK

on:
  pull_request:
    paths:
      - "omega_capability_os_t/github_memory_zoom.py"
      - "omega_capability_os_t/github_pr_llmt.py"
      - "omega_capability_os_t/github_pr_llmt_inspection.py"
      - "tests/test_omega_capability_os_github_memory_zoom.py"
      - "tests/test_omega_github_pr_llmt.py"
      - "tests/test_omega_github_pr_llmt_inspection.py"
      - ".agents/skills/github-pr-llmt/**"
      - ".github/workflows/github-pr-llmt-inspection-oak.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-llmt-inspection-oak:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Deterministic inspection court
        run: |
          python -m pytest -q \
            tests/test_omega_capability_os_github_memory_zoom.py \
            tests/test_omega_github_pr_llmt.py \
            tests/test_omega_github_pr_llmt_inspection.py

      - name: Compile sources
        run: python -m compileall -q omega_capability_os_t

      - name: Refresh complete PR memory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_memory_cli build \
            --repository "$GITHUB_REPOSITORY" \
            --without-files \
            --max-prs 1000 \
            --output /tmp/omega-pr-llmt-index.json

      - name: Compile all open PR LLMT packets
        run: |
          python -m omega_capability_os_t.github_pr_llmt portfolio \
            /tmp/omega-pr-llmt-index.json \
            --top-k 8 \
            --output /tmp/omega-pr-llmt-portfolio.json

      - name: Inspect highest-fanout unique PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_pr_llmt_inspection inspect \
            /tmp/omega-pr-llmt-index.json \
            /tmp/omega-pr-llmt-portfolio.json \
            --max-candidates 12 \
            --max-files-per-pr 4 \
            --output-index /tmp/omega-pr-llmt-inspected-index.json \
            --output-plan /tmp/omega-pr-llmt-inspection-plan.json \
            --output-overlay /tmp/omega-pr-llmt-inspection-overlay.json

      - name: OAK live assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          portfolio = json.loads(Path("/tmp/omega-pr-llmt-portfolio.json").read_text())
          plan = json.loads(Path("/tmp/omega-pr-llmt-inspection-plan.json").read_text())
          overlay = json.loads(Path("/tmp/omega-pr-llmt-inspection-overlay.json").read_text())

          assert plan["schema"] == "omega-pr-llmt-inspection-plan/v0.1.0"
          assert overlay["schema"] == "omega-pr-llmt-inspection-overlay/v0.1.0"
          assert plan["portfolio_fingerprint"] == portfolio["fingerprint"]
          assert overlay["portfolio_fingerprint"] == portfolio["fingerprint"]
          assert plan["operational_budget"]["max_candidates"] == 12
          assert plan["operational_budget"]["architecture_hard_cap"] is False
          assert plan["planned_unique_ref_count"] == portfolio["unique_candidate_ref_count"]
          assert plan["selected_ref_count"] <= 12
          assert plan["selected_ref_count"] + plan["backlog_ref_count"] == plan["planned_unique_ref_count"]
          assert overlay["selected_ref_count"] == plan["selected_ref_count"]
          assert overlay["hydrated_ref_count"] <= overlay["selected_ref_count"]
          assert overlay["authority"]["write_authority_granted"] is False
          assert overlay["authority"]["merge_authority_granted"] is False
          assert len(plan["fingerprint"]) == 64
          assert len(overlay["fingerprint"]) == 64

          top = plan["candidates"][:12]
          assert [row["ref"] for row in top] == plan["selected_refs"]
          assert all(top[i]["fanout"] >= top[i + 1]["fanout"] for i in range(len(top) - 1))

          print(json.dumps({
              "open_pr_packets": portfolio["packet_count"],
              "planned_unique_refs": plan["planned_unique_ref_count"],
              "selected_refs": plan["selected_ref_count"],
              "backlog_refs": plan["backlog_ref_count"],
              "selected_packet_coverage": plan["selected_packet_coverage_count"],
              "selected_packet_coverage_fraction": plan["selected_packet_coverage_fraction"],
              "selected_pair_count": plan["selected_pair_count"],
              "hydrated_refs": overlay["hydrated_ref_count"],
              "changed_files": overlay["changed_file_count"],
              "static_symbols": overlay["symbol_count"],
              "inspection_errors": overlay["error_count"],
              "packet_coverage_after_hydration": overlay["packet_coverage_after_successful_hydration"],
              "top_candidates": [
                  {
                      "ref": row["ref"],
                      "fanout": row["fanout"],
                      "best_rank": row["best_historical_rank"],
                      "axes": row["evidence_axes"],
                  }
                  for row in top
              ],
              "plan_fingerprint": plan["fingerprint"],
              "overlay_fingerprint": overlay["fingerprint"],
          }, indent=2))
          PY

      - name: Retain exact inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: omega-pr-llmt-inspection-${{ github.run_id }}
          path: |
            /tmp/omega-pr-llmt-portfolio.json
            /tmp/omega-pr-llmt-inspection-plan.json
            /tmp/omega-pr-llmt-inspection-overlay.json
            /tmp/omega-pr-llmt-inspected-index.json
          retention-days: 14
