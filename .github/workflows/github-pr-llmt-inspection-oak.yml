name: Ω GitHub PR LLMT Inspection OAK

on:
  pull_request:
    paths:
      - "omega_capability_os_t/github_memory_zoom.py"
      - "omega_capability_os_t/github_pr_llmt.py"
      - "omega_capability_os_t/github_pr_llmt_inspection.py"
      - "omega_capability_os_t/github_pr_llmt_targets.py"
      - "omega_capability_os_t/github_pr_llmt_findings.py"
      - "tests/test_omega_capability_os_github_memory_zoom.py"
      - "tests/test_omega_github_pr_llmt.py"
      - "tests/test_omega_github_pr_llmt_inspection.py"
      - "tests/test_omega_github_pr_llmt_targets.py"
      - "tests/test_omega_github_pr_llmt_findings.py"
      - ".agents/skills/github-pr-llmt/**"
      - ".github/workflows/github-pr-llmt-inspection-oak.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-llmt-inspection-oak:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Deterministic inspection court
        run: |
          python -m pytest -q \
            tests/test_omega_capability_os_github_memory_zoom.py \
            tests/test_omega_github_pr_llmt.py \
            tests/test_omega_github_pr_llmt_inspection.py \
            tests/test_omega_github_pr_llmt_targets.py \
            tests/test_omega_github_pr_llmt_findings.py

      - name: Compile sources
        run: python -m compileall -q omega_capability_os_t

      - name: Refresh complete PR memory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_memory_cli build \
            --repository "$GITHUB_REPOSITORY" \
            --without-files \
            --max-prs 1000 \
            --output /tmp/omega-pr-llmt-index.json

      - name: Compile all open PR LLMT packets
        run: |
          python -m omega_capability_os_t.github_pr_llmt portfolio \
            /tmp/omega-pr-llmt-index.json \
            --top-k 8 \
            --output /tmp/omega-pr-llmt-portfolio.json

      - name: Hydrate changed-file graph for every open PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_pr_llmt_targets \
            /tmp/omega-pr-llmt-index.json \
            /tmp/omega-pr-llmt-portfolio.json \
            --output-index /tmp/omega-pr-llmt-target-index.json \
            --output /tmp/omega-pr-llmt-target-filegraph.json

      - name: Inspect highest-fanout unique historical PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_pr_llmt_inspection inspect \
            /tmp/omega-pr-llmt-target-index.json \
            /tmp/omega-pr-llmt-portfolio.json \
            --max-candidates 12 \
            --max-files-per-pr 4 \
            --output-index /tmp/omega-pr-llmt-inspected-index.json \
            --output-plan /tmp/omega-pr-llmt-inspection-plan.json \
            --output-overlay /tmp/omega-pr-llmt-inspection-overlay.json

      - name: Compile evidence-bound finding set for every open PR
        run: |
          python -m omega_capability_os_t.github_pr_llmt_findings \
            /tmp/omega-pr-llmt-portfolio.json \
            /tmp/omega-pr-llmt-target-filegraph.json \
            /tmp/omega-pr-llmt-inspection-overlay.json \
            --output /tmp/omega-pr-llmt-findings.json

      - name: OAK live assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          portfolio = json.loads(Path("/tmp/omega-pr-llmt-portfolio.json").read_text())
          filegraph = json.loads(Path("/tmp/omega-pr-llmt-target-filegraph.json").read_text())
          plan = json.loads(Path("/tmp/omega-pr-llmt-inspection-plan.json").read_text())
          overlay = json.loads(Path("/tmp/omega-pr-llmt-inspection-overlay.json").read_text())
          findings = json.loads(Path("/tmp/omega-pr-llmt-findings.json").read_text())

          assert portfolio["schema"] == "omega-pr-llmt-portfolio/v0.1.0"
          assert filegraph["schema"] == "omega-pr-llmt-target-filegraph/v0.1.0"
          assert plan["schema"] == "omega-pr-llmt-inspection-plan/v0.1.0"
          assert overlay["schema"] == "omega-pr-llmt-inspection-overlay/v0.1.0"
          assert findings["schema"] == "omega-pr-llmt-findings/v0.1.0"
          assert filegraph["portfolio_fingerprint"] == portfolio["fingerprint"]
          assert plan["portfolio_fingerprint"] == portfolio["fingerprint"]
          assert overlay["portfolio_fingerprint"] == portfolio["fingerprint"]
          assert findings["portfolio_fingerprint"] == portfolio["fingerprint"]
          assert findings["filegraph_fingerprint"] == filegraph["fingerprint"]
          assert findings["inspection_overlay_fingerprint"] == overlay["fingerprint"]

          assert filegraph["operational_budget"]["max_targets"] is None
          assert filegraph["operational_budget"]["architecture_hard_cap"] is False
          assert filegraph["operational_budget"]["selected_target_count"] == portfolio["packet_count"]
          assert filegraph["hydrated_target_count"] == portfolio["packet_count"]
          assert filegraph["error_count"] == 0, filegraph["progressive_retrieval"]["errors"]
          assert filegraph["authority"]["write_authority_granted"] is False
          assert filegraph["authority"]["merge_authority_granted"] is False
          assert len(filegraph["fingerprint"]) == 64

          assert plan["operational_budget"]["max_candidates"] == 12
          assert plan["operational_budget"]["architecture_hard_cap"] is False
          assert plan["planned_unique_ref_count"] == portfolio["unique_candidate_ref_count"]
          assert plan["selected_ref_count"] <= 12
          assert plan["selected_ref_count"] + plan["backlog_ref_count"] == plan["planned_unique_ref_count"]
          assert overlay["selected_ref_count"] == plan["selected_ref_count"]
          assert overlay["hydrated_ref_count"] <= overlay["selected_ref_count"]
          assert overlay["authority"]["write_authority_granted"] is False
          assert overlay["authority"]["merge_authority_granted"] is False
          assert len(plan["fingerprint"]) == 64
          assert len(overlay["fingerprint"]) == 64

          assert findings["packet_count"] == portfolio["packet_count"]
          assert findings["packets_with_file_overlap"] == filegraph["targets_with_file_overlap_count"]
          assert findings["authority"]["write_authority_granted"] is False
          assert findings["authority"]["merge_authority_granted"] is False
          assert "PRIORITY_SCORE != QUALITY_SCORE" in findings["oak_boundaries"]
          assert "FILE_OVERLAP != MERGE_CONFLICT" in findings["oak_boundaries"]
          assert len(findings["fingerprint"]) == 64
          assert all(row["findings"] for row in findings["packets"])

          top = plan["candidates"][:12]
          assert [row["ref"] for row in top] == plan["selected_refs"]
          assert all(top[i]["fanout"] >= top[i + 1]["fanout"] for i in range(len(top) - 1))

          print(json.dumps({
              "open_pr_packets": portfolio["packet_count"],
              "target_changed_file_observations": filegraph["total_changed_file_observations"],
              "target_unique_changed_files": filegraph["unique_changed_file_count"],
              "target_shared_files": filegraph["shared_file_count"],
              "target_overlap_edges": filegraph["overlap_edge_count"],
              "targets_with_overlap": filegraph["targets_with_file_overlap_count"],
              "targets_with_overlap_fraction": filegraph["targets_with_file_overlap_fraction"],
              "target_file_count_median": filegraph["changed_file_distribution"]["median"],
              "target_file_count_p90": filegraph["changed_file_distribution"]["p90"],
              "large_change_candidates": filegraph["changed_file_distribution"]["large_change_candidate_count"],
              "top_shared_files": filegraph["shared_files"][:12],
              "top_overlap_edges": filegraph["overlap_edges"][:12],
              "planned_unique_refs": plan["planned_unique_ref_count"],
              "selected_refs": plan["selected_ref_count"],
              "backlog_refs": plan["backlog_ref_count"],
              "selected_packet_coverage": plan["selected_packet_coverage_count"],
              "selected_packet_coverage_fraction": plan["selected_packet_coverage_fraction"],
              "selected_pair_count": plan["selected_pair_count"],
              "hydrated_refs": overlay["hydrated_ref_count"],
              "candidate_changed_files": overlay["changed_file_count"],
              "candidate_static_symbols": overlay["symbol_count"],
              "inspection_errors": overlay["error_count"],
              "packet_coverage_after_hydration": overlay["packet_coverage_after_successful_hydration"],
              "finding_counts": findings["finding_counts"],
              "packets_without_deep_reuse_evidence": findings["packets_without_deep_reuse_evidence"],
              "top_priority_targets": [
                  {
                      "ref": row["target_ref"],
                      "score": row["priority_score"],
                      "overlap_neighbors": row["file_overlap_neighbor_count"],
                      "max_shared_files": row["max_shared_file_count"],
                      "inspected_reuse_candidates": row["inspected_reuse_candidate_count"],
                      "finding_types": [finding["finding_type"] for finding in row["findings"]],
                  }
                  for row in findings["packets"][:12]
              ],
              "top_candidates": [
                  {
                      "ref": row["ref"],
                      "fanout": row["fanout"],
                      "best_rank": row["best_historical_rank"],
                      "axes": row["evidence_axes"],
                  }
                  for row in top
              ],
              "filegraph_fingerprint": filegraph["fingerprint"],
              "plan_fingerprint": plan["fingerprint"],
              "overlay_fingerprint": overlay["fingerprint"],
              "findings_fingerprint": findings["fingerprint"],
          }, indent=2))
          PY

      - name: Retain exact inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: omega-pr-llmt-inspection-${{ github.run_id }}
          path: |
            /tmp/omega-pr-llmt-portfolio.json
            /tmp/omega-pr-llmt-target-filegraph.json
            /tmp/omega-pr-llmt-inspection-plan.json
            /tmp/omega-pr-llmt-inspection-overlay.json
            /tmp/omega-pr-llmt-findings.json
            /tmp/omega-pr-llmt-inspected-index.json
          retention-days: 14
