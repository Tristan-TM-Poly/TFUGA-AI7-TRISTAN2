name: Ω GitHub PR LLMT Inspection OAK

on:
  pull_request:
    paths:
      - "omega_capability_os_t/github_memory_zoom.py"
      - "omega_capability_os_t/github_pr_llmt.py"
      - "omega_capability_os_t/github_pr_llmt_inspection.py"
      - "omega_capability_os_t/github_pr_llmt_targets.py"
      - "omega_capability_os_t/github_pr_llmt_findings.py"
      - "tests/test_omega_capability_os_github_memory_zoom.py"
      - "tests/test_omega_github_pr_llmt.py"
      - "tests/test_omega_github_pr_llmt_inspection.py"
      - "tests/test_omega_github_pr_llmt_marginal_coverage.py"
      - "tests/test_omega_github_pr_llmt_targets.py"
      - "tests/test_omega_github_pr_llmt_findings.py"
      - ".agents/skills/github-pr-llmt/**"
      - ".github/workflows/github-pr-llmt-inspection-oak.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-llmt-inspection-oak:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Deterministic inspection court
        run: |
          python -m pytest -q \
            tests/test_omega_capability_os_github_memory_zoom.py \
            tests/test_omega_github_pr_llmt.py \
            tests/test_omega_github_pr_llmt_inspection.py \
            tests/test_omega_github_pr_llmt_marginal_coverage.py \
            tests/test_omega_github_pr_llmt_targets.py \
            tests/test_omega_github_pr_llmt_findings.py

      - name: Compile sources
        run: python -m compileall -q omega_capability_os_t

      - name: Refresh complete PR memory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_memory_cli build \
            --repository "$GITHUB_REPOSITORY" \
            --without-files \
            --max-prs 1000 \
            --output /tmp/omega-pr-llmt-index.json

      - name: Compile all open PR LLMT packets
        run: |
          python -m omega_capability_os_t.github_pr_llmt portfolio \
            /tmp/omega-pr-llmt-index.json \
            --top-k 8 \
            --output /tmp/omega-pr-llmt-portfolio.json

      - name: Hydrate changed-file graph for every open PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_pr_llmt_targets \
            /tmp/omega-pr-llmt-index.json \
            /tmp/omega-pr-llmt-portfolio.json \
            --output-index /tmp/omega-pr-llmt-target-index.json \
            --output /tmp/omega-pr-llmt-target-filegraph.json

      - name: Deep inspection wave 1 - greedy marginal coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_pr_llmt_inspection inspect \
            /tmp/omega-pr-llmt-target-index.json \
            /tmp/omega-pr-llmt-portfolio.json \
            --max-candidates 12 \
            --max-files-per-pr 4 \
            --output-index /tmp/omega-pr-llmt-inspected-index-wave1.json \
            --output-plan /tmp/omega-pr-llmt-inspection-plan-wave1.json \
            --output-overlay /tmp/omega-pr-llmt-inspection-overlay-wave1.json \
            --output-checkpoint /tmp/omega-pr-llmt-inspection-checkpoint-wave1.json

      - name: Deep inspection wave 2 - resume with marginal uncovered coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_pr_llmt_inspection inspect \
            /tmp/omega-pr-llmt-inspected-index-wave1.json \
            /tmp/omega-pr-llmt-portfolio.json \
            --checkpoint /tmp/omega-pr-llmt-inspection-checkpoint-wave1.json \
            --prior-overlay /tmp/omega-pr-llmt-inspection-overlay-wave1.json \
            --max-candidates 12 \
            --max-files-per-pr 4 \
            --output-index /tmp/omega-pr-llmt-inspected-index.json \
            --output-plan /tmp/omega-pr-llmt-inspection-plan-wave2.json \
            --output-overlay /tmp/omega-pr-llmt-inspection-overlay.json \
            --output-checkpoint /tmp/omega-pr-llmt-inspection-checkpoint.json

      - name: Compile evidence-bound finding set for every open PR
        run: |
          python -m omega_capability_os_t.github_pr_llmt_findings \
            /tmp/omega-pr-llmt-portfolio.json \
            /tmp/omega-pr-llmt-target-filegraph.json \
            /tmp/omega-pr-llmt-inspection-overlay.json \
            --output /tmp/omega-pr-llmt-findings.json

      - name: OAK live assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          portfolio = json.loads(Path("/tmp/omega-pr-llmt-portfolio.json").read_text())
          filegraph = json.loads(Path("/tmp/omega-pr-llmt-target-filegraph.json").read_text())
          plan1 = json.loads(Path("/tmp/omega-pr-llmt-inspection-plan-wave1.json").read_text())
          checkpoint1 = json.loads(Path("/tmp/omega-pr-llmt-inspection-checkpoint-wave1.json").read_text())
          overlay1 = json.loads(Path("/tmp/omega-pr-llmt-inspection-overlay-wave1.json").read_text())
          plan2 = json.loads(Path("/tmp/omega-pr-llmt-inspection-plan-wave2.json").read_text())
          checkpoint2 = json.loads(Path("/tmp/omega-pr-llmt-inspection-checkpoint.json").read_text())
          overlay = json.loads(Path("/tmp/omega-pr-llmt-inspection-overlay.json").read_text())
          findings = json.loads(Path("/tmp/omega-pr-llmt-findings.json").read_text())

          assert portfolio["schema"] == "omega-pr-llmt-portfolio/v0.1.0"
          assert filegraph["schema"] == "omega-pr-llmt-target-filegraph/v0.2.0"
          assert plan1["schema"] == "omega-pr-llmt-inspection-plan/v0.1.0"
          assert plan2["schema"] == "omega-pr-llmt-inspection-plan/v0.1.0"
          assert checkpoint1["schema"] == "omega-pr-llmt-inspection-checkpoint/v0.1.0"
          assert checkpoint2["schema"] == "omega-pr-llmt-inspection-checkpoint/v0.1.0"
          assert overlay["schema"] == "omega-pr-llmt-inspection-overlay/v0.1.0"
          assert findings["schema"] == "omega-pr-llmt-findings/v0.2.0"
          assert all(obj["portfolio_fingerprint"] == portfolio["fingerprint"] for obj in (filegraph, plan1, plan2, overlay, findings, checkpoint1, checkpoint2))
          assert findings["filegraph_fingerprint"] == filegraph["fingerprint"]
          assert findings["inspection_overlay_fingerprint"] == overlay["fingerprint"]

          assert filegraph["operational_budget"]["max_targets"] is None
          assert filegraph["operational_budget"]["architecture_hard_cap"] is False
          assert filegraph["operational_budget"]["selected_target_count"] == portfolio["packet_count"]
          assert filegraph["hydrated_target_count"] == portfolio["packet_count"]
          assert filegraph["error_count"] == 0, filegraph["progressive_retrieval"]["errors"]
          assert filegraph["reconstruction_pair_count"] >= 2, filegraph["reconstruction_pairs"]

          marginal_policy = "greedy_marginal_uncovered_packet_coverage/v0.1"
          assert plan1["selection_policy"] == marginal_policy
          assert plan2["selection_policy"] == marginal_policy
          assert plan1["operational_budget"]["max_candidates"] == 12
          assert plan2["operational_budget"]["max_candidates"] == 12
          assert plan1["operational_budget"]["architecture_hard_cap"] is False
          assert plan2["operational_budget"]["architecture_hard_cap"] is False
          assert plan1["planned_unique_ref_count"] == portfolio["unique_candidate_ref_count"]
          assert plan2["planned_unique_ref_count"] == portfolio["unique_candidate_ref_count"]
          assert plan1["completed_current_ref_count"] == 0
          assert plan1["selected_ref_count"] <= 12
          assert plan1["selected_marginal_pair_count"] == plan1["selected_new_packet_coverage_count"]
          assert plan1["remaining_uncovered_packet_count_after_selection"] == portfolio["packet_count"] - plan1["projected_packet_coverage_after_selection_count"]
          assert checkpoint1["completed_ref_count"] == overlay1["cumulative_hydrated_ref_count"]
          assert overlay1["error_count"] == 0, overlay1.get("errors", [])
          assert overlay1["packet_coverage_after_successful_hydration"] == plan1["projected_packet_coverage_after_selection_count"]
          assert plan2["completed_current_ref_count"] == checkpoint1["completed_ref_count"]
          assert set(plan1["selected_refs"]).isdisjoint(plan2["selected_refs"])
          assert plan2["selected_ref_count"] <= 12
          assert plan2["selected_marginal_pair_count"] == plan2["selected_new_packet_coverage_count"]
          assert plan2["remaining_uncovered_packet_count_after_selection"] == portfolio["packet_count"] - plan2["projected_packet_coverage_after_selection_count"]
          assert plan2["selected_new_packet_coverage_count"] == plan2["projected_packet_coverage_after_selection_count"] - plan2["completed_packet_coverage_count"]
          assert plan2["completed_current_ref_count"] + plan2["selected_ref_count"] + plan2["backlog_ref_count"] == plan2["planned_unique_ref_count"]
          assert checkpoint2["completed_ref_count"] == overlay["cumulative_hydrated_ref_count"]
          assert checkpoint2["completed_ref_count"] >= checkpoint1["completed_ref_count"]
          assert plan2["stale_checkpoint_ref_count"] == 0
          assert plan2["unverifiable_checkpoint_ref_count"] == 0
          assert overlay["error_count"] == 0, overlay.get("errors", [])
          assert overlay["packet_coverage_after_successful_hydration"] == plan2["projected_packet_coverage_after_selection_count"]
          assert overlay["packet_coverage_after_successful_hydration"] - overlay1["packet_coverage_after_successful_hydration"] == plan2["selected_new_packet_coverage_count"]
          assert overlay["authority"]["write_authority_granted"] is False
          assert overlay["authority"]["merge_authority_granted"] is False

          assert findings["packet_count"] == portfolio["packet_count"]
          assert findings["packets_with_file_overlap"] == filegraph["targets_with_file_overlap_count"]
          assert findings["reconstruction_pair_count"] == filegraph["reconstruction_pair_count"]
          assert findings["finding_counts"].get("DECLARED_RECONSTRUCTION_PAIR", 0) >= 2
          assert findings["finding_counts"].get("DECLARED_RECONSTRUCTION_SOURCE", 0) >= 2
          assert findings["authority"]["write_authority_granted"] is False
          assert findings["authority"]["merge_authority_granted"] is False
          assert "PRIORITY_SCORE != QUALITY_SCORE" in findings["oak_boundaries"]
          assert "RECONSTRUCTION_PAIR != AUTOMATIC_SUPERSESSION" in findings["oak_boundaries"]
          assert all(len(obj["fingerprint"]) == 64 for obj in (filegraph, plan1, plan2, overlay, findings, checkpoint1, checkpoint2))
          assert all(row["findings"] for row in findings["packets"])

          print(json.dumps({
              "open_pr_packets": portfolio["packet_count"],
              "target_changed_file_observations": filegraph["total_changed_file_observations"],
              "target_unique_changed_files": filegraph["unique_changed_file_count"],
              "target_shared_files": filegraph["shared_file_count"],
              "target_overlap_edges": filegraph["overlap_edge_count"],
              "targets_with_overlap": filegraph["targets_with_file_overlap_count"],
              "reconstruction_pair_count": filegraph["reconstruction_pair_count"],
              "reconstruction_pairs": filegraph["reconstruction_pairs"],
              "selection_policy": plan2["selection_policy"],
              "planned_unique_refs": plan2["planned_unique_ref_count"],
              "wave1_selected_refs": plan1["selected_ref_count"],
              "wave1_completed_refs": checkpoint1["completed_ref_count"],
              "wave1_selected_new_packet_coverage": plan1["selected_new_packet_coverage_count"],
              "wave1_projected_packet_coverage": plan1["projected_packet_coverage_after_selection_count"],
              "wave1_packet_coverage": overlay1["packet_coverage_after_successful_hydration"],
              "wave1_remaining_uncovered": plan1["remaining_uncovered_packet_count_after_selection"],
              "wave2_precompleted_refs": plan2["completed_current_ref_count"],
              "wave2_selected_refs": plan2["selected_ref_count"],
              "wave2_selected_new_packet_coverage": plan2["selected_new_packet_coverage_count"],
              "wave2_selected_marginal_pairs": plan2["selected_marginal_pair_count"],
              "wave2_projected_packet_coverage": plan2["projected_packet_coverage_after_selection_count"],
              "wave2_remaining_uncovered": plan2["remaining_uncovered_packet_count_after_selection"],
              "final_completed_refs": checkpoint2["completed_ref_count"],
              "final_backlog_refs": plan2["backlog_ref_count"],
              "final_packet_coverage": overlay["packet_coverage_after_successful_hydration"],
              "wave2_changed_files": overlay["changed_file_count"],
              "wave2_static_symbols": overlay["symbol_count"],
              "wave2_errors": overlay["error_count"],
              "cumulative_overlay_count": overlay["cumulative_overlay_count"],
              "finding_counts": findings["finding_counts"],
              "packets_without_deep_reuse_evidence": findings["packets_without_deep_reuse_evidence"],
              "top_priority_targets": [
                  {
                      "ref": row["target_ref"],
                      "score": row["priority_score"],
                      "max_shared_files": row["max_shared_file_count"],
                      "reconstruction_as_target": row["reconstruction_as_target_count"],
                      "reconstruction_as_source": row["reconstruction_as_source_count"],
                      "inspected_reuse_candidates": row["inspected_reuse_candidate_count"],
                      "finding_types": [finding["finding_type"] for finding in row["findings"]],
                  }
                  for row in findings["packets"][:12]
              ],
              "filegraph_fingerprint": filegraph["fingerprint"],
              "checkpoint_fingerprint": checkpoint2["fingerprint"],
              "overlay_fingerprint": overlay["fingerprint"],
              "findings_fingerprint": findings["fingerprint"],
          }, indent=2))
          PY

      - name: Retain exact inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: omega-pr-llmt-inspection-${{ github.run_id }}
          path: |
            /tmp/omega-pr-llmt-portfolio.json
            /tmp/omega-pr-llmt-target-filegraph.json
            /tmp/omega-pr-llmt-inspection-plan-wave1.json
            /tmp/omega-pr-llmt-inspection-checkpoint-wave1.json
            /tmp/omega-pr-llmt-inspection-overlay-wave1.json
            /tmp/omega-pr-llmt-inspection-plan-wave2.json
            /tmp/omega-pr-llmt-inspection-checkpoint.json
            /tmp/omega-pr-llmt-inspection-overlay.json
            /tmp/omega-pr-llmt-findings.json
            /tmp/omega-pr-llmt-inspected-index.json
          retention-days: 14
