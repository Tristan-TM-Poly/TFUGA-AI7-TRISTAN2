name: Ω-COMPANY-AUTOPILOT-T OAKBench

on:
  pull_request:
    paths:
      - 'omega_company_autopilot_t/**'
      - 'tests/test_omega_company_autopilot.py'
      - 'tests/test_omega_company_policy_atlas.py'
      - 'tools/generate_omega_company_policy_atlas.py'
      - 'company_os/config/**'
      - 'schemas/omega_company_record.schema.json'
      - '.github/workflows/omega-company-autopilot-oakbench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile Company Autopilot
        run: python -m compileall omega_company_autopilot_t tools/generate_omega_company_policy_atlas.py
      - name: Run targeted regression suite
        run: python -m pytest -q tests/test_omega_company_autopilot.py tests/test_omega_company_policy_atlas.py
      - name: Materialize 55,296 CVCD policy cells
        run: python tools/generate_omega_company_policy_atlas.py --root generated/omega_company_autopilot_r01_cvcd
      - name: Audit materialized atlas
        run: |
          python -m omega_company_autopilot_t.policy_atlas generated/omega_company_autopilot_r01_cvcd --audit
          test "$(find generated/omega_company_autopilot_r01_cvcd -name '*.cells' -type f | wc -l)" -eq 1152
          test "$(find generated/omega_company_autopilot_r01_cvcd -name '*.cells' -type f -print0 | xargs -0 cat | wc -l)" -eq 55296
      - name: Verify deterministic regeneration
        run: |
          first=$(sha256sum generated/omega_company_autopilot_r01_cvcd/manifest.json | cut -d' ' -f1)
          python tools/generate_omega_company_policy_atlas.py --root generated/omega_company_autopilot_r01_cvcd >/tmp/second.json
          second=$(sha256sum generated/omega_company_autopilot_r01_cvcd/manifest.json | cut -d' ' -f1)
          test "$first" = "$second"
      - uses: actions/upload-artifact@v4
        with:
          name: omega-company-autopilot-policy-atlas
          path: generated/omega_company_autopilot_r01_cvcd/**
          retention-days: 14
