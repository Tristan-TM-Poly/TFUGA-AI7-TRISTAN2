name: Omega Federated Intent Fabric CI

on:
  pull_request:
    paths:
      - "omega_federated_intent_fabric_t/**"
      - "tests/test_omega_federated_intent*.py"
      - "docs/omega_federated_intent_fabric_t/**"
      - ".github/workflows/omega-federated-intent-fabric-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federated-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile package
        run: python -m compileall -q omega_federated_intent_fabric_t
      - name: Federated intent OAK court
        run: python -m pytest -q tests/test_omega_federated_intent*.py
      - name: Authority and closure smoke
        run: |
          python - <<'PY'
          from omega_federated_intent_fabric_t import (
              AuthorityLevel,
              FederatedIntentCompiler,
              IntentClosureCompiler,
              SourceEnvelope,
              SourceKind,
              SourceVisibility,
              to_capability_input,
              to_existing_intent,
          )

          source = SourceEnvelope.build(
              source_kind=SourceKind.GITHUB,
              source_id="ci-fixture",
              fingerprint="ci:fixture",
              observed_at="2026-08-20T00:00:00Z",
              visibility=SourceVisibility.PUBLIC,
              authority=AuthorityLevel.READ,
              claims=("fixture claim",),
              explicit_intents=("verify fixture",),
          )
          receipt = FederatedIntentCompiler().compile([source])
          closure = IntentClosureCompiler().compile(receipt)
          intent = to_existing_intent(receipt)
          capability = to_capability_input(receipt)
          seed = IntentClosureCompiler.next_intent_seed(closure)

          assert receipt.action_authorized is False
          assert closure.action_authorized is False
          assert closure.unlock_set.action_authorized is False
          assert intent.metadata["execution_authorized"] is False
          assert capability["allow_mutation"] is False
          assert capability["allow_irreversible"] is False
          assert seed["authority"]["execution_authorized"] is False
          assert seed["authority"]["merge_authorized"] is False
          print(closure.receipt_sha256)
          PY
