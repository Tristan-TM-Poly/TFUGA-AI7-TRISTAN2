name: omega-doc-factory-oak

on:
  pull_request:
    paths:
      - "omega_latex_t/doc_universe.py"
      - "omega_latex_t/doc_universe_cli.py"
      - "omega_latex_t/doc_factory.py"
      - "omega_latex_t/doc_factory_cli.py"
      - "tests/test_omega_doc_compiler_t_r03.py"
      - "tests/test_omega_doc_factory_t_r10.py"
      - "schemas/omega_doc_universe.schema.json"
      - "schemas/omega_doc_factory.schema.json"
      - "docs/theories/OMEGA_DOC_COMPILER_T_R03.md"
      - "docs/theories/OMEGA_DOC_FACTORY_T_R10.md"
      - "docs/architecture/OMEGA_DOC_FACTORY_T_R10.md"
      - ".github/workflows/omega-doc-compiler-oak.yml"
  push:
    branches: [main]
    paths:
      - "omega_latex_t/doc_universe.py"
      - "omega_latex_t/doc_universe_cli.py"
      - "omega_latex_t/doc_factory.py"
      - "omega_latex_t/doc_factory_cli.py"
      - "tests/test_omega_doc_compiler_t_r03.py"
      - "tests/test_omega_doc_factory_t_r10.py"
      - "schemas/omega_doc_universe.schema.json"
      - "schemas/omega_doc_factory.schema.json"
      - "docs/theories/OMEGA_DOC_COMPILER_T_R03.md"
      - "docs/theories/OMEGA_DOC_FACTORY_T_R10.md"
      - "docs/architecture/OMEGA_DOC_FACTORY_T_R10.md"
      - ".github/workflows/omega-doc-compiler-oak.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-doc-factory-oak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oak:
    name: oak (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile documentation factory
        run: >-
          python -m compileall -q
          omega_latex_t/doc_universe.py
          omega_latex_t/doc_universe_cli.py
          omega_latex_t/doc_factory.py
          omega_latex_t/doc_factory_cli.py
          tests/test_omega_doc_compiler_t_r03.py
          tests/test_omega_doc_factory_t_r10.py

      - name: Run R0.3 regression and R1.0 courts
        run: >-
          python -m pytest -q
          tests/test_omega_doc_compiler_t_r03.py
          tests/test_omega_doc_factory_t_r10.py

      - name: Validate schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in [
              Path("schemas/omega_doc_universe.schema.json"),
              Path("schemas/omega_doc_factory.schema.json"),
          ]:
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
          PY

      - name: Verify campaign CLI
        run: python -m omega_latex_t.doc_factory_cli --help >/dev/null

      - name: Build explicit CI observation receipt
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          source = Path("omega_latex_t/doc_factory.py")
          payload = {
              "receipts": [{
                  "kind": "test-run",
                  "system_id": "omega_latex_t",
                  "artifact_path": source.as_posix(),
                  "source_sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
                  "status": "passed",
                  "observed_at": "",
                  "environment": {
                      "python": "3.12",
                      "runner_os": os.environ.get("RUNNER_OS", ""),
                      "source_sha": os.environ.get("GITHUB_SHA", ""),
                  },
                  "details": {
                      "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
                      "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
                      "court": "focused-r03-r10",
                  },
              }]
          }
          Path("/tmp/omega-doc-execution.json").write_text(
              json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Full repository campaign
        if: matrix.python-version == '3.12'
        run: |
          rm -rf /tmp/omega-doc-factory-1 /tmp/omega-doc-cache
          python -m omega_latex_t.doc_factory_cli . \
            --source-commit "${GITHUB_SHA}" \
            --execution-receipts /tmp/omega-doc-execution.json \
            --cache-dir /tmp/omega-doc-cache \
            --output-dir /tmp/omega-doc-factory-1

      - name: Validate generated R1.0 report and OAK boundaries
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          out = Path("/tmp/omega-doc-factory-1")
          report = json.loads((out / "factory-report.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("schemas/omega_doc_factory.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator(schema).validate(report)
          assert report["factory_version"] == "1.0.0"
          assert report["schema_version"] == "0.3.0"
          assert report["system_count"] >= 1
          assert all(c["status"] == "candidate-unverified" for c in report["claims"])
          assert all(b["support_strength"] == "unknown" for b in report["claim_evidence_bindings"])
          assert all(r["authority"] == "observation-only" for r in report["execution_receipts"])
          assert not any(r["stale"] for r in report["execution_receipts"])
          assert "DOC_GENERATED != SCIENTIFIC_TRUTH" in report["oak_boundaries"]
          assert "CI_GREEN != SCIENTIFIC_TRUTH" in report["oak_boundaries"]
          assert "FAMILY_CANDIDATE != SEMANTIC_EQUIVALENCE" in report["oak_boundaries"]
          assert (out / "MASTER_DOC_ATLAS.md").is_file()
          assert (out / "graph/evidence-graph.graphml").is_file()
          assert (out / "latex/MASTER_DOC_ATLAS.tex").is_file()
          PY

      - name: Deterministic second campaign
        if: matrix.python-version == '3.12'
        run: |
          rm -rf /tmp/omega-doc-factory-2
          python -m omega_latex_t.doc_factory_cli . \
            --source-commit "${GITHUB_SHA}" \
            --execution-receipts /tmp/omega-doc-execution.json \
            --cache-dir /tmp/omega-doc-cache \
            --output-dir /tmp/omega-doc-factory-2 >/tmp/omega-doc-factory-2.stdout
          cmp /tmp/omega-doc-factory-1/MANIFEST.json /tmp/omega-doc-factory-2/MANIFEST.json

      - name: Audit immutable action refs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path(".github/workflows/omega-doc-compiler-oak.yml").read_text(encoding="utf-8")
          refs = re.findall(r'(?m)^\s*uses:\s*([^\s#]+)', text)
          assert refs
          assert not [ref for ref in refs if not re.search(r'@[0-9a-f]{40}$', ref)]
          PY

      - name: Upload deterministic campaign bundle
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-doc-factory-r10-${{ github.run_id }}
          path: /tmp/omega-doc-factory-1/**
          if-no-files-found: error
          retention-days: 30

      - name: Print campaign summary
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/omega-doc-factory-1/factory-report.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "systems": report["system_count"],
              "claims": len(report["claims"]),
              "bindings": len(report["claim_evidence_bindings"]),
              "execution_receipts": len(report["execution_receipts"]),
              "graph_nodes": len(report["graph"]["nodes"]),
              "graph_edges": len(report["graph"]["edges"]),
              "placeholders": report["quality"]["aggregate"]["placeholder_count"],
              "campaign_fingerprint": report["campaign_fingerprint"],
          }, indent=2, sort_keys=True))
          PY
