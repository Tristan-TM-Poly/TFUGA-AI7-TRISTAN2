name: omega-doc-compiler-oak

on:
  pull_request:
    paths:
      - "omega_latex_t/doc_universe.py"
      - "omega_latex_t/doc_universe_cli.py"
      - "tests/test_omega_doc_compiler_t_r03.py"
      - "schemas/omega_doc_universe.schema.json"
      - "docs/theories/OMEGA_DOC_COMPILER_T_R03.md"
      - ".github/workflows/omega-doc-compiler-oak.yml"
  push:
    branches: [main]
    paths:
      - "omega_latex_t/doc_universe.py"
      - "omega_latex_t/doc_universe_cli.py"
      - "tests/test_omega_doc_compiler_t_r03.py"
      - "schemas/omega_doc_universe.schema.json"
      - "docs/theories/OMEGA_DOC_COMPILER_T_R03.md"
      - ".github/workflows/omega-doc-compiler-oak.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-doc-compiler-oak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q omega_latex_t/doc_universe.py omega_latex_t/doc_universe_cli.py tests/test_omega_doc_compiler_t_r03.py
      - name: Unit tests
        run: python tests/test_omega_doc_compiler_t_r03.py -v
      - name: Parse schema
        run: python -c 'import json; json.load(open("schemas/omega_doc_universe.schema.json", encoding="utf-8"))'
      - name: Repository smoke
        run: |
          rm -rf generated/omega_doc_universe_ci
          python -m omega_latex_t.doc_universe_cli . \
            --source-commit "${GITHUB_SHA}" \
            --output-dir generated/omega_doc_universe_ci
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("generated/omega_doc_universe_ci")
          report = json.loads((root / "doc-universe.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert report["schema_version"] == "0.3.0"
          assert report["system_count"] >= 1
          assert manifest["system_count"] == report["system_count"]
          assert "DOC_GENERATED != SCIENTIFIC_TRUTH" in report["systems"][0]["oak_boundaries"]
          assert report["family_boundary"] == "FAMILY_CANDIDATE != SEMANTIC_EQUIVALENCE"
          PY
