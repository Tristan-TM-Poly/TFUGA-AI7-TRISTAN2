name: Omega Research ABI OAK

on:
  pull_request:
    paths:
      - 'omega_research_abi_t/**'
      - 'tests/test_omega_research_abi*.py'
      - 'examples/research_abi_fixture.json'
      - 'schemas/research_abi_r01.schema.json'
      - 'docs/OMEGA_UNIVERSAL_RESEARCH_ABI_T.md'
      - 'docs/OMEGA_UNIVERSAL_RESEARCH_ABI_R02.md'
      - '.github/workflows/omega-research-abi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oak:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q omega_research_abi_t
      - run: pytest -q tests/test_omega_research_abi_t.py tests/test_omega_research_abi_r02.py
      - run: python -m omega_research_abi_t examples/research_abi_fixture.json --compact > /tmp/research-abi.json
