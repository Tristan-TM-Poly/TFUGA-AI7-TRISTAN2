name: Generate Ω-MAIL-T R0.2 Massive

on:
  pull_request:
    paths:
      - 'omega_mail_t/**'
      - 'tools/generate_omega_mail_r02_massive.py'
      - 'tests/test_omega_mail_t.py'
      - 'tests/test_omega_mail_catalog.py'
      - '.github/workflows/generate-omega-mail-r02-massive.yml'
  push:
    branches:
      - main
      - feat/omega-mail-r04-hardening
    paths:
      - 'omega_mail_t/**'
      - 'tools/generate_omega_mail_r02_massive.py'
      - 'tests/test_omega_mail_t.py'
      - 'tests/test_omega_mail_catalog.py'
      - '.github/workflows/generate-omega-mail-r02-massive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Generate 49,152 linked records
        run: python tools/generate_omega_mail_r02_massive.py --root .
      - name: Verify deterministic regeneration
        run: |
          first=$(sha256sum generated/omega_mail_t_r02/manifest.json | cut -d' ' -f1)
          python tools/generate_omega_mail_r02_massive.py --root . >/tmp/omega-mail-second-run.json
          second=$(sha256sum generated/omega_mail_t_r02/manifest.json | cut -d' ' -f1)
          test "$first" = "$second"
      - name: Audit record counts and links
        run: |
          python -m omega_mail_t.catalog_cli audit
          test "$(find generated/omega_mail_t_r02/scenarios -name '*.jsonl' -type f -print0 | xargs -0 cat | wc -l)" -eq 16384
          test "$(find generated/omega_mail_t_r02/benchmarks -name '*.jsonl' -type f -print0 | xargs -0 cat | wc -l)" -eq 32768
      - name: Run Ω-MAIL-T tests
        run: python -m pytest -q tests/test_omega_mail_t.py tests/test_omega_mail_catalog.py
      - name: Upload generated atlas without mutating repository
        uses: actions/upload-artifact@v4
        with:
          name: omega-mail-r02-49152-${{ github.sha }}
          path: generated/omega_mail_t_r02/**
          retention-days: 14
