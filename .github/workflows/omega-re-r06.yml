name: Omega RE R0.6 OAKBench

on:
  pull_request:
    paths:
      - "omega_re_t/*_r06.py"
      - "tests/test_r06_*.py"
      - "docs/omega-re-t/*R0_6*.md"
      - "schemas/omega-re-r06-demo.schema.json"
      - "pyproject.toml"
      - ".github/workflows/omega-re-r06.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile R0.6
        run: python -m compileall -q omega_re_t tests/test_r06_*.py
      - name: Run R0.6 tests
        run: python -m pytest -q tests/test_r06_*.py
      - name: Generate deterministic evidence twice
        run: |
          python -m omega_re_t.r06_cli all --output /tmp/omega-re-r06-a.json
          python -m omega_re_t.r06_cli all --output /tmp/omega-re-r06-b.json
          cmp /tmp/omega-re-r06-a.json /tmp/omega-re-r06-b.json
      - name: Validate schema and boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          payload = json.loads(Path('/tmp/omega-re-r06-a.json').read_text())
          schema = json.loads(Path('schemas/omega-re-r06-demo.schema.json').read_text())
          jsonschema.validate(payload, schema)
          assert payload['calibration_chain']['valid'] is True
          assert payload['experiment_registry']['audit']['valid'] is True
          assert payload['transparency_log']['proof_valid'] is True
          assert payload['transparency_log']['audit']['valid'] is True
          assert payload['sqlite_leases']['summary']['committed'] == 1
          assert payload['boundaries']['external_execution'] is False
          assert payload['boundaries']['scientific_validation'] is False
          assert payload['boundaries']['byzantine_tolerance_certified'] is False
          assert payload['boundaries']['permanent_total_cap'] is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: omega-re-r06-${{ matrix.python-version }}
          path: /tmp/omega-re-r06-a.json
          retention-days: 14
