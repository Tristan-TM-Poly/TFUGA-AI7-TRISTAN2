name: Omega Code Dojo R0.1 OAKBench

on:
  push:
    branches: [feat/omega-code-dojo-t-r0-1]
    paths:
      - "omega_code_dojo_t/**"
      - "tests/test_omega_code_dojo_t.py"
      - "examples/omega_code_dojo_demo.py"
      - "docs/omega-code-dojo-t/**"
      - ".github/workflows/omega-code-dojo-t.yml"
  pull_request:
    paths:
      - "omega_code_dojo_t/**"
      - "tests/test_omega_code_dojo_t.py"
      - "examples/omega_code_dojo_demo.py"
      - "docs/omega-code-dojo-t/**"
      - ".github/workflows/omega-code-dojo-t.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-code-dojo-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile module
        run: python -m compileall -q omega_code_dojo_t tests/test_omega_code_dojo_t.py examples/omega_code_dojo_demo.py
      - name: Run tests
        run: pytest -q tests/test_omega_code_dojo_t.py
      - name: Generate deterministic OAK receipt
        run: |
          python -m omega_code_dojo_t.cli benchmark --output /tmp/dojo-a.json
          python -m omega_code_dojo_t.cli benchmark --output /tmp/dojo-b.json
          cmp /tmp/dojo-a.json /tmp/dojo-b.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/dojo-a.json').read_text())
          assert payload['status'] == 'CERTIFIED_SOFTWARE_FIXTURES_R0_1'
          assert payload['catalog'] == {
              'cases': 17,
              'origins': ['omega-original'],
              'tasks': 4,
          }
          assert payload['oak']['references_pass'] is True
          assert payload['oak']['mutants_rejected'] is True
          assert payload['claims']['hidden_tests_extracted'] is False
          assert payload['claims']['external_submissions_automated'] is False
          print(payload['status'])
          PY
