name: Omega Zeta Cert T OAK

on:
  pull_request:
    paths:
      - 'omega_zeta_cert_t/**'
      - 'tests/test_omega_zeta_cert_t.py'
      - 'docs/OMEGA_ZETA_CERT_T.md'
      - 'data/omega_zeta_cert/**'
      - 'schemas/omega_zeta_cert_cell.schema.json'
      - '.github/workflows/omega-zeta-cert-t.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  oak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'

      - name: Compile
        run: python -m compileall -q omega_zeta_cert_t

      - name: Focused OAK court
        run: python -m pytest -q tests/test_omega_zeta_cert_t.py

      - name: Barrier and cyclic-moment smoke
        run: |
          python -m omega_zeta_cert_t frontier --target 0.70 > /tmp/frontier.json
          python -m omega_zeta_cert_t moments > /tmp/moments.json
          python - <<'PY'
          import json
          frontier = json.load(open('/tmp/frontier.json'))
          moments = json.load(open('/tmp/moments.json'))
          assert frontier['barrier'] == 'new_arithmetic_information_required'
          assert frontier['proof_claimed'] is False
          assert frontier['rh_solved_claimed'] is False
          assert moments['word_mode'] == 'cyclic_trace_words'
          assert moments['order_counts'] == [3, 6, 11, 24]
          assert moments['observable_count'] == 44
          assert moments['proof_claimed'] is False
          PY

      - name: Exact countermodel and dual-kernel smoke
        run: |
          python -m omega_zeta_cert_t countermodel > /tmp/countermodel.json
          python -m omega_zeta_cert_t dual-fixture > /tmp/dual.json
          python -m omega_zeta_cert_t formal-spec > /tmp/formal.json
          python - <<'PY'
          import json
          counter = json.load(open('/tmp/countermodel.json'))
          dual = json.load(open('/tmp/dual.json'))
          formal = json.load(open('/tmp/formal.json'))
          assert counter['cyclic_invariance_holds'] is True
          assert counter['arbitrary_permutation_invariance_fails'] is True
          assert [counter['tr_abc'], counter['tr_bca'], counter['tr_cab'], counter['tr_acb']] == [1,1,1,0]
          assert dual['lower_bound_certified'] is True
          assert dual['certified_lower_bound'] == '1/3'
          assert dual['zeta_theorem_claimed'] is False
          assert formal['status'] == 'theorem_spec_only'
          assert formal['kernel_checked'] is False
          assert formal['proof_claimed'] is False
          PY

      - name: Theorem-debt smoke
        run: |
          python -m omega_zeta_cert_t debt --target 0.70 > /tmp/debt.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/debt.json'))
          ids = {row['obligation_id'] for row in data['theorem_obligations']}
          assert 'zeta-cross-declared-family-ceiling' in ids
          assert 'zeta-discharge-support-debt' in ids
          assert 'zeta-no-unjustified-full-symmetrization' in ids
          assert 'zeta-polynomial-dual-domain-control' in ids
          assert data['proof_claimed'] is False
          assert data['rh_solved_claimed'] is False
          PY

      - name: Deterministic R0.10 cell materialization
        run: |
          python -m omega_zeta_cert_t cells --target 0.70 --output /tmp/a.jsonl
          python -m omega_zeta_cert_t cells --target 0.70 --output /tmp/b.jsonl
          cmp /tmp/a.jsonl /tmp/b.jsonl
          test "$(wc -l < /tmp/a.jsonl)" -eq 21
          ! grep -q '"proof_claimed": true' /tmp/a.jsonl
          ! grep -q '"rh_solved_claimed": true' /tmp/a.jsonl
