name: Omega Zeta Cert T OAK

on:
  pull_request:
    paths:
      - 'omega_zeta_cert_t/**'
      - 'tests/test_omega_zeta_cert_t.py'
      - 'docs/OMEGA_ZETA_CERT_T.md'
      - 'data/omega_zeta_cert/**'
      - 'schemas/omega_zeta_cert_cell.schema.json'
      - '.github/workflows/omega-zeta-cert-t.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  oak:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'

      - name: Compile
        run: python -m compileall -q omega_zeta_cert_t

      - name: Focused OAK court
        run: python -m pytest -q tests/test_omega_zeta_cert_t.py

      - name: Barrier smoke
        run: |
          python -m omega_zeta_cert_t frontier --target 0.70 > /tmp/frontier.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/frontier.json'))
          assert data['barrier'] == 'new_arithmetic_information_required'
          assert data['proof_claimed'] is False
          assert data['rh_solved_claimed'] is False
          PY

      - name: Deterministic cell materialization
        run: |
          python -m omega_zeta_cert_t cells --target 0.70 --output /tmp/a.jsonl
          python -m omega_zeta_cert_t cells --target 0.70 --output /tmp/b.jsonl
          cmp /tmp/a.jsonl /tmp/b.jsonl
          ! grep -q '"proof_claimed": true' /tmp/a.jsonl
          ! grep -q '"rh_solved_claimed": true' /tmp/a.jsonl
