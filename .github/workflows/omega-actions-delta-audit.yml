name: Ω Actions ΔCI Audit R0.3

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: omega-actions-delta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact-audit:
    concurrency:
      group: omega-github-installation-read-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Collect changed files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ['GITHUB_TOKEN']
          repository = os.environ['REPOSITORY']
          number = os.environ['PR_NUMBER']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'omega-actions-delta',
          }
          files = []
          page = 1
          while True:
              url = f'https://api.github.com/repos/{repository}/pulls/{number}/files?per_page=100&page={page}'
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)
              files.extend(item['filename'] for item in batch)
              if len(batch) < 100:
                  break
              page += 1
          with open('OMEGA_CHANGED_FILES.txt', 'w', encoding='utf-8') as handle:
              for path in files:
                  handle.write(path + '\n')
          print(f'changed_files={len(files)}')
          PY

      - name: Build conservative impact plan
        run: |
          python -m omega_actions_t.delta_ci --root . \
            --changed-files OMEGA_CHANGED_FILES.txt \
            --json-out OMEGA_ACTIONS_DELTA.json \
            --markdown-out OMEGA_ACTIONS_DELTA.md
          test -s OMEGA_ACTIONS_DELTA.json
          test -s OMEGA_ACTIONS_DELTA.md
          cat OMEGA_ACTIONS_DELTA.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload impact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-actions-delta-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            OMEGA_CHANGED_FILES.txt
            OMEGA_ACTIONS_DELTA.json
            OMEGA_ACTIONS_DELTA.md
          if-no-files-found: error
          retention-days: 14
