name: Ω Actions ΔCI Audit R0.3

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: omega-actions-delta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact-audit:
    concurrency:
      group: omega-github-installation-read-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete git graph
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Collect changed files from local Git objects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$HEAD_SHA" \
            | sed '/^$/d' \
            | sort -u \
            > OMEGA_CHANGED_FILES.txt
          test -s OMEGA_CHANGED_FILES.txt
          printf 'changed_files=%s\n' "$(wc -l < OMEGA_CHANGED_FILES.txt)"

      - name: Build conservative impact plan
        run: |
          python -m omega_actions_t.delta_ci --root . \
            --changed-files OMEGA_CHANGED_FILES.txt \
            --json-out OMEGA_ACTIONS_DELTA.json \
            --markdown-out OMEGA_ACTIONS_DELTA.md
          test -s OMEGA_ACTIONS_DELTA.json
          test -s OMEGA_ACTIONS_DELTA.md
          cat OMEGA_ACTIONS_DELTA.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload impact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-actions-delta-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            OMEGA_CHANGED_FILES.txt
            OMEGA_ACTIONS_DELTA.json
            OMEGA_ACTIONS_DELTA.md
          if-no-files-found: error
          retention-days: 14
