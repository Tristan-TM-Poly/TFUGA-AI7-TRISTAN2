name: Ω-AI-Tristan Lab

on:
  pull_request:
    paths:
      - "omega_ai_tristan_lab/**"
      - ".github/workflows/omega_ai_tristan_lab.yml"
  push:
    branches:
      - omega-ai-tristan-lab
    paths:
      - "omega_ai_tristan_lab/**"
      - ".github/workflows/omega_ai_tristan_lab.yml"

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        working-directory: omega_ai_tristan_lab
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        working-directory: omega_ai_tristan_lab
        run: python -m pytest -q
      - name: Validate v0.8 lock and bundle plan
        working-directory: omega_ai_tristan_lab
        run: |
          omega-tristan-runtime integration-lock --version r08 > /tmp/r08.json
          omega-tristan-runtime bundle-plan --output-dir /tmp/tristan-bundle > /tmp/bundle.json
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.load(open('/tmp/r08.json', encoding='utf-8'))['lock']
          assert lock['status'] == 'CI_VERIFIED_FOUR_REPO_R02'
          assert lock['evidence']['marker'] == 'FOUR_REPO_RUNTIME_PINNED_PASS'
          assert len(lock['peers']) == 3
          assert len(lock['probes']) == 2
          assert Path('/tmp/tristan-bundle/bundle-manifest.json').exists()
          public = Path('/tmp/tristan-bundle/requirements-public.lock').read_text(encoding='utf-8')
          assert 'PEFA-FractalEnergySystem' not in public
          assert 'TTM-TFUGA-AI7-TRISTAN2' in public
          assert 'Tristan_Tardif-Morency_TFUG' in public
          print('TRISTAN_R08_LOCK_BUNDLE_PASS')
          PY
      - name: Smoke test capability fabric
        working-directory: omega_ai_tristan_lab
        run: |
          omega-tristan-runtime capabilities --json
          omega-tristan-runtime run-capability tristan.idea.analyze \
            --payload-json '{"idea":"Runtime Tristan v0.8 avec bundle reproductible et OAK"}'
      - name: Build wheel and sdist
        working-directory: omega_ai_tristan_lab
        run: python -m build
      - name: Clean-wheel install test
        working-directory: omega_ai_tristan_lab
        run: |
          python -m venv /tmp/tristan-wheel-test
          /tmp/tristan-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/tristan-wheel-test/bin/python - <<'PY'
          from importlib import metadata
          assert metadata.version('omega-ai-tristan-lab') == '0.8.0'
          PY
          /tmp/tristan-wheel-test/bin/omega-tristan-runtime integration-lock --version r08
          /tmp/tristan-wheel-test/bin/omega-tristan-runtime bundle-plan
      - uses: actions/upload-artifact@v4
        with:
          name: omega-ai-tristan-lab-v0.8
          path: |
            omega_ai_tristan_lab/dist/*.whl
            omega_ai_tristan_lab/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  public-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build runtime wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build omega_ai_tristan_lab
          mkdir -p public_wheelhouse public_bundle
          cp omega_ai_tristan_lab/dist/*.whl public_wheelhouse/
      - name: Build exact public peer wheelhouse
        run: |
          python -m pip wheel --wheel-dir public_wheelhouse \
            "git+https://github.com/Tristan-TM-Poly/TTM-TFUGA-AI7-TRISTAN2.git@29e77ad2e1214eb536043b31670071f5079285a5" \
            "git+https://github.com/Tristan-TM-Poly/Tristan_Tardif-Morency_TFUG.git@42c3467b2675c7d83beae6b274586dc2cdf77d42"
      - name: Materialize public bundle manifest
        run: |
          python -m venv /tmp/bundle-plan
          /tmp/bundle-plan/bin/python -m pip install omega_ai_tristan_lab/dist/*.whl
          /tmp/bundle-plan/bin/omega-tristan-runtime bundle-plan --output-dir public_bundle
          test ! -f public_bundle/requirements-private-extension.lock
      - name: Prove offline public wheelhouse install
        run: |
          python -m venv /tmp/offline-tristan
          /tmp/offline-tristan/bin/python -m pip install \
            --no-index --find-links public_wheelhouse \
            omega-ai-tristan-lab==0.8.0 \
            tristan-omni-core==0.2.1 \
            protein-fold-tristan==0.2.1
          /tmp/offline-tristan/bin/python - <<'PY'
          from importlib import metadata
          from omega_ai_tristan_lab import TristanRuntime
          assert metadata.version('omega-ai-tristan-lab') == '0.8.0'
          assert metadata.version('tristan-omni-core') == '0.2.1'
          assert metadata.version('protein-fold-tristan') == '0.2.1'
          runtime = TristanRuntime()
          ids = set(runtime.capability_graph().capability_ids())
          required = {
              'tristan.idea.analyze',
              'tristan-omni-core.evidence-to-idea',
              'protein-fold-tristan.sequence-validate',
          }
          assert not (required - ids)
          protein = runtime.execute_capability(
              'protein-fold-tristan.sequence-validate',
              {'sequence': 'ACDEFGHIKLMNPQRSTVWY'},
          )
          assert protein.provider == 'protein-fold-tristan'
          assert protein.output['is_valid'] is True
          print('TRISTAN_PUBLIC_WHEELHOUSE_OFFLINE_PASS')
          PY
      - name: Generate wheelhouse hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          rows = []
          for path in sorted(Path('public_wheelhouse').glob('*')):
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append({'file': path.name, 'sha256': digest, 'size': path.stat().st_size})
          Path('public_bundle/wheelhouse-sha256.json').write_text(json.dumps(rows, indent=2) + '\n', encoding='utf-8')
          assert rows
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tristan-runtime-public-wheelhouse-v0.8
          path: |
            public_wheelhouse/*
            public_bundle/*
          if-no-files-found: error
          retention-days: 30
