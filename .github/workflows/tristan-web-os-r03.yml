name: Tristan Web OS R0.3 Audit

on:
  push:
    branches:
      - feat/tristan-web-os-r0-1
    paths:
      - apps/tristan-8fire-site/**
      - schemas/tristan_web_os/**
      - scripts/audit_tristan_web_os_r03.py
      - scripts/generate_tristan_web_os_catalog.py
      - scripts/tristan_web_catalog_seed_*.py
      - tests/test_tristan_web_os*.py
      - .github/workflows/tristan-web-os-r03.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/tristan-8fire-site/**
      - schemas/tristan_web_os/**
      - scripts/audit_tristan_web_os_r03.py
      - scripts/generate_tristan_web_os_catalog.py
      - scripts/tristan_web_catalog_seed_*.py
      - tests/test_tristan_web_os*.py
      - .github/workflows/tristan-web-os-r03.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tristan-web-os-r03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate deterministic catalog
        run: python scripts/generate_tristan_web_os_catalog.py

      - name: Ensure generated corpus is committed
        run: |
          git diff --exit-code -- \
            apps/tristan-8fire-site/data \
            content/generated

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Check JavaScript module syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps/tristan-8fire-site -type f -name '*.js' -print0)

      - name: Run deterministic OAK audit
        run: python scripts/audit_tristan_web_os_r03.py --output out/tristan-web-os-r03-audit.json

      - name: Run Web OS regression tests
        run: python -m pytest -q tests/test_tristan_web_os.py tests/test_tristan_web_os_r03.py

      - name: Verify no external network calls in client modules
        shell: bash
        run: |
          if grep -RInE 'XMLHttpRequest|sendBeacon|https?://' \
            apps/tristan-8fire-site/src apps/tristan-8fire-site/app.js; then
            echo 'Unexpected external network primitive or URL found in client modules.' >&2
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tristan-web-os-r03-audit
          path: out/tristan-web-os-r03-audit.json
          if-no-files-found: warn
          retention-days: 14
