name: Tristan Web OS R0.3 Audit

on:
  push:
    branches:
      - feat/tristan-web-os-r0-1
    paths:
      - apps/tristan-8fire-site/**
      - schemas/tristan_web_os/**
      - scripts/audit_tristan_web_os_r03.py
      - scripts/audit_tristan_web_provenance.py
      - scripts/generate_tristan_web_os_catalog.py
      - scripts/generate_tristan_web_provenance.py
      - scripts/generate_tristan_web_build_manifest.py
      - scripts/tristan_web_catalog_seed_*.py
      - tests/test_tristan_web_os*.py
      - tests/test_tristan_web_provenance.py
      - tests/test_tristan_web_build_manifest.py
      - tests/js/**
      - .github/workflows/tristan-web-os-r03.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/tristan-8fire-site/**
      - schemas/tristan_web_os/**
      - scripts/audit_tristan_web_os_r03.py
      - scripts/audit_tristan_web_provenance.py
      - scripts/generate_tristan_web_os_catalog.py
      - scripts/generate_tristan_web_provenance.py
      - scripts/generate_tristan_web_build_manifest.py
      - scripts/tristan_web_catalog_seed_*.py
      - tests/test_tristan_web_os*.py
      - tests/test_tristan_web_provenance.py
      - tests/test_tristan_web_build_manifest.py
      - tests/js/**
      - .github/workflows/tristan-web-os-r03.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tristan-web-os-r03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deterministic test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Regenerate deterministic catalog, provenance and build root
        run: |
          python scripts/generate_tristan_web_os_catalog.py
          python scripts/generate_tristan_web_provenance.py
          python scripts/generate_tristan_web_build_manifest.py

      - name: Ensure generated corpus is committed
        run: |
          git diff --exit-code -- \
            apps/tristan-8fire-site/data \
            content/generated

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Check JavaScript module syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps/tristan-8fire-site -type f -name '*.js' -print0)

      - name: Run OAKGate JavaScript unit tests
        run: node --test tests/js/*.test.mjs

      - name: Run deterministic OAK audits
        run: |
          mkdir -p out
          python scripts/audit_tristan_web_os_r03.py \
            --output out/tristan-web-os-r03-audit.json
          python scripts/audit_tristan_web_provenance.py \
            --output out/tristan-web-os-provenance-audit.json

      - name: Run Web OS regression tests with preserved diagnostics
        id: pytest
        shell: bash
        run: |
          mkdir -p out
          set +e
          python -m pytest -q \
            tests/test_tristan_web_os.py \
            tests/test_tristan_web_os_r03.py \
            tests/test_tristan_web_provenance.py \
            tests/test_tristan_web_build_manifest.py \
            2>&1 | tee out/pytest-report.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify no external network calls in client modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('apps/tristan-8fire-site/src'), Path('apps/tristan-8fire-site/app.js')]
          files = []
          for root in roots:
              files.extend(root.rglob('*.js') if root.is_dir() else [root])

          forbidden = {
              'XMLHttpRequest': re.compile(r'\bXMLHttpRequest\b'),
              'sendBeacon': re.compile(r'\bsendBeacon\s*\('),
              'WebSocket': re.compile(r'\bWebSocket\s*\('),
              'EventSource': re.compile(r'\bEventSource\s*\('),
              'external fetch': re.compile(r'''\bfetch\s*\(\s*["'](?:https?:)?//''', re.IGNORECASE),
              'external dynamic import': re.compile(r'''\bimport\s*\(\s*["'](?:https?:)?//''', re.IGNORECASE),
          }
          findings = []
          for path in sorted(files):
              text = path.read_text(encoding='utf-8')
              for label, pattern in forbidden.items():
                  for match in pattern.finditer(text):
                      line = text.count('\n', 0, match.start()) + 1
                      findings.append(f'{path}:{line}: {label}')
          if findings:
              raise SystemExit('Unexpected external network primitive:\n' + '\n'.join(findings))
          print(f'Checked {len(files)} client modules: local fetches allowed, external transports absent.')
          PY

      - name: Upload audit and pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tristan-web-os-r03-diagnostics
          path: |
            out/tristan-web-os-r03-audit.json
            out/tristan-web-os-provenance-audit.json
            out/pytest-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce regression test result
        if: always()
        shell: bash
        run: exit "${{ steps.pytest.outputs.status }}"
