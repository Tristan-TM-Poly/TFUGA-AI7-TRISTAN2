name: Omega RE R0.5 OAKBench

on:
  pull_request:
    paths:
      - "omega_re_t/*_r05.py"
      - "tests/test_r05_*.py"
      - "docs/omega-re-t/*R0_5*.md"
      - "schemas/omega-re-r05-demo.schema.json"
      - "pyproject.toml"
      - ".github/workflows/omega-re-r05.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile R0.5
        run: python -m compileall -q omega_re_t tests/test_r05_*.py
      - name: Run R0.5 tests
        run: python -m pytest -q tests/test_r05_*.py
      - name: Generate deterministic evidence twice
        run: |
          python -m omega_re_t.r05_cli all --output /tmp/omega-re-r05-a.json
          python -m omega_re_t.r05_cli all --output /tmp/omega-re-r05-b.json
          cmp /tmp/omega-re-r05-a.json /tmp/omega-re-r05-b.json
      - name: Validate schema and OAK counters
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          payload = json.loads(Path('/tmp/omega-re-r05-a.json').read_text())
          schema = json.loads(Path('schemas/omega-re-r05-demo.schema.json').read_text())
          jsonschema.validate(payload, schema)
          report = payload['re1024_calibration']['report']
          assert report['logical_cases'] == 1024
          assert report['materialized_cases'] == 1024
          assert report['executed_cases'] == 1024
          assert report['software_tested_cases'] == 1024
          assert report['scientifically_verified_cases'] == 0
          assert payload['public_receipts']['valid'] is True
          assert payload['boundaries']['external_execution'] is False
          assert payload['boundaries']['scientific_validation'] is False
          assert payload['boundaries']['permanent_total_cap'] is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: omega-re-r05-${{ matrix.python-version }}
          path: /tmp/omega-re-r05-a.json
          retention-days: 14
