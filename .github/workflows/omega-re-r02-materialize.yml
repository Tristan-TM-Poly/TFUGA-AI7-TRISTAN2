# Human merge-validation trigger for the crystallized RE256 snapshot.
name: Omega RE R0.2 Materialize

on:
  pull_request:
    paths:
      - "omega_re_t/authorization.py"
      - "omega_re_t/re_ir.py"
      - "omega_re_t/probabilistic.py"
      - "omega_re_t/timed.py"
      - "omega_re_t/constraints.py"
      - "omega_re_t/residuals.py"
      - "omega_re_t/storage.py"
      - "omega_re_t/re16.py"
      - "omega_re_t/frontier.py"
      - "omega_re_t/r02_cli.py"
      - "tests/test_omega_re_r02_*.py"
      - "schemas/omega-re-r02.schema.json"
      - ".github/workflows/omega-re-r02-materialize.yml"
  push:
    branches:
      - feat/omega-re-t-r0-1
    paths:
      - "omega_re_t/authorization.py"
      - "omega_re_t/re_ir.py"
      - "omega_re_t/probabilistic.py"
      - "omega_re_t/timed.py"
      - "omega_re_t/constraints.py"
      - "omega_re_t/residuals.py"
      - "omega_re_t/storage.py"
      - "omega_re_t/re16.py"
      - "omega_re_t/frontier.py"
      - "omega_re_t/r02_cli.py"
      - "tests/test_omega_re_r02_*.py"
      - "schemas/omega-re-r02.schema.json"
      - ".github/workflows/omega-re-r02-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-re-r02-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Run complete Omega RE test suite
        run: python -m pytest -q tests/test_omega_re_*.py

      - name: Validate RE-256 logical frontier
        run: python -m omega_re_t.frontier --verify-only

      - name: Materialize RE-256
        run: |
          rm -f benchmarks/omega-re/re256.json
          python -m omega_re_t.frontier \
            --output benchmarks/omega-re/re256.json

      - name: Verify materialized claims and digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from omega_re_t.frontier import frontier_manifest

          path = Path("benchmarks/omega-re/re256.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["manifest"] == frontier_manifest()
          assert payload["manifest"]["case_count"] == 256
          assert len(payload["cases"]) == 256
          claims = payload["manifest"]["claims"]
          assert claims["materialized_cases"] == 256
          assert claims["executed_cases"] == 0
          assert claims["scientifically_verified_cases"] == 0
          assert claims["logical_space_is_not_execution"] is True
          assert len(path.read_text(encoding="utf-8").splitlines()) > 15_000
          PY

      - name: Commit deterministic frontier to PR branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- benchmarks/omega-re/re256.json
          if git diff --cached --quiet; then
            echo "RE-256 already synchronized."
            exit 0
          fi
          git commit -m "data(omega-re-r02): materialize 256-case OAK frontier"
          git push origin HEAD:"$TARGET_BRANCH"
