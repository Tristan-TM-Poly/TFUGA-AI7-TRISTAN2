name: Sync Validate Omega Unbounded R0.6 Merge

on:
  push:
    branches:
      - feat/omega-unbounded-self-improvement-r0.4
    paths:
      - '.github/workflows/sync-validate-omega-unbounded-r06-merge.yml'

permissions:
  contents: write

jobs:
  sync-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/omega-unbounded-self-improvement-r0.4
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize current main non-destructively
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install validation tools
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Compile package
        run: python -m compileall -q omega_unbounded_t

      - name: Run complete targeted suite
        run: >-
          python -m pytest
          tests/test_omega_unbounded_t.py
          tests/test_omega_unbounded_github_planner.py
          tests/test_omega_unbounded_streaming.py
          tests/test_omega_unbounded_self_improvement.py
          tests/test_omega_unbounded_governance.py
          tests/test_omega_unbounded_recursive_evolution.py
          -q

      - name: Validate 100k streaming frontier
        run: |
          python -m omega_unbounded_t.cli synthetic-plan \
            --work-items 100000 \
            --namespaces 16 \
            --initial-shard-bytes 32768 \
            --shard-growth-factor 2 \
            --output-dir generated/omega-unbounded-merge-frontier

      - name: Validate resource-aware self-improvement
        run: |
          python -m omega_unbounded_t.cli self-improve \
            --work-items 60000 \
            --minimum-improvement-ratio 0.02 \
            --overshoot-penalty-weight 10 \
            --maximum-overshoot-multiplier 2 \
            --output-dir generated/omega-unbounded-merge-self

      - name: Validate StopGate and reflex M-minus
        run: |
          python -m omega_unbounded_t.cli governance-check \
            --output-dir generated/omega-unbounded-merge-governance

      - name: Validate proof-carrying evolution
        run: |
          python -m omega_unbounded_t.cli evolution-check \
            --output-dir generated/omega-unbounded-merge-evolution

      - name: Verify all merge invariants
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          frontier_root = Path('generated/omega-unbounded-merge-frontier')
          manifest = json.loads((frontier_root / 'manifest.json').read_text(encoding='utf-8'))
          oak = json.loads((frontier_root / 'oak-report.json').read_text(encoding='utf-8'))
          assert manifest['raw_records'] == 100000
          assert manifest['unique_additions'] == 100000
          assert manifest['no_total_addition_cap'] is True
          assert oak['checks']['remote_mutations'] == 0
          assert oak['checks']['rollback_ledger'] is True

          self_root = Path('generated/omega-unbounded-merge-self')
          self_report = json.loads((self_root / 'self-improvement-report.json').read_text(encoding='utf-8'))
          self_plan = json.loads((self_root / 'promotion-plan.json').read_text(encoding='utf-8'))
          assert self_report['decision']['status'] == 'promotion_proposed'
          assert self_report['decision']['selected'] == 'mminus-capacity-redesign'
          assert self_report['decision']['improvement_ratio'] >= 0.02
          assert self_report['decision']['remote_mutations'] == 0
          assert self_plan['apply']['automatic'] is False
          assert self_plan['apply']['merge'] is False

          governance_root = Path('generated/omega-unbounded-merge-governance')
          governance = json.loads((governance_root / 'governance-report.json').read_text(encoding='utf-8'))
          assert governance['status'] == 'passed'
          assert governance['final_decision']['action'] == 'STOP'
          assert governance['known_overiteration_blocked'] is True
          assert {item['name'] for item in governance['pareto_front']} == {'fast', 'lean'}

          evolution_root = Path('generated/omega-unbounded-merge-evolution')
          evolution = json.loads((evolution_root / 'evolution-report.json').read_text(encoding='utf-8'))
          schema = json.loads(Path('schemas/omega_unbounded_evolution_report.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator(schema).validate(evolution)
          assert evolution['status'] == 'passed'
          assert set(evolution['pareto_front']) == {'fast', 'lean'}
          assert evolution['rejected'] == ['fragile']
          assert evolution['safe_canary']['status'] == 'promotion_candidate'
          assert evolution['rollback_demonstration']['status'] == 'rolled_back'
          assert evolution['rollback_demonstration']['decisions'][-1]['stage'] == 0.2
          authority = evolution['authority']
          assert authority['source_mutations'] == 0
          assert authority['remote_mutations'] == 0
          assert authority['automatic_merge'] is False
          assert authority['human_approval_required'] is True

          for bundle in evolution['proof_bundles'].values():
              root = Path(bundle['path'])
              bundle_manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
              assert bundle_manifest['bundle_id'] == bundle['bundle_id']
              for name, expected in bundle_manifest['files'].items():
                  actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  assert actual == expected
          PY

      - name: Crystallize merge validation and remove temporary workflow
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          self_report = json.loads(Path('generated/omega-unbounded-merge-self/self-improvement-report.json').read_text(encoding='utf-8'))
          evolution = json.loads(Path('generated/omega-unbounded-merge-evolution/evolution-report.json').read_text(encoding='utf-8'))
          validated_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_main = subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip()
          report = {
              'status': 'passed',
              'validated_tree': validated_tree,
              'synchronized_main': base_main,
              'targeted_tests': 'passed',
              'frontier_records': 100000,
              'self_improvement_selected': self_report['decision']['selected'],
              'self_improvement_ratio': self_report['decision']['improvement_ratio'],
              'stopgate': 'STOP',
              'reflex_m_minus_blocked': True,
              'pareto_front': evolution['pareto_front'],
              'adversarial_rejected': evolution['rejected'],
              'canary_status': evolution['safe_canary']['status'],
              'rollback_status': evolution['rollback_demonstration']['status'],
              'rollback_stage': evolution['rollback_demonstration']['decisions'][-1]['stage'],
              'proof_bundle_ids': {key: value['bundle_id'] for key, value in evolution['proof_bundles'].items()},
              'source_mutations': 0,
              'remote_mutations': 0,
              'automatic_merge_runtime': False,
              'human_merge_authorization': True,
          }
          path = Path('reports/omega_unbounded_r06_merge_validation.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/sync-validate-omega-unbounded-r06-merge.yml
          git add -- reports/omega_unbounded_r06_merge_validation.json .github/workflows/sync-validate-omega-unbounded-r06-merge.yml
          git commit -m 'test(omega-unbounded): validate synchronized R0.6 merge candidate'
          git push origin HEAD:feat/omega-unbounded-self-improvement-r0.4
