name: Omega Histoscience R0.2 Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/omega_histosci_r02_payload/**"
      - "tools/materialize_omega_histosci_r02.py"
      - ".github/workflows/omega-histoscience-r02-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-histoscience-r02-bootstrap-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focused validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Materialize and validate R0.2
        run: python tools/materialize_omega_histosci_r02.py
      - name: Inspect exact generated scope
        run: |
          git status --short
          git diff --stat
      - name: Commit exact generated paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            omega_histosci_hg_t/r02 \
            data/omega_histosci_hg/r02 \
            schemas/omega_histosci_claim_v2.schema.json \
            schemas/omega_histosci_mminus_v2.schema.json \
            schemas/omega_histosci_research_cell_v2.schema.json \
            schemas/omega_histosci_oak_report_v2.schema.json \
            schemas/omega_histosci_materialization_manifest_v2.schema.json \
            tests/test_omega_histosci_r02.py \
            docs/omega-histoscience-hg-t/R_INFINITY.md \
            docs/omega-histoscience-hg-t/R02_IMPLEMENTATION.md \
            examples/omega_histosci_r02_demo.py \
            .github/workflows/omega-histoscience-r02.yml \
            pyproject.toml
          git diff --cached --stat
          git commit -m "feat(histoscience): materialize Ω-HISTOSCI-HG-T∞ R0.2 massive frontier"
          git push origin "HEAD:${TARGET_BRANCH}"
