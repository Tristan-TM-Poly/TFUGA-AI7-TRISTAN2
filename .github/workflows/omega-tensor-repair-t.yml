name: Omega Tensor Repair T R0.1-R0.3

on:
  pull_request:
    paths:
      - "omega_tensor_repair_t/**"
      - "tests/test_omega_tensor_repair_t*.py"
      - "examples/omega_tensor_repair_demo.py"
      - "examples/tensor_repair_spec.json"
      - "docs/omega-tensor-repair-t/**"
      - "schemas/omega_tensor_repair_*"
      - "pyproject.toml"
      - ".github/workflows/omega-tensor-repair-t.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile module
        run: >-
          python -m compileall -q
          omega_tensor_repair_t
          tests/test_omega_tensor_repair_t.py
          tests/test_omega_tensor_repair_t_r02.py
          tests/test_omega_tensor_repair_t_r03.py
          examples/omega_tensor_repair_demo.py
      - name: Run focused tests
        run: >-
          pytest -q
          tests/test_omega_tensor_repair_t.py
          tests/test_omega_tensor_repair_t_r02.py
          tests/test_omega_tensor_repair_t_r03.py
      - name: Generate deterministic receipts twice
        run: |
          python -m omega_tensor_repair_t.cli benchmark --output /tmp/tensor-a.json
          python -m omega_tensor_repair_t.cli benchmark --output /tmp/tensor-b.json
          cmp /tmp/tensor-a.json /tmp/tensor-b.json
          python -m omega_tensor_repair_t.cli benchmark-r02 --output /tmp/tensor-r02-a.json
          python -m omega_tensor_repair_t.cli benchmark-r02 --output /tmp/tensor-r02-b.json
          cmp /tmp/tensor-r02-a.json /tmp/tensor-r02-b.json
          python -m omega_tensor_repair_t.cli benchmark-r03 --output /tmp/tensor-r03-a.json
          python -m omega_tensor_repair_t.cli benchmark-r03 --output /tmp/tensor-r03-b.json
          cmp /tmp/tensor-r03-a.json /tmp/tensor-r03-b.json
      - name: Validate compiler schema and OAK boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          from omega_tensor_repair_t.compiler import compile_spec

          schema = json.loads(Path('schemas/omega_tensor_repair_compile_plan_v1.schema.json').read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          plan = compile_spec(json.loads(Path('examples/tensor_repair_spec.json').read_text())).to_dict()['plan']
          jsonschema.validate(plan, schema)

          receipt = json.loads(Path('/tmp/tensor-a.json').read_text())
          assert receipt['status'] == 'CERTIFIED_FINITE_SOFTWARE_FIXTURES_R0_1'
          assert receipt['bundle_fixtures'] == 625
          assert receipt['maximum_reconstruction_error'] <= 1e-12
          assert receipt['claims']['general_theorem_proved_by_benchmark'] is False
          assert receipt['claims']['new_physics_validated'] is False

          receipt_r02 = json.loads(Path('/tmp/tensor-r02-a.json').read_text())
          assert receipt_r02['status'] == 'CERTIFIED_EXTENDED_SOFTWARE_FIXTURES_R0_2'
          assert receipt_r02['su2_dimension_conservation'] is True
          assert receipt_r02['claims']['optimal_svd_claimed'] is False
          assert receipt_r02['claims']['higher_order_general_proof_claimed'] is False

          receipt_r03 = json.loads(Path('/tmp/tensor-r03-a.json').read_text())
          assert receipt_r03['status'] == 'CERTIFIED_EXTENDED_SOFTWARE_FIXTURES_R0_3'
          assert receipt_r03['basis_cases'] == 8
          assert receipt_r03['maximum_orthonormality_error'] <= 1e-12
          assert receipt_r03['maximum_reconstruction_error'] <= 1e-10
          assert all(receipt_r03['invariants'].values())
          assert receipt_r03['claims']['mixed_young_operator_is_orthogonal_projector'] is False
          assert receipt_r03['claims']['benchmark_is_general_proof'] is False
          print(receipt['status'], receipt_r02['status'], receipt_r03['status'])
          PY
