name: Omega Code Dojo R0.3 Learning Intelligence

on:
  push:
    branches: [feat/omega-code-dojo-t-r0-1]
    paths:
      - "omega_code_dojo_t/r03/**"
      - "tests/test_omega_code_dojo_r03.py"
      - "schemas/omega_code_dojo_learning_*_v3.schema.json"
      - "docs/omega-code-dojo-t/r03/**"
      - "examples/omega_code_dojo_r03_demo.py"
      - "pyproject.toml"
      - ".github/workflows/omega-code-dojo-r03.yml"
  pull_request:
    paths:
      - "omega_code_dojo_t/r03/**"
      - "tests/test_omega_code_dojo_r03.py"
      - "schemas/omega_code_dojo_learning_*_v3.schema.json"
      - "docs/omega-code-dojo-t/r03/**"
      - "examples/omega_code_dojo_r03_demo.py"
      - "pyproject.toml"
      - ".github/workflows/omega-code-dojo-r03.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile R0.3
        run: |
          python -m compileall -q \
            omega_code_dojo_t/r03 \
            tests/test_omega_code_dojo_r03.py \
            examples/omega_code_dojo_r03_demo.py

      - name: Run R0.3 tests
        run: pytest -q tests/test_omega_code_dojo_r03.py

      - name: Generate deterministic benchmark twice
        run: |
          python -m omega_code_dojo_t.r03.cli benchmark --output /tmp/r03-a.json
          python -m omega_code_dojo_t.r03.cli benchmark --output /tmp/r03-b.json
          cmp /tmp/r03-a.json /tmp/r03-b.json

      - name: Validate learning schemas and OAK invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          benchmark = json.loads(Path('/tmp/r03-a.json').read_text())
          report_schema = json.loads(
              Path('schemas/omega_code_dojo_learning_report_v3.schema.json').read_text()
          )
          plan_schema = json.loads(
              Path('schemas/omega_code_dojo_learning_plan_v3.schema.json').read_text()
          )
          jsonschema.Draft202012Validator.check_schema(report_schema)
          jsonschema.Draft202012Validator.check_schema(plan_schema)
          jsonschema.validate(benchmark['report'], report_schema)
          plan = {
              'report_id': benchmark['report']['report_id'],
              'report_sha256': benchmark['report']['report_sha256'],
              'actions': benchmark['next_actions'],
          }
          jsonschema.validate(plan, plan_schema)
          assert benchmark['status'] == 'CERTIFIED_LEARNING_INTELLIGENCE_FIXTURES_R0_3'
          assert all(benchmark['invariants'].values())
          assert benchmark['report']['claims']['neural_training_claimed'] is False
          assert benchmark['report']['claims']['causal_transfer_claimed'] is False
          assert benchmark['report']['plateau']['detected'] is True
          assert benchmark['ledger']['count'] == 1
          print('CERTIFIED_LEARNING_INTELLIGENCE_FIXTURES_R0_3')
          PY

      - name: Upload learning receipt
        uses: actions/upload-artifact@v4
        with:
          name: omega-code-dojo-r03-${{ matrix.python-version }}
          path: /tmp/r03-a.json
          if-no-files-found: error
          retention-days: 14
