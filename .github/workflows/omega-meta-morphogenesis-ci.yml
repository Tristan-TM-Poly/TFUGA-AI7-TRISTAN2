name: Omega Meta Morphogenesis CI

on:
  pull_request:
    paths:
      - 'omega_morphogenesis/**'
      - 'omega_tristan_meta/**'
      - 'benchmarks/meta_representation_r02.json'
      - 'tests/test_omega_morphogenesis.py'
      - 'tests/test_meta_compiler.py'
      - 'tests/test_meta_morphogenesis.py'
      - 'tests/test_meta_skill_civilization.py'
      - 'tests/test_meta_representation_tournament.py'
      - 'schemas/proof_carrying_transformation.schema.json'
      - 'schemas/tristan_ir.schema.json'
      - 'schemas/receipt.schema.json'
      - 'schemas/morph_genome.schema.json'
      - 'book0/BOOK0_TRISTAN_META_COMPILER_V1.json'
      - 'book0/BOOK0_META_MORPHOGENESIS_V1.json'
      - 'book0/BOOK0_META_SKILL_CIVILIZATION_R01.json'
      - '.agents/skills/omega-meta-morphogenesis-fixed-point-t/**'
      - '.agents/skills/omega-tristan-meta-compiler-t/**'
      - 'docs/OMEGA_META_MORPHOGENESIS_FIXED_POINT.md'
      - 'docs/OMEGA_META_MORPHOGENESIS_V1.md'
      - 'docs/OMEGA_TRISTAN_META_COMPILER.md'
      - 'docs/OMEGA_META_SKILL_CIVILIZATION_R01.md'
      - 'docs/OMEGA_META_REPRESENTATION_TOURNAMENT_R02.md'
      - '.github/workflows/omega-meta-morphogenesis-ci.yml'
  push:
    paths:
      - 'omega_morphogenesis/**'
      - 'omega_tristan_meta/**'
      - 'benchmarks/meta_representation_r02.json'
      - 'tests/test_omega_morphogenesis.py'
      - 'tests/test_meta_compiler.py'
      - 'tests/test_meta_morphogenesis.py'
      - 'tests/test_meta_skill_civilization.py'
      - 'tests/test_meta_representation_tournament.py'
      - 'schemas/proof_carrying_transformation.schema.json'
      - 'schemas/tristan_ir.schema.json'
      - 'schemas/receipt.schema.json'
      - 'schemas/morph_genome.schema.json'
      - 'book0/BOOK0_TRISTAN_META_COMPILER_V1.json'
      - 'book0/BOOK0_META_MORPHOGENESIS_V1.json'
      - 'book0/BOOK0_META_SKILL_CIVILIZATION_R01.json'
      - '.agents/skills/omega-meta-morphogenesis-fixed-point-t/**'
      - '.agents/skills/omega-tristan-meta-compiler-t/**'
      - 'docs/OMEGA_META_MORPHOGENESIS_FIXED_POINT.md'
      - 'docs/OMEGA_META_MORPHOGENESIS_V1.md'
      - 'docs/OMEGA_TRISTAN_META_COMPILER.md'
      - 'docs/OMEGA_META_SKILL_CIVILIZATION_R01.md'
      - 'docs/OMEGA_META_REPRESENTATION_TOURNAMENT_R02.md'
      - '.github/workflows/omega-meta-morphogenesis-ci.yml'

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run canonical morphogenesis tests
        run: python -m unittest tests.test_omega_morphogenesis -v
      - name: Run Tristan meta adapter tests
        run: python -m unittest tests.test_meta_compiler tests.test_meta_morphogenesis tests.test_meta_skill_civilization tests.test_meta_representation_tournament -v
      - name: Compile meta packages
        run: python -m compileall -q omega_morphogenesis omega_tristan_meta
      - name: Validate JSON artifacts
        run: python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('schemas/proof_carrying_transformation.schema.json'),
              Path('schemas/tristan_ir.schema.json'),
              Path('schemas/receipt.schema.json'),
              Path('schemas/morph_genome.schema.json'),
              Path('book0/BOOK0_TRISTAN_META_COMPILER_V1.json'),
              Path('book0/BOOK0_META_MORPHOGENESIS_V1.json'),
              Path('book0/BOOK0_META_SKILL_CIVILIZATION_R01.json'),
              Path('benchmarks/meta_representation_r02.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY
      - name: Run Tristan meta CLI examples
        run: |
          python -m omega_tristan_meta.cli example
          python -m omega_tristan_meta.cli skill-example
      - name: Run frozen representation tournament
        run: |
          python -m omega_tristan_meta.representation_tournament benchmarks/meta_representation_r02.json --out /tmp/meta-representation-r02.json
          python -m json.tool /tmp/meta-representation-r02.json >/dev/null
