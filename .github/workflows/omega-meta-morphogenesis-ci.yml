name: Omega Meta Morphogenesis CI

on:
  pull_request:
    paths:
      - 'omega_morphogenesis/**'
      - 'omega_tristan_meta/**'
      - 'tests/test_omega_morphogenesis.py'
      - 'tests/test_meta_compiler.py'
      - 'tests/test_meta_morphogenesis.py'
      - 'tests/test_representation_tournament.py'
      - 'benchmarks/meta_morph_representation_r0_2/**'
      - 'schemas/proof_carrying_transformation.schema.json'
      - 'schemas/tristan_ir.schema.json'
      - 'schemas/receipt.schema.json'
      - 'schemas/morph_genome.schema.json'
      - 'book0/BOOK0_TRISTAN_META_COMPILER_V1.json'
      - 'book0/BOOK0_META_MORPHOGENESIS_V1.json'
      - '.agents/skills/omega-meta-morphogenesis-fixed-point-t/**'
      - '.agents/skills/omega-tristan-meta-compiler-t/**'
      - 'docs/OMEGA_META_MORPHOGENESIS_FIXED_POINT.md'
      - 'docs/OMEGA_META_MORPHOGENESIS_V1.md'
      - 'docs/OMEGA_TRISTAN_META_COMPILER.md'
      - '.github/workflows/omega-meta-morphogenesis-ci.yml'
  push:
    paths:
      - 'omega_morphogenesis/**'
      - 'omega_tristan_meta/**'
      - 'tests/test_omega_morphogenesis.py'
      - 'tests/test_meta_compiler.py'
      - 'tests/test_meta_morphogenesis.py'
      - 'tests/test_representation_tournament.py'
      - 'benchmarks/meta_morph_representation_r0_2/**'
      - 'schemas/proof_carrying_transformation.schema.json'
      - 'schemas/tristan_ir.schema.json'
      - 'schemas/receipt.schema.json'
      - 'schemas/morph_genome.schema.json'
      - 'book0/BOOK0_TRISTAN_META_COMPILER_V1.json'
      - 'book0/BOOK0_META_MORPHOGENESIS_V1.json'
      - '.agents/skills/omega-meta-morphogenesis-fixed-point-t/**'
      - '.agents/skills/omega-tristan-meta-compiler-t/**'
      - 'docs/OMEGA_META_MORPHOGENESIS_FIXED_POINT.md'
      - 'docs/OMEGA_META_MORPHOGENESIS_V1.md'
      - 'docs/OMEGA_TRISTAN_META_COMPILER.md'
      - '.github/workflows/omega-meta-morphogenesis-ci.yml'

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run canonical morphogenesis tests
        run: python -m unittest tests.test_omega_morphogenesis -v
      - name: Run Tristan meta adapter tests
        run: python -m unittest tests.test_meta_compiler tests.test_meta_morphogenesis tests.test_representation_tournament -v
      - name: Compile meta packages
        run: python -m compileall -q omega_morphogenesis omega_tristan_meta
      - name: Validate JSON artifacts
        run: python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('schemas/proof_carrying_transformation.schema.json'),
              Path('schemas/tristan_ir.schema.json'),
              Path('schemas/receipt.schema.json'),
              Path('schemas/morph_genome.schema.json'),
              Path('book0/BOOK0_TRISTAN_META_COMPILER_V1.json'),
              Path('book0/BOOK0_META_MORPHOGENESIS_V1.json'),
              Path('benchmarks/meta_morph_representation_r0_2/corpus.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY
      - name: Emit frozen representation tournament report
        run: python - <<'PY'
          from pathlib import Path
          from omega_tristan_meta.representation_tournament import report_to_json, run_tournament
          corpus = Path('benchmarks/meta_morph_representation_r0_2/corpus.json')
          out = Path('benchmark-results') / f'representation-r0-2-py${{ matrix.python-version }}.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(report_to_json(run_tournament(corpus)), encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY
      - name: Upload representation tournament report
        uses: actions/upload-artifact@v4
        with:
          name: representation-r0-2-py${{ matrix.python-version }}
          path: benchmark-results/*.json
      - name: Run Tristan meta CLI example
        run: python -m omega_tristan_meta.cli example
