name: Omega Meta Morphogenesis CI

on:
  pull_request:
    paths:
      - 'omega_morphogenesis/**'
      - 'tests/test_omega_morphogenesis.py'
      - 'schemas/proof_carrying_transformation.schema.json'
      - '.agents/skills/omega-meta-morphogenesis-fixed-point-t/**'
      - 'docs/OMEGA_META_MORPHOGENESIS_FIXED_POINT.md'
      - '.github/workflows/omega-meta-morphogenesis-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'omega_morphogenesis/**'
      - 'tests/test_omega_morphogenesis.py'
      - 'schemas/proof_carrying_transformation.schema.json'

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused tests
        run: python -m unittest tests.test_omega_morphogenesis -v
