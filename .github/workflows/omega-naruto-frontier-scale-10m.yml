name: Omega Naruto Frontier Scale 10M

on:
  pull_request:
    paths:
      - 'omega_naruto_hmagfm/frontier_parallel.py'
      - 'omega_naruto_hmagfm/frontier_ledger.py'
      - 'omega_naruto_hmagfm/scale_v3_cli.py'
      - 'omega_naruto_hmagfm/__init__.py'
      - 'tests/test_omega_naruto_frontier_parallel.py'
      - 'tests/test_omega_naruto_public_api.py'
      - 'schemas/omega_naruto_parallel_*.json'
      - 'schemas/omega_naruto_run_ledger_v3.schema.json'
      - '.github/workflows/omega-naruto-frontier-scale-10m.yml'
  workflow_dispatch:
    inputs:
      target_records:
        description: Finite records for this experiment; not a permanent maximum
        required: false
        default: '10000000'
      shard_records:
        description: Records per deterministic gzip shard
        required: false
        default: '100000'
      generation_workers:
        description: Local generation worker processes
        required: false
        default: '4'
      proof_workers:
        description: Parallel validation and indexing workers
        required: false
        default: '4'

permissions:
  contents: read

concurrency:
  group: omega-naruto-frontier-scale-10m-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontier-scale-10m:
    name: Generate, validate and index 10M
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TARGET_RECORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_records || '10000000' }}
      SHARD_RECORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.shard_records || '100000' }}
      GENERATION_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.generation_workers || '4' }}
      PROOF_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.proof_workers || '4' }}

    steps:
      - name: Checkout merge ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install proof dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Compile v2 and v3 scale engines
        run: |
          python -m compileall -q omega_naruto_hmagfm
          python -m compileall -q tests/test_omega_naruto_frontier_scale.py
          python -m compileall -q tests/test_omega_naruto_frontier_parallel.py
          python -m compileall -q tests/test_omega_naruto_public_api.py

      - name: Run scale, parallel and API tests
        run: |
          python -m pytest -q \
            tests/test_omega_naruto_frontier_scale.py \
            tests/test_omega_naruto_frontier_parallel.py \
            tests/test_omega_naruto_public_api.py

      - name: Plan 10M finite run
        run: |
          mkdir -p generated/omega_naruto/scale-10m
          python -m omega_naruto_hmagfm.scale_cli plan \
            --target "$TARGET_RECORDS" \
            --shard-records "$SHARD_RECORDS" \
            > generated/omega_naruto/scale-plan-10m.json

      - name: Generate compressed deterministic 10M frontier
        run: |
          python -m omega_naruto_hmagfm.scale_cli generate \
            --output-dir generated/omega_naruto/scale-10m \
            --target "$TARGET_RECORDS" \
            --shard-records "$SHARD_RECORDS" \
            --workers "$GENERATION_WORKERS" \
            --compression-level 6 \
            > generated/omega_naruto/scale-generation-10m.json
          cp generated/omega_naruto/scale-10m/scale-manifest.json \
            generated/omega_naruto/scale-manifest-10m-first.json

      - name: Prove zero-regeneration resume at 10M
        run: |
          python -m omega_naruto_hmagfm.scale_cli generate \
            --output-dir generated/omega_naruto/scale-10m \
            --target "$TARGET_RECORDS" \
            --shard-records "$SHARD_RECORDS" \
            --workers "$GENERATION_WORKERS" \
            --compression-level 6 \
            > generated/omega_naruto/scale-resume-10m.json

      - name: Parallel-validate every record and shard
        run: |
          python -m omega_naruto_hmagfm.scale_v3_cli parallel-validate \
            --output-dir generated/omega_naruto/scale-10m \
            --destination generated/omega_naruto/parallel-validation-10m.json \
            --workers "$PROOF_WORKERS" \
            > generated/omega_naruto/parallel-validation-10m-stdout.json

      - name: Build exact parallel index and M-minus telemetry
        run: |
          python -m omega_naruto_hmagfm.scale_v3_cli parallel-index \
            --output-dir generated/omega_naruto/scale-10m \
            --destination generated/omega_naruto/parallel-index-10m.json \
            --workers "$PROOF_WORKERS" \
            --sample-limit 256 \
            > generated/omega_naruto/parallel-index-10m-stdout.json

      - name: Seal run in a federated ledger
        run: |
          python -m omega_naruto_hmagfm.scale_v3_cli ledger \
            --manifest generated/omega_naruto/scale-10m/scale-manifest.json \
            --destination generated/omega_naruto/run-ledger-10m.json \
            > generated/omega_naruto/run-ledger-10m-stdout.json

      - name: Validate v3 schemas and exact 10M invariants
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from jsonschema import Draft202012Validator

          root = Path('generated/omega_naruto')
          target = int(os.environ['TARGET_RECORDS'])
          shard_records = int(os.environ['SHARD_RECORDS'])
          plan = json.loads((root / 'scale-plan-10m.json').read_text(encoding='utf-8'))
          first = json.loads((root / 'scale-manifest-10m-first.json').read_text(encoding='utf-8'))
          resumed = json.loads((root / 'scale-resume-10m.json').read_text(encoding='utf-8'))
          validation = json.loads((root / 'parallel-validation-10m.json').read_text(encoding='utf-8'))
          validation_stdout = json.loads((root / 'parallel-validation-10m-stdout.json').read_text(encoding='utf-8'))
          index = json.loads((root / 'parallel-index-10m.json').read_text(encoding='utf-8'))
          index_stdout = json.loads((root / 'parallel-index-10m-stdout.json').read_text(encoding='utf-8'))
          ledger = json.loads((root / 'run-ledger-10m.json').read_text(encoding='utf-8'))
          ledger_stdout = json.loads((root / 'run-ledger-10m-stdout.json').read_text(encoding='utf-8'))

          schemas = (
              (validation, 'schemas/omega_naruto_parallel_validation_v3.schema.json'),
              (index, 'schemas/omega_naruto_parallel_index_v3.schema.json'),
              (ledger, 'schemas/omega_naruto_run_ledger_v3.schema.json'),
          )
          for payload, schema_path in schemas:
              schema = json.loads(Path(schema_path).read_text(encoding='utf-8'))
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(payload)

          expected_shards = (target + shard_records - 1) // shard_records
          assert plan['target_records'] == target
          assert plan['partition_count'] == expected_shards
          assert first['written_records'] == target
          assert first['shard_count'] == expected_shards
          assert first['generated_shards'] == expected_shards
          assert first['resumed_shards'] == 0
          assert first['complete'] is True
          assert resumed['written_records'] == target
          assert resumed['generated_shards'] == 0
          assert resumed['resumed_shards'] == expected_shards
          assert resumed['logical_corpus_sha256'] == first['logical_corpus_sha256']
          assert resumed['merkle_root_sha256'] == first['merkle_root_sha256']

          assert validation == validation_stdout
          assert validation['valid'] is True
          assert validation['observed_records'] == target
          assert validation['observed_shards'] == expected_shards
          assert validation['all_record_fields_recomputed'] is True
          assert validation['global_stream_sha256_recomputed'] is False
          assert validation['findings'] == []
          assert validation['merkle_root_sha256'] == first['merkle_root_sha256']
          assert len(validation['shard_proofs']) == expected_shards
          assert all(item['valid'] for item in validation['shard_proofs'])

          assert index == index_stdout
          assert index['indexed_records'] == target
          assert index['indexed_shards'] == expected_shards
          assert sum(index['counts_by_epoch'].values()) == target
          assert sum(index['counts_by_operator'].values()) == target
          assert sum(index['counts_by_domain'].values()) == target
          assert sum(index['counts_by_oak_action'].values()) == target

          assert ledger == ledger_stdout
          assert ledger['valid'] is True
          assert ledger['contiguous'] is True
          assert ledger['run_count'] == 1
          assert ledger['total_records'] == target
          assert ledger['first_ordinal'] == 0
          assert ledger['next_ordinal'] == target
          assert ledger['runs'][0]['merkle_root_sha256'] == first['merkle_root_sha256']

          if target == 10_000_000:
              assert expected_shards == 100
              assert first['completed_epochs_after'] == 155
              assert first['partial_epoch_records_after'] == 640
              assert index['completed_epochs'] == 155
              assert index['partial_epoch_records'] == 640
              assert len(index['counts_by_epoch']) == 156
              assert index['covered_local_combinations'] == 64_512
              assert index['local_coverage_fraction'] == 1.0
              assert index['repeated_axis_realizations'] == 9_935_488
              expected_actions = {
                  'BLOCK_AND_RETAIN_MMINUS': 5_000_000,
                  'REJECT_UNSUPPORTED_AND_RETAIN_MMINUS': 1_250_004,
                  'WARN_REQUIRE_HUMAN_REVIEW': 1_874_998,
                  'RANK_LOCALLY_WITHOUT_CERTIFICATION': 1_562_499,
                  'RECOMPUTE_GATES_BEFORE_SELECTION': 312_499,
              }
              assert index['counts_by_oak_action'] == expected_actions
              assert index['mminus_records'] == 6_250_004
              assert index['blocked_records'] == 5_000_000
              assert index['human_review_records'] == 1_874_998
              assert index['locally_ranked_records'] == 1_562_499
              assert len(index['samples']) == 256
          PY

      - name: Write compact 10M proof summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('generated/omega_naruto')
          manifest = json.loads((root / 'scale-manifest-10m-first.json').read_text(encoding='utf-8'))
          validation = json.loads((root / 'parallel-validation-10m.json').read_text(encoding='utf-8'))
          index = json.loads((root / 'parallel-index-10m.json').read_text(encoding='utf-8'))
          ledger = json.loads((root / 'run-ledger-10m.json').read_text(encoding='utf-8'))
          proof = {
              'schema': 'omega_naruto_frontier.scale_proof.v3',
              'records': manifest['written_records'],
              'shards': manifest['shard_count'],
              'generation_workers': manifest['worker_count'],
              'proof_workers': validation['workers'],
              'generation_records_per_second': manifest['records_per_second'],
              'parallel_validation_records_per_second': validation['records_per_second'],
              'parallel_index_records_per_second': index['records_per_second'],
              'compression_ratio': manifest['compression_ratio'],
              'logical_corpus_sha256': manifest['logical_corpus_sha256'],
              'merkle_root_sha256': manifest['merkle_root_sha256'],
              'federation_root_sha256': ledger['federation_root_sha256'],
              'validation_valid': validation['valid'],
              'local_coverage_fraction': index['local_coverage_fraction'],
              'completed_epochs': index['completed_epochs'],
              'partial_epoch_records': index['partial_epoch_records'],
              'mminus_records': index['mminus_records'],
              'blocked_records': index['blocked_records'],
              'non_claim': (
                  'Ten-million scale proof demonstrates deterministic capacity, '
                  'parallel verification, resume, and integrity—not scientific truth.'
              ),
          }
          (root / 'scale-proof-10m.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(proof, indent=2, sort_keys=True))
          PY

      - name: Upload full compressed 10M proof
        uses: actions/upload-artifact@v4
        with:
          name: omega-naruto-frontier-scale-v3-${{ env.TARGET_RECORDS }}
          path: generated/omega_naruto/**
          if-no-files-found: error
          retention-days: 14
