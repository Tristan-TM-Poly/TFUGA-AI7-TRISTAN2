name: Omega Kramer Tristan CI

on:
  pull_request:
    paths:
      - "scripts/omega_kramer_tristan.py"
      - "tests/test_omega_kramer_tristan.py"
      - "docs/omega-kramer/**"
      - ".github/workflows/omega-kramer-ci.yml"
  push:
    branches:
      - "omega-kramer-**"
    paths:
      - "scripts/omega_kramer_tristan.py"
      - "tests/test_omega_kramer_tristan.py"
      - "docs/omega-kramer/**"
      - ".github/workflows/omega-kramer-ci.yml"

permissions:
  contents: read

jobs:
  exact-regression:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact unit tests
        run: python -m unittest tests.test_omega_kramer_tristan -v
      - name: Deterministic CLI smoke
        run: python scripts/omega_kramer_tristan.py demo > /tmp/omega-kramer-demo.json
      - name: Verify certificate flag in demo
        run: python -c 'import json; d=json.load(open("/tmp/omega-kramer-demo.json")); assert d["certificate_exact"] is True; assert d["bordered_probe_residual"] == "0"'
