name: Omega University R0.2

on:
  pull_request:
    paths:
      - "omega_university_t/**"
      - ".github/workflows/omega-university-r02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oak-court:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run R0.1 + R0.2 OAK courts
        run: python -m unittest discover -s omega_university_t/tests -p 'test_university*.py' -v
      - name: Compile package
        run: python -m compileall -q omega_university_t
