name: Omega Web HG R0.1 OAKBench

on:
  pull_request:
    paths:
      - "omega_web_hg_t/**"
      - "tests/test_omega_web_hg_t.py"
      - "docs/omega_web_hg_t/**"
      - "pyproject.toml"
      - ".github/workflows/omega-web-hg.yml"
  push:
    paths:
      - "omega_web_hg_t/**"
      - "tests/test_omega_web_hg_t.py"
      - "docs/omega_web_hg_t/**"
      - "pyproject.toml"
      - ".github/workflows/omega-web-hg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m compileall -q omega_web_hg_t tests/test_omega_web_hg_t.py
      - run: pytest -q tests/test_omega_web_hg_t.py
