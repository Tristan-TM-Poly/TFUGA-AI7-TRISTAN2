name: Omega Web HG R0.1-R0.2 MAX OAKBench

on:
  pull_request:
    paths:
      - "omega_web_hg_t/**"
      - "tests/test_omega_web_hg_t.py"
      - "tests/test_omega_web_hg_r02.py"
      - "schemas/omega_web_hg_*_v2.schema.json"
      - "docs/omega_web_hg_t/**"
      - "examples/omega_web_hg*.py"
      - "pyproject.toml"
      - ".github/workflows/omega-web-hg.yml"
  push:
    paths:
      - "omega_web_hg_t/**"
      - "tests/test_omega_web_hg_t.py"
      - "tests/test_omega_web_hg_r02.py"
      - "schemas/omega_web_hg_*_v2.schema.json"
      - "docs/omega_web_hg_t/**"
      - "examples/omega_web_hg*.py"
      - "pyproject.toml"
      - ".github/workflows/omega-web-hg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile R0.1 and R0.2
        run: python -m compileall -q omega_web_hg_t tests/test_omega_web_hg_t.py tests/test_omega_web_hg_r02.py examples/omega_web_hg_demo.py examples/omega_web_hg_r02_demo.py
      - name: Run OAKBench tests
        run: pytest -q tests/test_omega_web_hg_t.py tests/test_omega_web_hg_r02.py
      - name: Validate R0.2 JSON Schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          paths = [
              Path("schemas/omega_web_hg_manifest_v2.schema.json"),
              Path("schemas/omega_web_hg_version_v2.schema.json"),
              Path("schemas/omega_web_hg_change_v2.schema.json"),
          ]
          for path in paths:
              schema = json.loads(path.read_text(encoding="utf-8"))
              jsonschema.Draft202012Validator.check_schema(schema)
          print("OMEGA_WEB_HG_R02_SCHEMAS_VALID")
          PY
      - name: Verify CLIs load without network access
        run: |
          python -m omega_web_hg_t.cli --help >/dev/null
          python -m omega_web_hg_t.r02.cli --help >/dev/null
