name: Omega Histoscience R0.3 MAX Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/omega_histosci_r03_payload/**"
      - "tools/materialize_omega_histosci_r03.py"
      - ".github/workflows/omega-histoscience-r03-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-histoscience-r03-bootstrap-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focused validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Materialize and validate R0.3 MAX
        run: python tools/materialize_omega_histosci_r03.py
      - name: Inspect exact generated scope
        run: |
          git status --short
          git diff --stat
      - name: Commit exact generated paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            omega_histosci_hg_t/r03 \
            tests/test_omega_histosci_r03.py \
            schemas/omega_histosci_claim_v3.schema.json \
            schemas/omega_histosci_frontier_v3.schema.json \
            schemas/omega_histosci_oak_report_v3.schema.json \
            schemas/omega_histosci_checkpoint_v3.schema.json \
            schemas/omega_histosci_community_rights_v3.schema.json \
            data/omega_histosci_hg/r03 \
            docs/omega-histoscience-hg-t/R03_MAX.md \
            examples/omega_histosci_r03_demo.py \
            .github/workflows/omega-histoscience-r03.yml \
            pyproject.toml
          git diff --cached --stat
          git commit -m "feat(histoscience): materialize Ω-HISTOSCI-HG-T∞ R0.3 MAX streaming frontier"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
