name: Omega Value OS R0.1 OAKBench

on:
  workflow_dispatch:
  push:
    branches: [feat/omega-value-os-r01-max]
    paths:
      - 'omega_value_os_t/**'
      - 'tests/test_omega_value_os_t.py'
      - 'schemas/omega_value_os_*.schema.json'
      - 'policies/omega_value_os_r01_policy.json'
      - 'docs/canon/OMEGA_VALUE_OS_T_INFINITY_R0_1.md'
      - 'docs/architecture/OMEGA_VALUE_OS_R01_ARCHITECTURE.md'
      - '.github/workflows/omega-value-os-r01-oakbench.yml'
  pull_request:
    paths:
      - 'omega_value_os_t/**'
      - 'tests/test_omega_value_os_t.py'
      - 'schemas/omega_value_os_*.schema.json'
      - 'policies/omega_value_os_r01_policy.json'
      - 'docs/canon/OMEGA_VALUE_OS_T_INFINITY_R0_1.md'
      - 'docs/architecture/OMEGA_VALUE_OS_R01_ARCHITECTURE.md'
      - '.github/workflows/omega-value-os-r01-oakbench.yml'

permissions:
  contents: read

concurrency:
  group: omega-value-os-r01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  judiciary:
    name: Judiciary / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile package
        run: python -m compileall -q omega_value_os_t tests/test_omega_value_os_t.py

      - name: Run focused court
        run: python -m pytest -q tests/test_omega_value_os_t.py

      - name: Generate deterministic evidence twice
        run: |
          python -m omega_value_os_t demo --output /tmp/value-os-a.json
          python -m omega_value_os_t demo --output /tmp/value-os-b.json
          python -m omega_value_os_t constitution --output /tmp/value-os-constitution.json
          python -m omega_value_os_t oak --output /tmp/value-os-oak.json
          cmp /tmp/value-os-a.json /tmp/value-os-b.json

      - name: Validate schemas and constitutional policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          decision_schema = json.loads(Path('schemas/omega_value_os_decision_r01.schema.json').read_text())
          portfolio_schema = json.loads(Path('schemas/omega_value_os_portfolio_r01.schema.json').read_text())
          policy = json.loads(Path('policies/omega_value_os_r01_policy.json').read_text())
          portfolio = json.loads(Path('/tmp/value-os-a.json').read_text())
          constitution = json.loads(Path('/tmp/value-os-constitution.json').read_text())
          oak = json.loads(Path('/tmp/value-os-oak.json').read_text())

          Draft202012Validator(portfolio_schema).validate(portfolio)
          validator = Draft202012Validator(decision_schema)
          for report in portfolio['reports']:
              validator.validate(report)

          reports = {x['case_id']: x for x in portfolio['reports']}
          assert reports['software.crystallized']['status'] == 'ELIGIBLE_FOR_HUMAN_REVIEW'
          assert reports['research.fertile']['status'] == 'ABSTAIN_MORE_EVIDENCE'
          assert reports['action.unsafe']['status'] == 'BLOCKED'
          assert reports['action.unsafe']['effective_value'] == 0
          assert 'safety' in reports['action.unsafe']['failed_gates']
          assert reports['claim.overreach']['status'] == 'BLOCKED'
          assert 'claim_ceiling' in reports['claim.overreach']['failed_gates']

          assert policy['hard_gates_are_non_compensatory'] is True
          assert policy['authority'] == 'review_only'
          assert policy['automatic_merge_allowed'] is False
          assert policy['automatic_publication_allowed'] is False
          assert policy['external_action_performed_by_package'] is False
          assert constitution['authority'] == 'review_only'
          assert oak['checks']['hard_gates_non_compensatory'] is True
          assert oak['checks']['external_action_surface'] is False
          PY

      - name: Audit immutable action refs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/workflows/omega-value-os-r01-oakbench.yml').read_text()
          refs = re.findall(r'uses:\s*([^\s#]+)', text)
          moving = [ref for ref in refs if not re.search(r'@[0-9a-f]{40}$', ref)]
          assert not moving, moving
          PY

      - name: Stage proof bundle
        if: matrix.python-version == '3.13'
        run: |
          mkdir -p /tmp/omega-value-os-r01-evidence
          cp /tmp/value-os-a.json /tmp/omega-value-os-r01-evidence/portfolio.json
          cp /tmp/value-os-constitution.json /tmp/omega-value-os-r01-evidence/constitution.json
          cp /tmp/value-os-oak.json /tmp/omega-value-os-r01-evidence/oak.json
          cp policies/omega_value_os_r01_policy.json /tmp/omega-value-os-r01-evidence/policy.json

      - name: Upload proof bundle
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-value-os-r01-${{ github.run_id }}
          path: /tmp/omega-value-os-r01-evidence
          if-no-files-found: error
          retention-days: 30
