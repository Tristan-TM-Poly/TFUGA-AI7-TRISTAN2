name: omega-pct-ci

on:
  pull_request:
    paths:
      - 'omega_pct_t/**'
      - 'data/omega_pct_catalog.json'
      - 'schemas/omega-pct-candidate.schema.json'
      - 'policies/omega-pct-oak.json'
      - 'tests/test_omega_pct_*.py'
      - '.github/workflows/omega-pct-ci.yml'
  push:
    branches: [main]
    paths:
      - 'omega_pct_t/**'
      - 'data/omega_pct_catalog.json'
      - 'tests/test_omega_pct_*.py'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/test_omega_pct_core.py tests/test_omega_pct_physics.py tests/test_omega_pct_transforms.py tests/test_omega_pct_hypercomplex.py tests/test_omega_pct_frontier.py tests/test_omega_pct_pipeline.py
      - run: python -m omega_pct_t catalog data/omega_pct_catalog.json --json
      - run: python -m omega_pct_t qed-reference data/omega_pct_catalog.json --output-dir generated/omega_pct_t/ci --count 32 --sqrt-s 10 --seed 11
