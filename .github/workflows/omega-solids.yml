name: omega-solids

on:
  pull_request:
    paths:
      - "omega_solids_t/**"
      - "tests/test_omega_solids_t.py"
      - "schemas/solid_genome.schema.json"
      - "data/omega_solids/**"
      - "docs/omega_solids_t.md"
      - "pyproject.toml"
      - ".github/workflows/omega-solids.yml"
  push:
    branches: [main]
    paths:
      - "omega_solids_t/**"
      - "tests/test_omega_solids_t.py"
      - "schemas/solid_genome.schema.json"
      - "data/omega_solids/**"
      - "docs/omega_solids_t.md"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q omega_solids_t
      - run: python -m pytest -q tests/test_omega_solids_t.py
      - run: python -m omega_solids_t.cli atlas --output-dir generated/omega-solids-ci
      - run: python -m omega_solids_t.cli frontier --work-items 250 --initial-batch 16 --output-dir generated/omega-solids-frontier-ci
