name: Omega Anime Episode R3

on:
  pull_request:
    paths:
      - "omega_anime_episode_t/**"
      - "tests/test_omega_anime_episode_t_r3.py"
      - "schemas/anime-episode-r3.schema.json"
      - "policies/omega_anime_episode_r3.json"
      - "docs/omega_anime_episode_t_r3.md"
      - "examples/omega_anime_episode_r3_demo.py"
      - ".github/workflows/omega-anime-episode-r3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-anime-episode-r3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  episode-oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Compile source
        run: python -m compileall omega_anime_episode_t tests/test_omega_anime_episode_t_r3.py examples/omega_anime_episode_r3_demo.py
      - name: Run R3 proof tests
        run: pytest -q tests/test_omega_anime_episode_t_r3.py --durations=20 | tee /tmp/omega-anime-episode-r3-tests.log
      - name: Validate exact 20-minute schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from omega_anime_episode_t import build_eighth_fire_episode_01_r3
          schema = json.loads(Path('schemas/anime-episode-r3.schema.json').read_text())
          episode = build_eighth_fire_episode_01_r3().to_dict()
          Draft202012Validator(schema).validate(episode)
          assert episode['duration_s'] == 1200.0
          assert len(episode['scenes']) == 12
          assert len(episode['shots']) == 114
          print(json.dumps({'duration_s': 1200, 'minutes': 20, 'scenes': 12, 'shots': 114}, indent=2))
          PY
      - name: Compile episode bundle
        run: |
          rm -rf /tmp/eighth-fire-episode-01-r3
          python -m omega_anime_episode_t validate-episode-01
          python -m omega_anime_episode_t compile-episode-01 --output-dir /tmp/eighth-fire-episode-01-r3 | tee /tmp/omega-anime-episode-r3-manifest.json
      - name: Enforce bundle gates
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('/tmp/eighth-fire-episode-01-r3')
          expected = {'audio-cues.jsonl','edit-decision-list.csv','episode-01.html','episode-outline.md','manifest.json','storyboard-contact-sheet.svg','subtitles.fr.vtt','timeline.json'}
          assert {p.name for p in root.iterdir()} == expected
          manifest = json.loads((root/'manifest.json').read_text())
          timeline = json.loads((root/'timeline.json').read_text())
          html = (root/'episode-01.html').read_text()
          svg = (root/'storyboard-contact-sheet.svg').read_text()
          vtt = (root/'subtitles.fr.vtt').read_text()
          assert manifest['duration_s'] == 1200.0
          assert manifest['duration_minutes'] == 20.0
          assert manifest['scene_count'] == 12
          assert manifest['shot_count'] == 114
          assert timeline['shots'][29]['end_s'] == 180.0
          assert timeline['shots'][-1]['end_s'] == 1200.0
          assert svg.count('data-shot=') == 114
          assert '00:20:00.000' in vtt
          assert 'AudioContext' in html and 'fetch(' not in html and 'http://' not in html and 'https://' not in html
          for name, record in manifest['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == record['sha256']
          print(json.dumps({'manifest': manifest['manifest_sha256'], 'duration': '20:00', 'artifacts': 8, 'network_dependencies': 0}, indent=2))
          PY
      - name: Upload complete 20-minute episode bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eighth-fire-episode-01-r3-py${{ matrix.python-version }}
          path: |
            /tmp/eighth-fire-episode-01-r3
            /tmp/omega-anime-episode-r3-tests.log
            /tmp/omega-anime-episode-r3-manifest.json
          retention-days: 14
