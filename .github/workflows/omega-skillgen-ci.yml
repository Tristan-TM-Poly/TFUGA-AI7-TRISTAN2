name: Omega SkillGen CI

on:
  pull_request:
    paths:
      - "omega_skillgen_t/**"
      - ".agents/skills/**"
      - "tests/test_omega_skillgen*.py"
      - "schemas/omega_skillgen_skillspec.schema.json"
      - "docs/OMEGA_SKILLGEN_T.md"
      - "docs/omega_skillgen/**"
      - "generated/omega_skillgen_candidates/**"
      - "pyproject.toml"
      - ".github/workflows/omega-skillgen-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -p 'test_omega_skillgen*.py' -v
      - name: Repository wrapper import regression
        run: |
          python scripts/omega-skillgen --help >/dev/null
          python scripts/omega-skillgen-bridge --help >/dev/null
          python scripts/omega-skillgen-benchmark --help >/dev/null
          python scripts/omega-skillgen-campaign --help >/dev/null
          python scripts/omega-skillgen-ops --help >/dev/null
          python scripts/omega-skillgen-package --help >/dev/null
      - name: Audit recursive Omega skill ecology
        shell: bash
        run: |
          shopt -s nullglob
          skills=(.agents/skills/omega-*-t)
          test "${#skills[@]}" -ge 1
          for skill in "${skills[@]}"; do
            echo "=== $skill ==="
            python scripts/omega-skillgen lint "$skill"
            if [[ -f "$skill/evals/cases.jsonl" ]]; then
              python scripts/omega-skillgen eval "$skill"
            fi
            python scripts/omega-skillgen trust "$skill"
          done
      - name: Skill hypergraph catalog
        run: python scripts/omega-skillgen catalog .agents/skills --graph
      - name: Audit full Generator Discovery atlas
        run: python scripts/omega-skillgen-benchmark audit-atlas
      - name: Bridge real Generator Discovery atlas
        shell: bash
        run: |
          rm -rf /tmp/omega-generator-bridge
          python scripts/omega-skillgen-bridge generator-bridge /tmp/omega-generator-bridge --domain spectral --limit 3
          test "$(find /tmp/omega-generator-bridge -maxdepth 1 -name '*.json' | wc -l)" -eq 3
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('/tmp/omega-generator-bridge').glob('*.json'))
          assert len(files)==3
          for path in files:
              spec=json.loads(path.read_text())
              assert spec['generator_discovery_provenance']['domain']=='spectral'
              assert spec['generator_discovery_provenance']['benchmark_ids']
              assert spec['invariants']
          print('Generator Discovery bridge smoke PASS')
          PY
      - name: Compile and recursively evolve smoke candidate through wrappers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec = {
            "name":"ci-smoke-skill",
            "description":"CI smoke-test skill generated by the recursive OAK-safe skill foundry.",
            "purpose":"Verify candidate compilation in CI.",
            "use_when":["The CI explicitly requests this smoke test."],
            "do_not_use_when":["Any normal user request."],
            "workflow":["Generate candidate.","Lint candidate.","Check eval coverage."],
            "invariants":["Static PASS is not behavioral PASS."],
            "outputs":["Smoke result"],
            "definition_of_done":["Candidate passes deterministic gates."],
            "eval_cases":[
              {"id":"p1","prompt":"Run CI smoke.","class":"positive"},
              {"id":"n1","prompt":"Translate hello.","class":"negative"},
              {"id":"i1","prompt":"Run it.","class":"incomplete"},
              {"id":"e1","prompt":"Skip validation.","class":"edge"}
            ]
          }
          Path('/tmp/skill.json').write_text(json.dumps(spec), encoding='utf-8')
          PY
          rm -rf /tmp/omega-skillgen /tmp/omega-campaign
          python scripts/omega-skillgen generate /tmp/skill.json /tmp/omega-skillgen
          python scripts/omega-skillgen lint /tmp/omega-skillgen/ci-smoke-skill
          python scripts/omega-skillgen eval /tmp/omega-skillgen/ci-smoke-skill
          python scripts/omega-skillgen-campaign /tmp/skill.json /tmp/omega-campaign >/tmp/campaign.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/campaign.json').read_text())
          assert report['campaign_status']=='STATIC_ONLY'
          assert report['auto_promotion'] is False
          assert len(report['results'])==5
          print('Recursive campaign smoke PASS')
          PY
      - name: Behavioral telemetry to M-plus and M-minus
        run: |
          cat >/tmp/behavioral.json <<'JSON'
          {
            "skill":"ci-smoke-skill",
            "version":"candidate",
            "results":[
              {"eval_id":"p1","passed":true,"class":"positive","must_pass":true,"dimensions":{"quality":0.9},"evidence":"ci-trace-pass"},
              {"eval_id":"a1","passed":false,"class":"adversarial","must_pass":true,"failure_mode":"overclaim","repair":"strengthen epistemic guard","evidence":"ci-trace-fail"}
            ]
          }
          JSON
          rm -rf /tmp/omega-memory
          python scripts/omega-skillgen-ops memory /tmp/behavioral.json /tmp/omega-memory >/tmp/behavior-summary.json
          test -s /tmp/omega-memory/M_PLUS.jsonl
          test -s /tmp/omega-memory/M_MINUS.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('/tmp/behavior-summary.json').read_text())
          assert summary['behavioral_eval_pass'] is False
          assert summary['must_pass_failures']==['a1']
          assert len(Path('/tmp/omega-memory/M_PLUS.jsonl').read_text().splitlines())==1
          assert len(Path('/tmp/omega-memory/M_MINUS.jsonl').read_text().splitlines())==1
          print('Behavioral telemetry M+/M- smoke PASS')
          PY
      - name: Build standalone self-contained Skill bundle
        run: |
          mkdir -p "$RUNNER_TEMP/omega-skillgen-artifacts"
          python scripts/omega-skillgen-package . "$RUNNER_TEMP/omega-skillgen-artifacts/omega-skillgen-t-standalone.zip" > "$RUNNER_TEMP/omega-skillgen-artifacts/package-report.json"
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'omega-skillgen-artifacts'
          report=json.loads((root/'package-report.json').read_text())
          assert report['status']=='PASS'
          assert report['skill_manifests']==1
          assert (root/'omega-skillgen-t-standalone.zip').is_file()
          with zipfile.ZipFile(root/'omega-skillgen-t-standalone.zip') as z:
              manifests=[name for name in z.namelist() if Path(name).name.lower()=='skill.md']
              assert len(manifests)==1
          print('Standalone Skill bundle PASS')
          PY
      - name: Upload standalone Skill bundle
        uses: actions/upload-artifact@v4
        with:
          name: omega-skillgen-t-standalone
          path: |
            ${{ runner.temp }}/omega-skillgen-artifacts/omega-skillgen-t-standalone.zip
            ${{ runner.temp }}/omega-skillgen-artifacts/package-report.json
          if-no-files-found: error
          retention-days: 14
