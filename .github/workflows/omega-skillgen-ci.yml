name: Omega SkillGen CI

on:
  pull_request:
    paths:
      - "omega_skillgen_t/**"
      - ".agents/skills/**"
      - "tests/test_omega_skillgen*.py"
      - "schemas/omega_skillgen_skillspec.schema.json"
      - "docs/OMEGA_SKILLGEN_T.md"
      - "docs/omega_skillgen/**"
      - "generated/omega_skillgen_candidates/**"
      - "pyproject.toml"
      - ".github/workflows/omega-skillgen-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -p 'test_omega_skillgen*.py' -v
      - name: Audit recursive Omega skill ecology
        shell: bash
        run: |
          shopt -s nullglob
          skills=(.agents/skills/omega-*-t)
          test "${#skills[@]}" -ge 1
          for skill in "${skills[@]}"; do
            echo "=== $skill ==="
            python -m omega_skillgen_t lint "$skill"
            if [[ -f "$skill/evals/cases.jsonl" ]]; then
              python -m omega_skillgen_t eval "$skill"
            fi
            python -m omega_skillgen_t trust "$skill"
          done
      - name: Skill hypergraph catalog
        run: python -m omega_skillgen_t catalog .agents/skills --graph
      - name: Audit full Generator Discovery atlas
        run: python scripts/omega-skillgen-benchmark audit-atlas
      - name: Bridge real Generator Discovery atlas
        shell: bash
        run: |
          rm -rf /tmp/omega-generator-bridge
          python scripts/omega-skillgen-bridge generator-bridge /tmp/omega-generator-bridge --domain spectral --limit 3
          test "$(find /tmp/omega-generator-bridge -maxdepth 1 -name '*.json' | wc -l)" -eq 3
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('/tmp/omega-generator-bridge').glob('*.json'))
          assert len(files)==3
          for path in files:
              spec=json.loads(path.read_text())
              assert spec['generator_discovery_provenance']['domain']=='spectral'
              assert spec['generator_discovery_provenance']['benchmark_ids']
              assert spec['invariants']
          print('Generator Discovery bridge smoke PASS')
          PY
      - name: Compile smoke candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec = {
            "name":"ci-smoke-skill",
            "description":"CI smoke-test skill generated by the recursive OAK-safe skill foundry.",
            "purpose":"Verify candidate compilation in CI.",
            "use_when":["The CI explicitly requests this smoke test."],
            "do_not_use_when":["Any normal user request."],
            "workflow":["Generate candidate.","Lint candidate.","Check eval coverage."],
            "invariants":["Static PASS is not behavioral PASS."],
            "outputs":["Smoke result"],
            "definition_of_done":["Candidate passes deterministic gates."],
            "eval_cases":[
              {"id":"p1","prompt":"Run CI smoke.","class":"positive"},
              {"id":"n1","prompt":"Translate hello.","class":"negative"},
              {"id":"i1","prompt":"Run it.","class":"incomplete"},
              {"id":"e1","prompt":"Skip validation.","class":"edge"}
            ]
          }
          Path('/tmp/skill.json').write_text(json.dumps(spec), encoding='utf-8')
          PY
          rm -rf /tmp/omega-skillgen
          python -m omega_skillgen_t generate /tmp/skill.json /tmp/omega-skillgen
          python -m omega_skillgen_t lint /tmp/omega-skillgen/ci-smoke-skill
          python -m omega_skillgen_t eval /tmp/omega-skillgen/ci-smoke-skill
