name: Omega Summary Fractal OAKBench

on:
  workflow_dispatch:
  push:
    branches: [feat/omega-summary-fractal-t-max]
    paths: ['omega_summary_fractal_t/**','tests/test_omega_summary_*.py','schemas/omega_summary_*.schema.json','docs/canon/OMEGA_SUMMARY_FRACTAL_T_INFINITY.md','docs/architecture/OMEGA_SUMMARY_FRACTAL_ARCHITECTURE.md','docs/architecture/OMEGA_SUMMARY_CROSS_REPO.md','examples/omega_summary_fractal_demo.py','pyproject.toml','.github/workflows/omega-summary-fractal-oakbench.yml','.github/workflows/omega-summary-reusable.yml']
  pull_request:
    paths: ['omega_summary_fractal_t/**','tests/test_omega_summary_*.py','schemas/omega_summary_*.schema.json','docs/canon/OMEGA_SUMMARY_FRACTAL_T_INFINITY.md','docs/architecture/OMEGA_SUMMARY_FRACTAL_ARCHITECTURE.md','docs/architecture/OMEGA_SUMMARY_CROSS_REPO.md','examples/omega_summary_fractal_demo.py','pyproject.toml','.github/workflows/omega-summary-fractal-oakbench.yml','.github/workflows/omega-summary-reusable.yml']
permissions:
  contents: read
concurrency:
  group: omega-summary-fractal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  oakbench:
    name: D0-D9 deterministic court / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.11','3.12','3.13']
    steps:
      - name: Checkout exact head with chronology
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '${{ matrix.python-version }}'}
      - name: Install focused validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile implementation
        run: python -m compileall -q omega_summary_fractal_t examples/omega_summary_fractal_demo.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_omega_summary_fractal_t.py tests/test_omega_summary_corpus.py tests/test_omega_summary_lineage.py tests/test_omega_summary_delta.py tests/test_omega_summary_index_export.py
      - name: Generate all depths twice
        env: {SOURCE_DATE_EPOCH: '1786111200'}
        run: |
          rm -rf /tmp/summary-a /tmp/summary-b
          python -m omega_summary_fractal_t all-depths . --audience oak --output-dir /tmp/summary-a --max-files 12000
          python -m omega_summary_fractal_t all-depths . --audience oak --output-dir /tmp/summary-b --max-files 12000
          diff -ru /tmp/summary-a /tmp/summary-b
      - name: Validate chronology relation graph JSON schema and OAK boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('schemas/omega_summary_bundle.schema.json').read_text())
          payload=json.loads(Path('/tmp/summary-a/summary_d9_oak.json').read_text())
          Draft202012Validator(schema).validate(payload)
          assert payload['depth']==9 and payload['audience']=='oak' and payload['cache_fingerprint'] and 'oak' in payload['health']
          systems=[n for n in payload['nodes'] if n['kind']=='system']
          assert systems and all('chronology_rank' in n['metrics'] for n in systems)
          relations={e['relation'] for e in payload['edges']}
          assert {'TESTS','VALIDATES'} & relations
          summary=Path('/tmp/summary-a/SUMMARY.md').read_text()
          assert 'Chronologie structurelle' in summary
          assert 'Relations de preuve et dépendance' in summary
          assert 'Limite épistémique' in summary and 'validation scientifique' in summary
          assert 'objets générés' in summary
          for artifact in ['EVOLUTION.md','PROOF_DEBT.md','CONVERGENCE_CANDIDATES.md','SYSTEM_LINEAGE.json']:
              assert Path('/tmp/summary-a',artifact).is_file(),artifact
          lineage=json.loads(Path('/tmp/summary-a/SYSTEM_LINEAGE.json').read_text())
          assert lineage['fingerprint']==payload['cache_fingerprint']
          assert 'novelty' in lineage['boundary']
          PY
      - name: Exercise DeltaSummary compiler
        run: |
          python -m omega_summary_fractal_t delta /tmp/summary-a/summary_d8_oak.json /tmp/summary-a/summary_d9_oak.json --output-dir /tmp/summary-delta
          test -s /tmp/summary-delta/DELTA_SUMMARY.json
          test -s /tmp/summary-delta/DELTA_SUMMARY.md
      - name: Exercise persistent longitudinal index
        run: |
          rm -rf /tmp/summary-history
          python -m omega_summary_fractal_t index /tmp/summary-a/summary_d8_oak.json --index-file /tmp/summary-history/corpus-index.json --report-dir /tmp/summary-history/reports
          python -m omega_summary_fractal_t index /tmp/summary-a/summary_d9_oak.json --index-file /tmp/summary-history/corpus-index.json --report-dir /tmp/summary-history/reports
          test -s /tmp/summary-history/corpus-index.json
          test -s /tmp/summary-history/reports/LONGITUDINAL_CRYSTALLIZATION.json
          test -s /tmp/summary-history/reports/LONGITUDINAL_CRYSTALLIZATION.md
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from omega_summary_fractal_t.index import verify_index
          payload=json.loads(Path('/tmp/summary-history/corpus-index.json').read_text())
          schema=json.loads(Path('schemas/omega_summary_index.schema.json').read_text())
          Draft202012Validator(schema).validate(payload)
          assert len(payload['runs'])==2
          assert verify_index(payload)
          report=json.loads(Path('/tmp/summary-history/reports/LONGITUDINAL_CRYSTALLIZATION.json').read_text())
          assert report['valid_hash_chain'] is True
          assert 'not scientific progress' in report['boundary']
          PY
      - name: Exercise graph exports
        run: |
          python -m omega_summary_fractal_t export /tmp/summary-a/summary_d9_oak.json --output-dir /tmp/summary-graph
          test -s /tmp/summary-graph/SUMMARY_GRAPH.jsonl
          test -s /tmp/summary-graph/SUMMARY_GRAPH.graphml
          test -s /tmp/summary-graph/SUMMARY_GRAPH_EXPORT.json
          grep -q '<graphml' /tmp/summary-graph/SUMMARY_GRAPH.graphml
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          manifest=json.loads(Path('/tmp/summary-graph/SUMMARY_GRAPH_EXPORT.json').read_text())
          schema=json.loads(Path('schemas/omega_summary_graph_export.schema.json').read_text())
          Draft202012Validator(schema).validate(manifest)
          assert manifest['node_count'] > 0
          assert manifest['edge_count'] > 0
          PY
      - name: Exercise cross-repository compiler with zero-touch history
        env: {SOURCE_DATE_EPOCH: '1786111200'}
        run: |
          mkdir -p /tmp/corpus/demo-a /tmp/corpus/demo-b
          printf '# A\n' >/tmp/corpus/demo-a/README.md
          printf '# B\n' >/tmp/corpus/demo-b/README.md
          python -m omega_summary_fractal_t.corpus_cli --workspace /tmp/corpus --depth 4 --audience oak --output-dir /tmp/corpus-out
          test -s /tmp/corpus-out/CORPUS_SUMMARY.json
          test -s /tmp/corpus-out/CORPUS_INDEX.json
          test -s /tmp/corpus-out/longitudinal/LONGITUDINAL_CRYSTALLIZATION.json
      - name: Audit immutable action refs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for filename in ['.github/workflows/omega-summary-fractal-oakbench.yml','.github/workflows/omega-summary-reusable.yml']:
              refs=re.findall(r'uses:\s*([^\s#]+)',Path(filename).read_text())
              moving=[r for r in refs if not re.search(r'@[0-9a-f]{40}$',r)]
              assert not moving,(filename,moving)
          PY
      - name: Stage summary evidence
        if: matrix.python-version == '3.13'
        run: |
          mkdir -p reports/omega-summary-fractal-ci
          cp -R /tmp/summary-a/. reports/omega-summary-fractal-ci/
          cp -R /tmp/summary-delta reports/omega-summary-fractal-ci/delta
          cp -R /tmp/summary-history reports/omega-summary-fractal-ci/history
          cp -R /tmp/summary-graph reports/omega-summary-fractal-ci/graph
          cp -R /tmp/corpus-out reports/omega-summary-fractal-ci/corpus
      - name: Upload summary evidence
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'omega-summary-fractal-${{ github.run_id }}', path: reports/omega-summary-fractal-ci, if-no-files-found: error, retention-days: 30}
