name: Omega Naruto OAK CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'omega_naruto_hmagfm/**'
      - 'tests/test_omega_naruto*.py'
      - 'schemas/omega_naruto*.json'
      - 'docs/omega_naruto*.md'
      - 'pyproject.toml'
      - '.github/workflows/omega-naruto-ci.yml'

permissions:
  contents: read

concurrency:
  group: omega-naruto-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Compile package and tests
        run: |
          python -m compileall -q omega_naruto_hmagfm
          python -m compileall -q tests/test_omega_naruto*.py

      - name: Run focused test suite
        run: python -m pytest -q tests/test_omega_naruto*.py

      - name: Parse JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path('schemas').glob('omega_naruto*.json'))
          assert paths, 'no Ω-NARUTO schemas found'
          for path in paths:
              payload = json.loads(path.read_text(encoding='utf-8'))
              assert payload.get('$schema'), f'missing $schema: {path}'
              assert payload.get('type') == 'object', f'root must be object: {path}'
          print(f'parsed {len(paths)} schemas')
          PY

      - name: Run CLI smoke and validate outputs
        run: |
          mkdir -p generated/omega_naruto
          python -m omega_naruto_hmagfm.cli \
            --output generated/omega_naruto/report.json \
            --graphml-output generated/omega_naruto/graph.graphml \
            > generated/omega_naruto/stdout.json
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          from jsonschema import Draft202012Validator

          report = json.loads(Path('generated/omega_naruto/report.json').read_text(encoding='utf-8'))
          stdout = json.loads(Path('generated/omega_naruto/stdout.json').read_text(encoding='utf-8'))
          graph_schema = json.loads(Path('schemas/omega_naruto_hgfmn_graph.schema.json').read_text(encoding='utf-8'))
          report_schema = json.loads(Path('schemas/omega_naruto_report_v1_2.schema.json').read_text(encoding='utf-8'))

          assert report == stdout
          assert report['schema'] == 'omega_naruto_hmagfm.report.v1.2'
          assert report['accepted']['claim_id'] == 'SUPPORTED'
          assert report['publication_gate']['release_allowed'] is False
          assert report['robustness']['stable_fraction'] == 0.8

          Draft202012Validator.check_schema(graph_schema)
          Draft202012Validator(graph_schema).validate(report['hgfmn_graph'])
          resolved_report_schema = copy.deepcopy(report_schema)
          resolved_report_schema['properties']['hgfmn_graph'] = graph_schema
          Draft202012Validator.check_schema(resolved_report_schema)
          Draft202012Validator(resolved_report_schema).validate(report)

          root = ElementTree.parse('generated/omega_naruto/graph.graphml').getroot()
          assert root.tag.endswith('graphml')
          PY

      - name: Upload deterministic report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: omega-naruto-oak-report
          path: generated/omega_naruto/**
          if-no-files-found: error
