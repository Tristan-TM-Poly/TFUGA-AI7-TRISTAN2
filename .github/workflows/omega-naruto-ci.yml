name: Omega Naruto OAK CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'omega_naruto_hmagfm/**'
      - 'tests/test_omega_naruto*.py'
      - 'schemas/omega_naruto*.json'
      - 'docs/omega_naruto*.md'
      - '.github/workflows/omega-naruto-ci.yml'

permissions:
  contents: read

concurrency:
  group: omega-naruto-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Compile package and tests
        run: |
          python -m compileall -q omega_naruto_hmagfm
          python -m compileall -q tests/test_omega_naruto*.py

      - name: Run focused test suite
        run: python -m pytest -q tests/test_omega_naruto*.py

      - name: Parse JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path('schemas').glob('omega_naruto*.json'))
          assert len(paths) >= 6, f'expected at least 6 Omega Naruto schemas, found {len(paths)}'
          for path in paths:
              payload = json.loads(path.read_text(encoding='utf-8'))
              assert payload.get('$schema'), f'missing $schema: {path}'
              assert payload.get('type') == 'object', f'root must be object: {path}'
          print(f'parsed {len(paths)} schemas')
          PY

      - name: Run core CLI smoke and validate outputs
        run: |
          mkdir -p generated/omega_naruto
          python -m omega_naruto_hmagfm.cli \
            --output generated/omega_naruto/report.json \
            --graphml-output generated/omega_naruto/graph.graphml \
            > generated/omega_naruto/stdout.json
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          from jsonschema import Draft202012Validator

          report = json.loads(Path('generated/omega_naruto/report.json').read_text(encoding='utf-8'))
          stdout = json.loads(Path('generated/omega_naruto/stdout.json').read_text(encoding='utf-8'))
          graph_schema = json.loads(Path('schemas/omega_naruto_hgfmn_graph.schema.json').read_text(encoding='utf-8'))
          report_schema = json.loads(Path('schemas/omega_naruto_report_v1_2.schema.json').read_text(encoding='utf-8'))

          assert report == stdout
          assert report['schema'] == 'omega_naruto_hmagfm.report.v1.2'
          assert report['accepted']['claim_id'] == 'SUPPORTED'
          assert report['publication_gate']['release_allowed'] is False
          assert report['robustness']['stable_fraction'] == 0.8

          Draft202012Validator.check_schema(graph_schema)
          Draft202012Validator(graph_schema).validate(report['hgfmn_graph'])
          resolved_report_schema = copy.deepcopy(report_schema)
          resolved_report_schema['properties']['hgfmn_graph'] = graph_schema
          Draft202012Validator.check_schema(resolved_report_schema)
          Draft202012Validator(resolved_report_schema).validate(report)

          root = ElementTree.parse('generated/omega_naruto/graph.graphml').getroot()
          assert root.tag.endswith('graphml')
          PY

      - name: Generate and validate 100k frontier corpus
        if: matrix.python-version == '3.11'
        run: |
          python -m omega_naruto_hmagfm.corpus_cli inspect --pretty \
            > generated/omega_naruto/frontier-axes.json
          python -m omega_naruto_hmagfm.corpus_cli generate \
            --output-dir generated/omega_naruto/frontier-100k \
            --target 100000 \
            --shard-records 10000 \
            > generated/omega_naruto/frontier-generation.json
          python -m omega_naruto_hmagfm.corpus_cli validate \
            --output-dir generated/omega_naruto/frontier-100k \
            --report generated/omega_naruto/frontier-validation.json \
            > generated/omega_naruto/frontier-validation-stdout.json
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          root = Path('generated/omega_naruto')
          manifest = json.loads((root / 'frontier-100k/manifest.json').read_text(encoding='utf-8'))
          validation = json.loads((root / 'frontier-validation.json').read_text(encoding='utf-8'))
          generation = json.loads((root / 'frontier-generation.json').read_text(encoding='utf-8'))
          axes = json.loads((root / 'frontier-axes.json').read_text(encoding='utf-8'))
          manifest_schema = json.loads(Path('schemas/omega_naruto_frontier_manifest.schema.json').read_text(encoding='utf-8'))
          validation_schema = json.loads(Path('schemas/omega_naruto_frontier_validation.schema.json').read_text(encoding='utf-8'))

          Draft202012Validator.check_schema(manifest_schema)
          Draft202012Validator(manifest_schema).validate(manifest)
          Draft202012Validator.check_schema(validation_schema)
          Draft202012Validator(validation_schema).validate(validation)

          assert generation == manifest
          assert axes['axis_cardinality'] == 64512
          assert manifest['target_records'] == 100000
          assert manifest['written_records'] == 100000
          assert manifest['completed_epochs'] == 1
          assert manifest['complete'] is True
          assert len(manifest['shards']) == 10
          assert all(item['record_count'] == 10000 for item in manifest['shards'])
          assert validation['valid'] is True
          assert validation['observed_records'] == 100000
          assert validation['unique_record_ids'] == 100000
          assert validation['findings'] == []
          PY

      - name: Upload deterministic reports and 100k corpus
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: omega-naruto-oak-frontier-100k
          path: generated/omega_naruto/**
          if-no-files-found: error
