name: Omega ASM-T R2 P6 Replication Engine

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/omega-asm-t-r2-p5-foundation
    paths:
      - 'omega_asm_t/**'
      - 'tests/test_omega_asm_t*.py'
      - 'schemas/omega_asm_*.schema.json'
      - 'policies/omega_asm_t*.json'
      - 'docs/architecture/OMEGA_ASM_T_*.md'
      - '.github/workflows/omega-asm-t-r2-p6.yml'

permissions:
  contents: read

concurrency:
  group: omega-asm-r2-p6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-court:
    name: P6 Python court / ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile ASM-T package and courts
        run: python -m compileall -q omega_asm_t tests/test_omega_asm_t.py tests/test_omega_asm_t_hardening.py tests/test_omega_asm_t_r2_p5.py tests/test_omega_asm_t_r2_p6.py
      - name: Run R1 P5 and P6 courts
        run: python -m pytest -q tests/test_omega_asm_t.py tests/test_omega_asm_t_hardening.py tests/test_omega_asm_t_r2_p5.py tests/test_omega_asm_t_r2_p6.py
      - name: Check P6 schema and policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('schemas/omega_asm_p6_replication.schema.json').read_text())
          policy=json.loads(Path('policies/omega_asm_t_r2_p6_policy.json').read_text())
          Draft202012Validator.check_schema(schema)
          assert policy['authority']=='review_only'
          assert policy['minimum_available_replicates'] >= 2
          assert policy['same_machine_fingerprint_required'] is True
          assert policy['same_binary_sha256_required'] is True
          assert policy['universal_claim_allowed'] is False
          assert policy['automatic_authority_promotion'] is False
          PY
      - name: Audit immutable action refs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('.github/workflows/omega-asm-t-r2-p6.yml').read_text()
          refs=re.findall(r'(?m)^\s*uses:\s*([^\s#]+)', text)
          moving=[ref for ref in refs if not re.search(r'@[0-9a-f]{40}$', ref)]
          assert refs
          assert not moving, moving
          PY

  synthetic-replication-court:
    name: P6 integration court / three compatible P5 reports
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Create fixed measured-binary identity
        run: printf '%s\n' 'omega-asm-p6-fixed-binary-fixture' >/tmp/omega-asm-p6-binary
      - name: Build three compatible P5 reports through the public CLI
        run: |
          for i in 0 1 2; do
            cycles=$((1000 + i * 20))
            instructions=$((2000 + i * 30))
            cat >"/tmp/perf-$i.csv" <<EOF
          ${cycles};;cycles;1000000;100.00;;
          ${instructions};;instructions;1000000;100.00;;
          100;;branches;1000000;100.00;;
          10;;branch-misses;1000000;100.00;;
          50;;cache-references;1000000;100.00;;
          5;;cache-misses;1000000;100.00;;
          EOF
            python -m omega_asm_t p5-report \
              "/tmp/perf-$i.csv" \
              --binary /tmp/omega-asm-p6-binary \
              --exit-code 0 \
              --output "/tmp/p5-$i.json"
          done
      - name: Aggregate P5 reports into P6 campaign
        run: |
          python -m omega_asm_t p6-aggregate \
            /tmp/p5-0.json /tmp/p5-1.json /tmp/p5-2.json \
            --min-replicates 3 \
            --output /tmp/p6-campaign.json
      - name: Validate P6 campaign contract
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          from jsonschema import Draft202012Validator
          campaign=json.loads(Path('/tmp/p6-campaign.json').read_text())
          schema=json.loads(Path('schemas/omega_asm_p6_replication.schema.json').read_text())
          Draft202012Validator(schema).validate(campaign)
          assert campaign['evidence_level']=='P6-replication-campaign'
          assert campaign['status']=='replicated_identified_target'
          assert campaign['claim_scope']=='replicated_identified_target_only'
          assert campaign['authority']=='review_only'
          assert campaign['available_report_count']==3
          assert len(campaign['groups'])==1
          group=campaign['groups'][0]
          assert group['available_count']==3
          assert group['qualifies_for_identified_target_replication'] is True
          assert len(group['machine_fingerprint'])==64
          assert len(group['binary_sha256'])==64
          assert group['metrics']['ipc']['count']==3
          assert math.isfinite(group['metrics']['ipc']['median'])
          assert campaign['promotion_contract']['universal_claim_allowed'] is False
          assert campaign['promotion_contract']['automatic_authority_promotion'] is False
          PY
      - name: Print P6 campaign
        run: cat /tmp/p6-campaign.json
