name: Omega Problem Atlas R0.3 OAKBench

on:
  push:
    branches: [feat/omega-problem-atlas-r0-3]
    paths:
      - "omega_millennium_t/r03/**"
      - "data/omega_problem_atlas_r03/**"
      - "tests/test_omega_problem_atlas_r03.py"
      - "schemas/omega_problem_atlas_report_v3.schema.json"
      - "docs/omega_millennium_t/r03/**"
      - "examples/omega_problem_atlas_r03_demo.py"
      - "pyproject.toml"
      - ".github/workflows/omega-problem-atlas-r03.yml"
  pull_request:
    paths:
      - "omega_millennium_t/r03/**"
      - "data/omega_problem_atlas_r03/**"
      - "tests/test_omega_problem_atlas_r03.py"
      - "schemas/omega_problem_atlas_report_v3.schema.json"
      - "docs/omega_millennium_t/r03/**"
      - "examples/omega_problem_atlas_r03_demo.py"
      - "pyproject.toml"
      - ".github/workflows/omega-problem-atlas-r03.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile R0.3
        run: python -m compileall -q omega_millennium_t/r03 tests/test_omega_problem_atlas_r03.py examples/omega_problem_atlas_r03_demo.py
      - name: Run R0.3 tests
        run: pytest -q tests/test_omega_problem_atlas_r03.py
      - name: Materialize twice and compare
        run: |
          python -m omega_millennium_t.r03.cli build --output-dir /tmp/atlas-a --primary-budget 12 --secondary-budget 36 --experiment-budget 128
          python -m omega_millennium_t.r03.cli build --output-dir /tmp/atlas-b --primary-budget 12 --secondary-budget 36 --experiment-budget 128
          diff -ru /tmp/atlas-a /tmp/atlas-b
          python -m omega_millennium_t.r03.cli audit /tmp/atlas-a
      - name: Validate report schema and OAK invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path('schemas/omega_problem_atlas_report_v3.schema.json').read_text())
          report = json.loads(Path('/tmp/atlas-a/report.json').read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.validate(report, schema)
          assert report['seed_problem_count'] == 72
          assert report['front_count'] == 24
          assert report['attack_mode_count'] == 8
          assert report['materialized_research_cell_count'] == 576
          assert report['materialized_hyperedge_count'] == 576
          assert report['permanent_total_cap'] is None
          assert report['records_claiming_current_open_status'] == 0
          assert report['records_claiming_solution'] == 0
          assert report['research_cells_claiming_proof'] == 0
          assert report['solution_claimed'] is False
          assert report['formal_proof_claimed'] is False
          assert report['scientific_validation_claimed'] is False
          print('CERTIFIED_SOFTWARE_RESEARCH_FIXTURE_R0_3')
          PY
