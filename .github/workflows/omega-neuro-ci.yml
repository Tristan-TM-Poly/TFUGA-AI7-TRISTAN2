name: Omega Neuro CI

on:
  pull_request:
    paths:
      - "omega_neuro_t/**"
      - "tests/test_omega_neuro_t.py"
      - "docs/omega-neuro/**"
      - "examples/omega_neuro_t_demo.py"
      - "pyproject.toml"
      - ".github/workflows/omega-neuro-ci.yml"
  push:
    paths:
      - "omega_neuro_t/**"
      - "tests/test_omega_neuro_t.py"
      - "docs/omega-neuro/**"
      - "examples/omega_neuro_t_demo.py"
      - "pyproject.toml"
      - ".github/workflows/omega-neuro-ci.yml"

permissions:
  contents: read

jobs:
  test-omega-neuro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run focused unit tests
        run: python -m pytest tests/test_omega_neuro_t.py -q

      - name: Run module smoke test
        run: python -m omega_neuro_t.cli --pretty

      - name: Validate packaging metadata
        run: python -c "import tomllib; data=tomllib.load(open('pyproject.toml','rb')); assert data['project']['scripts']['omega-neuro']=='omega_neuro_t.cli:main'"
