name: Omega Neuro CI

on:
  pull_request:
    paths:
      - "omega_neuro_t/**"
      - "tests/test_omega_neuro*.py"
      - "schemas/omega_neuro*.json"
      - "docs/omega-neuro/**"
      - "examples/omega_neuro*.py"
      - "pyproject.toml"
      - ".github/workflows/omega-neuro-ci.yml"
  push:
    branches:
      - main
    paths:
      - "omega_neuro_t/**"
      - "tests/test_omega_neuro*.py"
      - "schemas/omega_neuro*.json"
      - "docs/omega-neuro/**"
      - "examples/omega_neuro*.py"
      - "pyproject.toml"
      - ".github/workflows/omega-neuro-ci.yml"

concurrency:
  group: omega-neuro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-omega-neuro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run focused unit tests
        run: python -m pytest tests/test_omega_neuro*.py -q

      - name: Run module smoke test
        run: python -m omega_neuro_t.cli --pretty

      - name: Run P1 benchmark smoke test
        run: python -m omega_neuro_t.benchmark_cli --groups 12 --trials-per-group 4 --folds 3 --pretty

      - name: Validate packaging metadata
        run: >-
          python -c "import tomllib; data=tomllib.load(open('pyproject.toml','rb')); scripts=data['project']['scripts']; assert scripts['omega-neuro']=='omega_neuro_t.cli:main'; assert scripts['omega-neuro-bench']=='omega_neuro_t.benchmark_cli:main'"
