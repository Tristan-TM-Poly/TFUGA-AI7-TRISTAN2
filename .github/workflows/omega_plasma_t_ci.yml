name: omega-plasma-t-ci
on:
  pull_request:
    paths: ['omega_plasma_t/**','tests/test_omega_plasma_*.py','schemas/omega_plasma_*.json','policies/omega_plasma_oak.json','.github/workflows/omega_plasma_t_ci.yml']
  push:
    branches: ['main','feat/omega-plasma-*']
    paths: ['omega_plasma_t/**','tests/test_omega_plasma_*.py','schemas/omega_plasma_*.json','policies/omega_plasma_oak.json','.github/workflows/omega_plasma_t_ci.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip pytest jsonschema
      - run: python -m compileall -q omega_plasma_t
      - run: python -m pytest tests/test_omega_plasma_dimensions.py tests/test_omega_plasma_classifier.py tests/test_omega_plasma_model_compiler.py tests/test_omega_plasma_chemistry.py tests/test_omega_plasma_hypergraph.py tests/test_omega_plasma_topology.py tests/test_omega_plasma_oak.py tests/test_omega_plasma_campaign.py tests/test_omega_plasma_dispersion.py tests/test_omega_plasma_atlas.py -q
      - run: python -m omega_plasma_t.cli assess examples/omega_plasma_state.json --output-dir generated/omega-plasma-ci
      - run: python -m omega_plasma_t.cli campaign examples/omega_plasma_campaign.json --output generated/omega-plasma-ci/campaign.jsonl
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('generated/omega-plasma-ci')
          report=json.loads((root/'plasma-report.json').read_text())
          assert report['oak']['status'] in {'passed','review'}
          assert report['oak']['model_decision']['recommended']
          assert len((root/'campaign.jsonl').read_text().splitlines())==600
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: omega-plasma-oak-evidence
          path: generated/omega-plasma-ci/**
