name: Capability OS CI

on:
  pull_request:
    paths:
      - "omega_capability_os_t/**"
      - "tests/test_omega_capability_os*.py"
      - "examples/capability_os_*.json"
      - "docs/OMEGA_CAPABILITY_OS_T.md"
      - ".agents/skills/capability-os/**"
      - ".github/workflows/capability-os-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-os:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Unit and integration tests
        run: python -m pytest -q tests/test_omega_capability_os*.py
      - name: PR-415 fallback planning smoke
        run: |
          python -m omega_capability_os_t describe examples/capability_os_registry.json
          python -m omega_capability_os_t plan \
            examples/capability_os_registry.json \
            examples/capability_os_intent_pr_ci.json \
            --health examples/capability_os_health_pr415.json > /tmp/capability-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("/tmp/capability-plan.json").read_text())
          ids = [step["capability_id"] for step in plan["steps"]]
          assert plan["status"] == "READY", plan
          assert "github.fetch_workflow_job_logs" in ids, ids
          assert "github.fetch_generic_logs" not in ids, ids
          print(json.dumps(plan, indent=2))
          PY
      - name: WorkUnit bridge smoke
        run: |
          python -m omega_capability_os_t workunit-plan \
            examples/capability_os_workunit.json \
            --completed-dependency WU-PREV > /tmp/workunit-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/workunit-plan.json").read_text())
          plan = payload["plan"]
          assert plan["status"] == "READY", plan
          ids = [step["capability_id"] for step in plan["steps"]]
          assert ids[0] == "workunit.generate.WU-CAP-R02", ids
          assert any(item.startswith("workunit.validate.WU-CAP-R02") for item in ids), ids
          print(json.dumps(payload, indent=2))
          PY
      - name: External adapter contract smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from omega_capability_os_t.core import Intent, load_registry, plan
          from omega_capability_os_t.external import ExternalResolver, load_external_bindings, validate_external_bindings
          from omega_capability_os_t.runtime import CapabilityRuntime

          registry = load_registry(json.loads(Path("examples/capability_os_registry.json").read_text()))
          bindings = load_external_bindings(json.loads(Path("examples/capability_os_external_bindings.json").read_text()))
          validation = validate_external_bindings(registry, bindings)
          assert validation["status"] == "PASS", validation

          intent = Intent.from_dict(json.loads(Path("examples/capability_os_external_intent.json").read_text()))
          values = json.loads(Path("examples/capability_os_external_values.json").read_text())
          planned = plan(registry, intent)
          resolver = ExternalResolver(bindings, candidate_sha="ci-sha", plan_fingerprint=planned["fingerprint"])
          receipt = CapabilityRuntime(resolver=resolver).execute(
              registry,
              intent,
              initial_values=values,
              candidate_sha="ci-sha",
              evidence_sha="ci-sha",
          )
          assert receipt["oak"]["status"] == "HOLD", receipt
          assert len(receipt["actions_required"]) == 1, receipt
          audit_request = receipt["actions_required"][0]["external_request"]
          assert audit_request["connector"] == "GitHub", audit_request
          assert audit_request["arguments_redacted"] is True, audit_request
          assert "arguments" not in audit_request, audit_request
          execution_request = resolver.pending_requests(include_arguments=True)[0]
          assert execution_request["arguments"]["pr_number"] == 417, execution_request
          print(json.dumps({"binding_validation": validation, "request": audit_request}, indent=2))
          PY
