name: Theory Evolution R0.4 CI

on:
  pull_request:
    paths:
      - 'omega_generative_closure_t/theory_evolution.py'
      - 'omega_generative_closure_t/morphogenesis.py'
      - 'omega_generative_closure_t/maxmin.py'
      - 'tests/test_omega_theory_evolution_r04.py'
      - 'docs/OMEGA_META_THEORY_EVOLUTION_R04.md'
      - '.github/workflows/theory-evolution-r04-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q omega_generative_closure_t omega_meta_science_t
      - run: python -m unittest tests.test_omega_theory_evolution_r04 -v
      - run: python -m unittest discover -s tests -p 'test_omega_generative_closure_r03.py' -v
