name: Omega Production Quality Observatory R0.1

on:
  pull_request:
    paths:
      - 'tools/production_quality_observatory.py'
      - 'tests/test_production_quality_observatory.py'
      - 'reports/production_quality_snapshot_2026-08-02.json'
      - 'policies/omega_production_quality_observatory_r0_1.json'
      - 'docs/canon/OMEGA-PRODUCTION-QUALITY-OBSERVATORY-R0.1.md'
      - '.github/workflows/omega-production-quality-observatory-r0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Compile evaluator
        run: python -m py_compile tools/production_quality_observatory.py

      - name: Run targeted tests
        run: python -m pytest -q tests/test_production_quality_observatory.py

      - name: Generate deterministic observatory report
        run: |
          python tools/production_quality_observatory.py \
            --snapshot reports/production_quality_snapshot_2026-08-02.json \
            --policy policies/omega_production_quality_observatory_r0_1.json \
            --output-json generated/production-quality/report.json \
            --output-md generated/production-quality/report.md

      - name: Verify current decision and authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('generated/production-quality/report.json').read_text(encoding='utf-8')
          )
          assert report['decision'] == 'REDUCE_WIP_AND_EXTERNALIZE'
          assert report['gates']['volume']['status'] == 'GREEN'
          assert report['gates']['volume']['actual_minimum'] == 81602080
          assert report['gates']['volume']['largest_virtual_plan'] == 10**15
          assert report['gates']['volume']['virtual_plan_excluded'] is True
          assert report['gates']['integration']['status'] == 'GREEN'
          assert report['gates']['wip']['status'] == 'RED'
          assert report['gates']['external_science']['status'] == 'RED'
          assert report['gates']['external_product']['status'] == 'RED'
          assert report['scalar_score_has_final_authority'] is False
          assert report['authority']['automatic_merge'] is False
          assert report['authority']['automatic_publication'] is False
          assert report['authority']['human_approval_required'] is True
          PY

      - name: Upload observatory evidence
        uses: actions/upload-artifact@v7
        with:
          name: omega-production-quality-observatory-r0-1
          path: |
            generated/production-quality/report.json
            generated/production-quality/report.md
