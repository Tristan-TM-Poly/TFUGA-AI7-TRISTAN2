name: omega-github-revenue-oakbench

on:
  pull_request:
    paths:
      - "omega_github_revenue_t/**"
      - "tests/test_omega_github_revenue_t.py"
      - "schemas/omega-github-revenue-artifact.schema.json"
      - "policies/omega-github-revenue.yaml"
      - "docs/OMEGA_GITHUB_REVENUE_T.md"
      - "SPONSORS.md"
      - "pyproject.toml"
      - ".github/workflows/omega-github-revenue.yml"
  push:
    branches: [main]
    paths:
      - "omega_github_revenue_t/**"
      - "tests/test_omega_github_revenue_t.py"
      - "schemas/omega-github-revenue-artifact.schema.json"
      - "policies/omega-github-revenue.yaml"
      - "docs/OMEGA_GITHUB_REVENUE_T.md"
      - "SPONSORS.md"
      - "pyproject.toml"
      - ".github/workflows/omega-github-revenue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Unit and frontier tests
        run: python -m pytest -q tests/test_omega_github_revenue_t.py
      - name: Bounded demo
        run: python -m omega_github_revenue_t.cli demo > /tmp/omega-github-revenue-demo.json
      - name: Streaming fixture audit
        run: |
          omega-github-revenue audit examples/data/revenue_artifacts.jsonl \
            --output /tmp/revenue-audit.jsonl \
            --minimum-score 0.0
          test "$(wc -l < /tmp/revenue-audit.jsonl)" -eq 2
      - name: Repository banking-data guard
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E '(void[_ -]?cheque|bank[_ -]?account[_ -]?number|transit[_ -]?number|institution[_ -]?number|routing[_ -]?number|stripe[_ -]?secret)' -- \
            ':!omega_github_revenue_t/ledger.py' \
            ':!policies/omega-github-revenue.yaml' \
            ':!docs/OMEGA_GITHUB_REVENUE_T.md' \
            ':!omega_github_revenue_t/README.md' \
            ':!.github/workflows/omega-github-revenue.yml'; then
            echo 'Potential forbidden financial field found outside approved policy/code documentation.' >&2
            exit 1
          fi
