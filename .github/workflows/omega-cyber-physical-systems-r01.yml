name: Omega Cyber Physical Systems R0.1-R0.2

on:
  push:
    branches:
      - feat/omega-cyber-physical-systems-r0-1-max
    paths:
      - "omega_cyber_physical_systems_t/**"
      - "tests/test_omega_cyber_physical_systems*.py"
      - "schemas/cyber_physical_*.json"
      - "docs/omega-cyber-physical-systems-t/**"
      - "examples/omega_cyber_physical_systems_*.py"
      - "pyproject.toml"
      - ".github/workflows/omega-cyber-physical-systems-r01.yml"
  pull_request:
    paths:
      - "omega_cyber_physical_systems_t/**"
      - "tests/test_omega_cyber_physical_systems*.py"
      - "schemas/cyber_physical_*.json"
      - "docs/omega-cyber-physical-systems-t/**"
      - "examples/omega_cyber_physical_systems_*.py"
      - "pyproject.toml"
      - ".github/workflows/omega-cyber-physical-systems-r01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cps-r02-oak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile whole-system package
        run: python -m compileall omega_cyber_physical_systems_t
      - name: Run cumulative cyberphysical regressions
        run: >-
          python -m pytest -q
          tests/test_omega_cyber_physical_systems_r01.py
          tests/test_omega_cyber_physical_systems_r01_evidence.py
          tests/test_omega_cyber_physical_systems_r02.py
      - name: Run R0.1 and R0.2 OAK benchmarks
        run: |
          python -m omega_cyber_physical_systems_t benchmark > /tmp/cps-r01-oak.json
          python -m omega_cyber_physical_systems_t.r02_cli benchmark > /tmp/cps-r02-oak.json
      - name: Materialize R0.1 blueprint and simulations
        run: |
          python -m omega_cyber_physical_systems_t blueprint-demo > /tmp/cps-blueprint.json
          python -m omega_cyber_physical_systems_t dynamics-demo --model mechanical --summary-only > /tmp/cps-mechanical.json
          python -m omega_cyber_physical_systems_t dynamics-demo --model motor --summary-only > /tmp/cps-motor.json
          python -m omega_cyber_physical_systems_t cosim-demo > /tmp/cps-cosim.json
          python -m omega_cyber_physical_systems_t cosim-demo --faulted --summary-only > /tmp/cps-cosim-faulted.json
      - name: Materialize R0.1 compiler, FMEA, evidence and repository inventory
        run: |
          python -m omega_cyber_physical_systems_t compiler-demo > /tmp/cps-compiler.json
          python -m omega_cyber_physical_systems_t fault-demo > /tmp/cps-faults.json
          python -m omega_cyber_physical_systems_t evidence-demo > /tmp/cps-evidence.json
          python -m omega_cyber_physical_systems_t inventory --root . --max-files-per-system 96 --max-bytes-per-file 48000 --summary-only > /tmp/cps-inventory.json
          python examples/omega_cyber_physical_systems_r01_demo.py > /tmp/cps-r01-example.json
      - name: Materialize R0.2 dimensional and energy evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m omega_cyber_physical_systems_t.r02_cli unit-demo > /tmp/cps-unit-graph.json
          python -m omega_cyber_physical_systems_t.r02_cli energy-demo > /tmp/cps-energy-graph.json

          set +e
          python -m omega_cyber_physical_systems_t.r02_cli energy-demo --faulted > /tmp/cps-energy-faulted.json
          faulted_status=$?
          set -e
          if [ "$faulted_status" -ne 0 ] && [ "$faulted_status" -ne 2 ]; then
            echo "Unexpected faulted energy-demo status: $faulted_status"
            exit 1
          fi

          set +e
          python -m omega_cyber_physical_systems_t.r02_cli energy-demo --untracked-output-j 5 > /tmp/cps-energy-adversarial.json
          adversarial_status=$?
          set -e
          test "$adversarial_status" -eq 2

          python -m omega_cyber_physical_systems_t.r02_cli convert 60 rpm rad/s > /tmp/cps-unit-conversion.json
          python examples/omega_cyber_physical_systems_r02_energy_demo.py > /tmp/cps-r02-example.json
      - name: Validate JSON contracts and OAK boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          def load(path):
              return json.loads(Path(path).read_text())

          blueprint = load('/tmp/cps-blueprint.json')
          cosim = load('/tmp/cps-cosim.json')
          unit_graph = load('/tmp/cps-unit-graph.json')
          energy_graph = load('/tmp/cps-energy-graph.json')
          energy_faulted = load('/tmp/cps-energy-faulted.json')
          adversarial = load('/tmp/cps-energy-adversarial.json')

          jsonschema.validate(blueprint, load('schemas/cyber_physical_system_blueprint_r01.schema.json'))
          jsonschema.validate(cosim, load('schemas/cyber_physical_cosim_report_r01.schema.json'))
          jsonschema.validate(unit_graph, load('schemas/cyber_physical_unit_graph_r02.schema.json'))
          jsonschema.validate(energy_graph, load('schemas/cyber_physical_energy_graph_r02.schema.json'))
          jsonschema.validate(energy_faulted, load('schemas/cyber_physical_energy_graph_r02.schema.json'))
          jsonschema.validate(adversarial, load('schemas/cyber_physical_energy_graph_r02.schema.json'))

          r01 = load('/tmp/cps-r01-oak.json')
          r02 = load('/tmp/cps-r02-oak.json')
          mechanical = load('/tmp/cps-mechanical.json')
          motor = load('/tmp/cps-motor.json')
          faulted = load('/tmp/cps-cosim-faulted.json')
          compiler = load('/tmp/cps-compiler.json')
          faults = load('/tmp/cps-faults.json')
          evidence = load('/tmp/cps-evidence.json')
          inventory = load('/tmp/cps-inventory.json')
          r01_example = load('/tmp/cps-r01-example.json')
          r02_example = load('/tmp/cps-r02-example.json')
          conversion = load('/tmp/cps-unit-conversion.json')

          assert r01['passed'] is True
          assert r01['status'] == 'CERTIFIED_COMPUTATIONAL_CYBER_PHYSICAL_SYSTEMS_R0_1'
          assert r02['passed'] is True
          assert r02['status'] == 'CERTIFIED_COMPUTATIONAL_UNIT_ENERGY_GRAPH_R0_2'
          assert all(gate['passed'] for gate in r02['gates'])
          assert r02['physics_certified'] is False
          assert r02['energy_conservation_proven'] is False
          assert r02['passivity_proven'] is False
          assert r02['standards_compliance_claim'] is False
          assert r02['hardware_validated'] is False

          assert len(blueprint['components']) == 7
          assert len(blueprint['connections']) == 6
          assert blueprint['permanent_total_cap'] is None
          assert blueprint['physics_certified'] is False
          assert len(blueprint['evidence_hash']) == 64
          assert mechanical['finite'] is True
          assert motor['finite'] is True
          assert cosim['sample_count'] == 7501
          assert cosim['finite'] is True
          assert faulted['deadline_miss_count'] > 0
          assert compiler['best']['architecture']['architecture_id'] == 'mobile-robot-platform'
          assert compiler['engineering_recommendation'] is False
          assert len(faults['records']) == 3
          assert faults['probability_claim'] is False
          assert evidence['highest_supported_tier'] == 'D3_COSIMULATED_SYSTEM'
          assert evidence['automatic_model_promotion'] is False
          assert inventory['cyberphysical_candidate_count'] >= 2
          assert inventory['integrated_candidate_count'] >= 1
          assert inventory['exhaustive_claim'] is False
          assert r01_example['blueprint']['component_count'] == 7

          assert unit_graph['dimensionally_valid'] is True
          assert unit_graph['causal_connections_valid'] is True
          assert unit_graph['error_count'] == 0
          assert unit_graph['unknown_unit_count'] == 0
          assert unit_graph['warning_count'] >= 1
          assert unit_graph['direct_power_port_count'] >= 1
          assert unit_graph['physics_certified'] is False
          assert unit_graph['standards_compliance_claim'] is False

          assert energy_graph['sample_count'] == 7501
          assert energy_graph['finite'] is True
          assert energy_graph['balance_passed'] is True
          assert energy_graph['global_normalized_residual'] <= 0.02
          assert all(balance['passed'] for balance in energy_graph['balances'])
          assert energy_graph['passivity']['passivity_proven'] is False
          assert energy_graph['energy_conservation_proven'] is False
          assert energy_graph['physics_certified'] is False
          assert energy_graph['hardware_validated'] is False
          assert energy_faulted['finite'] is True
          assert adversarial['balance_passed'] is False
          global_adversarial = next(item for item in adversarial['balances'] if item['balance_id'] == 'global')
          assert global_adversarial['passed'] is False
          assert abs(adversarial['global_residual_j']) > adversarial['residual_tolerance_j']
          assert abs(conversion['converted'] - 6.283185307179586) < 1e-12
          assert r02_example['unit_graph']['dimensionally_valid'] is True
          assert r02_example['energy_graph']['balance_passed'] is True
          assert r02_example['adversarial_probe']['global_balance_passed'] is False

          print(json.dumps({
              'status': 'passed',
              'r01_tests': 30,
              'unit_graph_hash': unit_graph['evidence_hash'],
              'energy_graph_hash': energy_graph['evidence_hash'],
              'energy_global_residual_j': energy_graph['global_residual_j'],
              'energy_global_normalized_residual': energy_graph['global_normalized_residual'],
              'passivity_classification': energy_graph['passivity']['classification'],
              'inventory_records': inventory['record_count'],
              'cyberphysical_candidates': inventory['cyberphysical_candidate_count'],
              'integrated_candidates': inventory['integrated_candidate_count'],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: omega-cyber-physical-systems-r02-evidence
          path: |
            /tmp/cps-r01-oak.json
            /tmp/cps-r02-oak.json
            /tmp/cps-blueprint.json
            /tmp/cps-mechanical.json
            /tmp/cps-motor.json
            /tmp/cps-cosim.json
            /tmp/cps-cosim-faulted.json
            /tmp/cps-compiler.json
            /tmp/cps-faults.json
            /tmp/cps-evidence.json
            /tmp/cps-inventory.json
            /tmp/cps-r01-example.json
            /tmp/cps-unit-graph.json
            /tmp/cps-energy-graph.json
            /tmp/cps-energy-faulted.json
            /tmp/cps-energy-adversarial.json
            /tmp/cps-unit-conversion.json
            /tmp/cps-r02-example.json
          retention-days: 14
