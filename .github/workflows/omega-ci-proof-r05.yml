name: Omega CI Proof R0.5 Mutation Ecology

on:
  pull_request:
    paths:
      - "omega_ci_proof_t/r05/**"
      - "tests/test_omega_ci_proof_r05.py"
      - "data/omega_ci_proof_t/r05-*.json"
      - "schemas/omega_ci_*_v5.schema.json"
      - "docs/omega-ci-proof-autonomy-t/R05_COUNTEREXAMPLE_MUTATION_ECOLOGY.md"
      - "examples/omega_ci_proof_r05_demo.py"
      - ".github/workflows/omega-ci-proof-r05.yml"
  push:
    branches: [feat/omega-ci-proof-autonomy-r01]
    paths:
      - "omega_ci_proof_t/r05/**"
      - "tests/test_omega_ci_proof_r05.py"
      - "data/omega_ci_proof_t/r05-*.json"
      - "schemas/omega_ci_*_v5.schema.json"
      - "docs/omega-ci-proof-autonomy-t/R05_COUNTEREXAMPLE_MUTATION_ECOLOGY.md"
      - "examples/omega_ci_proof_r05_demo.py"
      - ".github/workflows/omega-ci-proof-r05.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-ci-proof-r05-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-ecology:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable reviewed commit
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile R0.5
        run: >-
          python -m compileall -q omega_ci_proof_t/r05
          tests/test_omega_ci_proof_r05.py examples/omega_ci_proof_r05_demo.py
      - name: Run R0.5 focused suite
        run: pytest -q tests/test_omega_ci_proof_r05.py
      - name: Validate R0.5 input schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          pairs = [
              ('schemas/omega_ci_mutation_spec_v5.schema.json', 'data/omega_ci_proof_t/r05-mutants.json'),
              ('schemas/omega_ci_mutation_tests_v5.schema.json', 'data/omega_ci_proof_t/r05-tests.json'),
              ('schemas/omega_ci_counterexample_seeds_v5.schema.json', 'data/omega_ci_proof_t/r05-seeds.json'),
              ('schemas/omega_ci_metamorphic_contracts_v5.schema.json', 'data/omega_ci_proof_t/r05-contracts.json'),
          ]
          for schema_path, data_path in pairs:
              schema = json.loads(Path(schema_path).read_text())
              jsonschema.Draft202012Validator.check_schema(schema)
              jsonschema.validate(json.loads(Path(data_path).read_text()), schema)
          print('OMEGA_CI_R05_INPUT_SCHEMAS_VALID')
          PY
      - name: Produce R0.5 falsification receipts
        run: |
          rm -rf /tmp/omega-ci-proof-r05
          python -m omega_ci_proof_t.r05 ecology \
            --mutants data/omega_ci_proof_t/r05-mutants.json \
            --tests data/omega_ci_proof_t/r05-tests.json \
            --seeds data/omega_ci_proof_t/r05-seeds.json \
            --contracts data/omega_ci_proof_t/r05-contracts.json \
            --output-dir /tmp/omega-ci-proof-r05
          python -m omega_ci_proof_t.r05 oak > /tmp/omega-ci-proof-r05/r05-oak.json
          python -m compileall -q /tmp/omega-ci-proof-r05/r05-generated-regressions.py
      - name: Validate R0.5 output schemas and invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          root = Path('/tmp/omega-ci-proof-r05')
          pairs = [
              ('schemas/omega_ci_mutation_campaign_v5.schema.json', root / 'r05-campaign.json'),
              ('schemas/omega_ci_counterexample_report_v5.schema.json', root / 'r05-counterexamples.json'),
              ('schemas/omega_ci_metamorphic_report_v5.schema.json', root / 'r05-metamorphic.json'),
              ('schemas/omega_ci_differential_report_v5.schema.json', root / 'r05-differential.json'),
              ('schemas/omega_ci_mminus_compilation_v5.schema.json', root / 'r05-mminus.json'),
              ('schemas/omega_ci_mutation_ecology_v5.schema.json', root / 'r05-ecology.json'),
          ]
          for schema_path, data_path in pairs:
              schema = json.loads(Path(schema_path).read_text())
              jsonschema.Draft202012Validator.check_schema(schema)
              jsonschema.validate(json.loads(Path(data_path).read_text()), schema)
          campaign = json.loads((root / 'r05-campaign.json').read_text())
          counter = json.loads((root / 'r05-counterexamples.json').read_text())
          meta = json.loads((root / 'r05-metamorphic.json').read_text())
          diff = json.loads((root / 'r05-differential.json').read_text())
          mminus = json.loads((root / 'r05-mminus.json').read_text())
          ecology = json.loads((root / 'r05-ecology.json').read_text())
          oak = json.loads((root / 'r05-oak.json').read_text())
          assert (campaign['killed'], campaign['survived'], campaign['equivalent'], campaign['invalid']) == (3, 1, 1, 1)
          assert campaign['mutation_score'] == 0.75
          assert campaign['surviving_mutant_ids'] == ['M-ALL-PREFIX']
          assert counter['counterexamples'][0]['minimized_input'] == '././'
          assert counter['counterexamples'][0]['expected_output'] == './'
          assert counter['counterexamples'][0]['observed_output'] == ''
          assert meta['failed_checks'] > 0
          assert len(diff['divergences']) > 0
          assert len(mminus['rules']) == 1 and mminus['tests_applied'] is False
          assert ecology['unresolved_survivors'] == []
          assert ecology['maximum_authority'] == 'A3'
          assert ecology['execution_authorized'] is False
          assert ecology['automatic_patch_allowed'] is False
          assert ecology['automatic_merge_allowed'] is False
          assert ecology['remote_mutations'] == 0
          assert oak['passed'] is True and oak['maximum_authority'] == 'A3'
          print('OMEGA_CI_R05_PROOFS_VALID')
          PY
      - name: Enforce autonomy boundary
        run: |
          python -m omega_ci_proof_t autonomy --level A3
          if python -m omega_ci_proof_t autonomy --level A4; then
            echo 'A4 must remain disabled' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # immutable reviewed commit
        if: always()
        with:
          name: omega-ci-proof-r05-${{ matrix.python-version }}
          path: /tmp/omega-ci-proof-r05
          if-no-files-found: error
          retention-days: 30
