name: Omega Cyber Physical Systems R0.4 Integrations

on:
  push:
    branches:
      - feat/omega-cps-r03-hybrid-max
    paths:
      - "omega_cyber_physical_systems_t/**"
      - "tests/test_omega_cyber_physical_systems*.py"
      - "schemas/cyber_physical_*.json"
      - "docs/omega-cyber-physical-systems-t/**"
      - "examples/omega_cyber_physical_systems_*.py"
      - "pyproject.toml"
      - ".github/workflows/omega-cyber-physical-systems-r04.yml"
  pull_request:
    paths:
      - "omega_cyber_physical_systems_t/**"
      - "tests/test_omega_cyber_physical_systems*.py"
      - "schemas/cyber_physical_*.json"
      - "docs/omega-cyber-physical-systems-t/**"
      - "examples/omega_cyber_physical_systems_*.py"
      - "pyproject.toml"
      - ".github/workflows/omega-cyber-physical-systems-r04.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cps-r04-oak:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile cumulative CPS package
        run: python -m compileall omega_cyber_physical_systems_t

      - name: Run cumulative R0.1-R0.4 regressions
        run: >-
          python -m pytest -q
          tests/test_omega_cyber_physical_systems_r01.py
          tests/test_omega_cyber_physical_systems_r01_evidence.py
          tests/test_omega_cyber_physical_systems_r02.py
          tests/test_omega_cyber_physical_systems_r03.py
          tests/test_omega_cyber_physical_systems_r04.py

      - name: Run cumulative OAKBench
        run: |
          python -m omega_cyber_physical_systems_t benchmark > /tmp/cps-r01-oak.json
          python -m omega_cyber_physical_systems_t.r02_cli benchmark > /tmp/cps-r02-oak.json
          python -m omega_cyber_physical_systems_t.r03_cli benchmark > /tmp/cps-r03-oak.json
          python -m omega_cyber_physical_systems_t.r04_cli benchmark > /tmp/cps-r04-oak.json

      - name: Materialize R0.4 capability and positive execution evidence
        run: |
          python -m omega_cyber_physical_systems_t.r04_cli capabilities > /tmp/cps-r04-capabilities.json
          python -m omega_cyber_physical_systems_t.r04_cli execute-demo > /tmp/cps-r04-execution-success.json
          python -m omega_cyber_physical_systems_t.r04_cli ledger-demo > /tmp/cps-r04-ledger.json
          python examples/omega_cyber_physical_systems_r04_integration_demo.py > /tmp/cps-r04-example.json

      - name: Materialize R0.4 negative execution evidence
        run: |
          python -m omega_cyber_physical_systems_t.r04_cli negative-demo --case nonzero > /tmp/cps-r04-execution-nonzero.json
          python -m omega_cyber_physical_systems_t.r04_cli negative-demo --case invalid-json > /tmp/cps-r04-execution-invalid-json.json
          python -m omega_cyber_physical_systems_t.r04_cli negative-demo --case timeout > /tmp/cps-r04-execution-timeout.json
          python -m omega_cyber_physical_systems_t.r04_cli negative-demo --case missing-executable > /tmp/cps-r04-execution-missing.json

      - name: Materialize normalized exchange fixtures
        run: |
          python -m omega_cyber_physical_systems_t.r04_cli normalize-demo --adapter FMI_FMU > /tmp/cps-r04-exchange-fmi.json
          python -m omega_cyber_physical_systems_t.r04_cli normalize-demo --adapter MODELICA > /tmp/cps-r04-exchange-modelica.json
          python -m omega_cyber_physical_systems_t.r04_cli normalize-demo --adapter SPICE > /tmp/cps-r04-exchange-spice.json
          python -m omega_cyber_physical_systems_t.r04_cli normalize-demo --adapter ROS2 > /tmp/cps-r04-exchange-ros2.json
          python -m omega_cyber_physical_systems_t.r04_cli normalize-demo --adapter CAN > /tmp/cps-r04-exchange-can.json
          python -m omega_cyber_physical_systems_t.r04_cli normalize-demo --adapter OPCUA > /tmp/cps-r04-exchange-opcua.json
          python -m omega_cyber_physical_systems_t.r04_cli normalize-demo --adapter REFERENCE_LOOPBACK > /tmp/cps-r04-exchange-loopback.json

      - name: Validate R0.4 JSON contracts and epistemic boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          def load(path):
              return json.loads(Path(path).read_text())

          receipt_schema = load('schemas/cyber_physical_execution_receipt_r04.schema.json')
          exchange_schema = load('schemas/cyber_physical_normalized_exchange_r04.schema.json')
          ledger_schema = load('schemas/cyber_physical_integration_ledger_r04.schema.json')

          receipt_paths = [
              '/tmp/cps-r04-execution-success.json',
              '/tmp/cps-r04-execution-nonzero.json',
              '/tmp/cps-r04-execution-invalid-json.json',
              '/tmp/cps-r04-execution-timeout.json',
              '/tmp/cps-r04-execution-missing.json',
          ]
          exchange_paths = [
              '/tmp/cps-r04-exchange-fmi.json',
              '/tmp/cps-r04-exchange-modelica.json',
              '/tmp/cps-r04-exchange-spice.json',
              '/tmp/cps-r04-exchange-ros2.json',
              '/tmp/cps-r04-exchange-can.json',
              '/tmp/cps-r04-exchange-opcua.json',
              '/tmp/cps-r04-exchange-loopback.json',
          ]

          receipts = [load(path) for path in receipt_paths]
          exchanges = [load(path) for path in exchange_paths]
          ledger = load('/tmp/cps-r04-ledger.json')
          capabilities = load('/tmp/cps-r04-capabilities.json')
          example = load('/tmp/cps-r04-example.json')
          r01 = load('/tmp/cps-r01-oak.json')
          r02 = load('/tmp/cps-r02-oak.json')
          r03 = load('/tmp/cps-r03-oak.json')
          r04 = load('/tmp/cps-r04-oak.json')

          for receipt in receipts:
              jsonschema.validate(receipt, receipt_schema)
          for exchange in exchanges:
              jsonschema.validate(exchange, exchange_schema)
          jsonschema.validate(ledger, ledger_schema)

          assert r01['passed'] is True
          assert r02['passed'] is True
          assert r03['passed'] is True
          assert r04['passed'] is True
          assert r04['status'] == 'CERTIFIED_COMPUTATIONAL_EXTERNAL_ADAPTER_RECEIPTS_R0_4'
          assert len(r04['gates']) == 13
          assert all(gate['passed'] for gate in r04['gates'])

          assert receipts[0]['success'] is True
          assert receipts[0]['integration_active'] is True
          assert receipts[0]['execution_proven_for_this_run'] is True
          assert receipts[0]['exit_code'] == 0
          assert receipts[0]['output_json']['samples'] == 3
          assert len(receipts[0]['evidence_hash']) == 64

          expected_negative_statuses = {
              'NONZERO_EXIT',
              'INVALID_JSON',
              'TIMEOUT',
              'EXECUTABLE_NOT_FOUND',
          }
          assert {item['status'] for item in receipts[1:]} == expected_negative_statuses
          assert all(item['success'] is False for item in receipts[1:])
          assert all(item['integration_active'] is False for item in receipts[1:])

          assert len(exchanges) == 7
          assert all(item['valid'] is True for item in exchanges)
          assert all(item['live_connection_claim'] is False for item in exchanges)
          external = [item for item in exchanges if item['adapter_type'] != 'REFERENCE_LOOPBACK']
          assert all(item['replay_only'] is True for item in external)

          assert capabilities['integration_active_count'] == 0
          assert capabilities['execution_proven_count'] == 0
          assert capabilities['hardware_validated'] is False
          assert capabilities['standards_compliance_claim'] is False

          assert ledger['active_connector_count'] == 1
          assert ledger['failed_receipt_count'] == 1
          assert ledger['valid_exchange_count'] == 7
          assert ledger['permanent_total_cap'] is None
          assert ledger['physics_certified'] is False
          assert ledger['hardware_validated'] is False
          assert ledger['safety_certified'] is False
          assert ledger['standards_compliance_claim'] is False

          assert example['external_adapter_count'] == 6
          assert example['capability_active_count'] == 0
          assert example['active_connector_count'] == 1
          assert example['failed_receipt_count'] == 4
          assert example['valid_exchange_count'] == 7
          assert example['oak']['passed'] is True
          assert example['oak']['live_external_connection_proven'] is False
          assert example['oak']['hardware_validated'] is False
          assert example['oak']['standards_compliance_claim'] is False

          assert r04['physics_certified'] is False
          assert r04['hardware_validated'] is False
          assert r04['safety_certified'] is False
          assert r04['standards_compliance_claim'] is False
          assert r04['live_external_connection_proven'] is False
          assert r04['permanent_total_cap'] is None

          print(json.dumps({
              'status': 'passed',
              'r04_gate_count': len(r04['gates']),
              'receipt_hash': receipts[0]['evidence_hash'],
              'ledger_hash': ledger['evidence_hash'],
              'negative_statuses': sorted(expected_negative_statuses),
              'normalized_adapter_count': len(exchanges),
              'active_connector_count': ledger['active_connector_count'],
              'live_external_connection_proven': r04['live_external_connection_proven'],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: omega-cyber-physical-systems-r04-evidence
          path: |
            /tmp/cps-r01-oak.json
            /tmp/cps-r02-oak.json
            /tmp/cps-r03-oak.json
            /tmp/cps-r04-oak.json
            /tmp/cps-r04-capabilities.json
            /tmp/cps-r04-execution-success.json
            /tmp/cps-r04-execution-nonzero.json
            /tmp/cps-r04-execution-invalid-json.json
            /tmp/cps-r04-execution-timeout.json
            /tmp/cps-r04-execution-missing.json
            /tmp/cps-r04-exchange-fmi.json
            /tmp/cps-r04-exchange-modelica.json
            /tmp/cps-r04-exchange-spice.json
            /tmp/cps-r04-exchange-ros2.json
            /tmp/cps-r04-exchange-can.json
            /tmp/cps-r04-exchange-opcua.json
            /tmp/cps-r04-exchange-loopback.json
            /tmp/cps-r04-ledger.json
            /tmp/cps-r04-example.json
          retention-days: 14
