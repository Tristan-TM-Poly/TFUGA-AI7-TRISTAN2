name: Sync Omega Unbounded Branch

on:
  push:
    branches:
      - feat/omega-unbounded-self-improvement-r0.4
    paths:
      - '.github/workflows/sync-omega-unbounded-branch.yml'

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/omega-unbounded-self-improvement-r0.4
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-commit origin/main
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm .github/workflows/sync-omega-unbounded-branch.yml
          git commit -m 'merge: sync Ω-SANS-PLAFOND R0.4-R0.6 with current main'
          git push origin HEAD:feat/omega-unbounded-self-improvement-r0.4
