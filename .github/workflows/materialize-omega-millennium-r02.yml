name: Materialize Omega Millennium R0.2

on:
  push:
    branches: [feat/omega-millennium-t-r0-2]
    paths:
      - "tools/omega_millennium_r02_gen_*.py"
      - "tools/materialize_omega_millennium_r02.py"
      - ".github/workflows/materialize-omega-millennium-r02.yml"

permissions:
  contents: read

jobs:
  materialize:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omega-millennium-t-r0-2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/materialize_omega_millennium_r02.py
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q omega_millennium_t/r02 tests/test_omega_millennium_r02.py
      - run: pytest -q tests/test_omega_millennium_r02.py
      - run: |
          python -m omega_millennium_t.r02.cli benchmark --output /tmp/a.json
          python -m omega_millennium_t.r02.cli benchmark --output /tmp/b.json
          cmp /tmp/a.json /tmp/b.json
          python -m omega_millennium_t.r02.cli campaign --budget 10001 --output /tmp/c.json
      - name: Commit verified plaintext
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- omega_millennium_t/r02 data/omega_millennium_r02 specs/omega_millennium_r02
          git add -- tests/test_omega_millennium_r02.py schemas/omega_millennium_*_v2.schema.json
          git add -- docs/omega_millennium_t/r02 examples/omega_millennium_r02_demo.py pyproject.toml
          git add -u -- tools/omega_millennium_r02_gen_*.py tools/materialize_omega_millennium_r02.py
          git diff --cached --check
          git commit -m "feat(millennium): materialize Ω-MILLENNIUM-T∞ R0.2 canonical hyperproof atlas"
          git push origin HEAD:feat/omega-millennium-t-r0-2
