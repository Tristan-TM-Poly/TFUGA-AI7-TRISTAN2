name: omega-tristan-meta-compiler

on:
  push:
    paths:
      - "omega_tristan_meta/**"
      - "tests/test_meta_compiler.py"
      - "schemas/**"
      - "book0/BOOK0_TRISTAN_META_COMPILER_V1.json"
      - ".agents/skills/omega-tristan-meta-compiler-t/**"
      - "docs/OMEGA_TRISTAN_META_COMPILER.md"
      - ".github/workflows/omega-tristan-meta-compiler.yml"
  pull_request:
    paths:
      - "omega_tristan_meta/**"
      - "tests/test_meta_compiler.py"
      - "schemas/**"
      - "book0/BOOK0_TRISTAN_META_COMPILER_V1.json"
      - ".agents/skills/omega-tristan-meta-compiler-t/**"
      - "docs/OMEGA_TRISTAN_META_COMPILER.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Ω Tristan Meta-Compiler tests
        run: python -m unittest discover -s tests -p "test_meta_compiler.py" -v
      - name: Run example
        run: python -m omega_tristan_meta.cli example
