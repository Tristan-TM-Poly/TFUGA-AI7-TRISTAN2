name: omega-tristan-meta-compiler

on:
  push:
    paths:
      - "omega_tristan_meta/**"
      - "tests/test_meta_*.py"
      - "schemas/**"
      - "book0/BOOK0_TRISTAN_META_COMPILER_V1.json"
      - "book0/BOOK0_META_MORPHOGENESIS_V1.json"
      - ".agents/skills/omega-tristan-meta-compiler-t/**"
      - ".agents/skills/omega-meta-morphogenesis-t/**"
      - "docs/OMEGA_TRISTAN_META_COMPILER.md"
      - "docs/OMEGA_META_MORPHOGENESIS_V1.md"
      - ".github/workflows/omega-tristan-meta-compiler.yml"
  pull_request:
    paths:
      - "omega_tristan_meta/**"
      - "tests/test_meta_*.py"
      - "schemas/**"
      - "book0/BOOK0_TRISTAN_META_COMPILER_V1.json"
      - "book0/BOOK0_META_MORPHOGENESIS_V1.json"
      - ".agents/skills/omega-tristan-meta-compiler-t/**"
      - ".agents/skills/omega-meta-morphogenesis-t/**"
      - "docs/OMEGA_TRISTAN_META_COMPILER.md"
      - "docs/OMEGA_META_MORPHOGENESIS_V1.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Ω Tristan Meta-Compiler and Meta-Morphogenesis tests
        run: python -m unittest discover -s tests -p "test_meta_*.py" -v
      - name: Run example
        run: python -m omega_tristan_meta.cli example
      - name: Compile meta packages
        run: python -m compileall -q omega_tristan_meta
      - name: Validate JSON artifacts
        run: python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('schemas/tristan_ir.schema.json'),
              Path('schemas/receipt.schema.json'),
              Path('schemas/morph_genome.schema.json'),
              Path('book0/BOOK0_TRISTAN_META_COMPILER_V1.json'),
              Path('book0/BOOK0_META_MORPHOGENESIS_V1.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY
