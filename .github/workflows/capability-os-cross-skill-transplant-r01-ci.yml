name: Capability OS Cross-Skill Transplant R0.1 CI

on:
  pull_request:
    paths:
      - 'omega_capability_os_t/cross_skill_transplant.py'
      - 'omega_capability_os_t/real_trace_bench.py'
      - 'omega_capability_os_t/prospective_measurement.py'
      - 'omega_capability_os_t/matched_cohort.py'
      - 'omega_capability_os_t/virtual_tristan.py'
      - 'tests/test_capability_os_cross_skill_transplant_r01.py'
      - 'tests/test_capability_os_real_trace_bench_r02.py'
      - 'tests/test_capability_os_prospective_measurement_r03.py'
      - 'tests/test_capability_os_matched_cohort_r04.py'
      - 'tests/test_capability_os_virtual_tristan_r01.py'
      - 'tests/fixtures/capability_os_pr501_508_trace.json'
      - 'omega_capability_os_t/**'
      - 'omega_generative_closure_t/**'
      - '.github/workflows/capability-os-cross-skill-transplant-r01-ci.yml'

permissions:
  contents: read

jobs:
  court:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q omega_capability_os_t omega_generative_closure_t
      - name: Cross-skill transplant court
        run: python -m unittest tests.test_capability_os_cross_skill_transplant_r01 -v
      - name: Real-trace replay court
        run: python -m unittest tests.test_capability_os_real_trace_bench_r02 -v
      - name: Prospective measurement court
        run: python -m unittest tests.test_capability_os_prospective_measurement_r03 -v
      - name: Matched cohort court
        run: python -m unittest tests.test_capability_os_matched_cohort_r04 -v
      - name: Virtual Tristan court
        run: python -m unittest tests.test_capability_os_virtual_tristan_r01 -v
      - name: R0.10 regression
        run: python -m unittest tests.test_omega_meta_theory_r10_reprovenance_replay -v
      - name: Capability OS regression
        run: python -m unittest discover -s tests -p 'test_capability_os*.py' -v
