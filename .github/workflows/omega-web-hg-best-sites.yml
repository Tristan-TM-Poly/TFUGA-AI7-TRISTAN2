name: Omega Web HG R0.4 Best Sites OAKBench

on:
  pull_request:
    paths:
      - "omega_web_hg_t/r04/**"
      - "tests/test_omega_web_hg_r04.py"
      - "docs/omega_web_hg_t/R04_BEST_SITES.md"
      - "schemas/omega_web_hg_source_profile_v4.schema.json"
      - "pyproject.toml"
      - ".github/workflows/omega-web-hg-best-sites.yml"
  push:
    paths:
      - "omega_web_hg_t/r04/**"
      - "tests/test_omega_web_hg_r04.py"
      - "docs/omega_web_hg_t/R04_BEST_SITES.md"
      - "schemas/omega_web_hg_source_profile_v4.schema.json"
      - "pyproject.toml"
      - ".github/workflows/omega-web-hg-best-sites.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q omega_web_hg_t/r04 tests/test_omega_web_hg_r04.py
      - run: pytest -q tests/test_omega_web_hg_r04.py
      - name: Materialize deterministic metadata-only plan twice
        run: |
          python -m omega_web_hg_t.r04.cli audit
          python -m omega_web_hg_t.r04.cli plan --output-dir /tmp/plan-a
          python -m omega_web_hg_t.r04.cli plan --output-dir /tmp/plan-b
          cmp /tmp/plan-a/campaign-plan.json /tmp/plan-b/campaign-plan.json
      - name: Validate source profiles against schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          from omega_web_hg_t.r04 import BEST_SITES_V1

          schema = json.loads(Path('schemas/omega_web_hg_source_profile_v4.schema.json').read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          validator = jsonschema.Draft202012Validator(schema)
          for source in BEST_SITES_V1:
              validator.validate(source.to_dict())
          print('OMEGA_WEB_HG_R04_BEST_SITES_VALID')
          PY

  live-metadata-pilot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feat/omega-web-hg-best-sites-r04')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run five-source metadata-only pilot
        run: |
          python -m omega_web_hg_t.r04.pilot \
            --output-dir generated/omega_web_hg_r04_live_pilot \
            --delay-seconds 1.0
      - name: Enforce OAK receipt boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('generated/omega_web_hg_r04_live_pilot/pilot-receipt.json')
          data = json.loads(path.read_text())
          assert data['request_count'] == 5
          assert data['metadata_only'] is True
          assert data['full_text_collected'] is False
          assert data['raw_bodies_persisted'] is False
          assert all(record['raw_body_persisted'] is False for record in data['records'])
          print(json.dumps({
              'request_count': data['request_count'],
              'successful_count': data['successful_count'],
              'manifest_sha256': data['manifest_sha256'],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega-web-hg-r04-live-pilot-receipt
          path: generated/omega_web_hg_r04_live_pilot/pilot-receipt.json
          if-no-files-found: error
          retention-days: 30
