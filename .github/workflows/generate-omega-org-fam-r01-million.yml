name: Generate Omega Organic Family R0.1 Million

on:
  push:
    branches:
      - feat/omega-org-fam-t-r0-1-million
    paths:
      - "omega_org_fam_t/**"
      - "tools/generate_omega_org_fam_massive.py"
      - "tests/test_omega_org_fam*.py"
      - "schemas/omega_org_family*.json"
      - ".github/workflows/generate-omega-org-fam-r01-million.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omega-org-fam-t-r0-1-million
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test executable core
        run: python -m pytest tests/test_omega_org_fam_t.py tests/test_omega_org_fam_massive.py
      - name: Generate 1,048,576 linked objects
        run: python tools/generate_omega_org_fam_massive.py --root . --family-records 262144
      - name: Audit counts and hashes
        run: |
          python -m omega_org_fam_t.cli audit generated/omega_org_fam_t_r01
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("generated/omega_org_fam_t_r01/manifest.json").read_text())
          assert manifest["family_records"] == 262_144
          assert manifest["evidence_records"] == 786_432
          assert manifest["total_objects"] == 1_048_576
          assert manifest["generator"]["permanent_total_ceiling"] is None
          print(json.dumps(manifest, indent=2))
          PY
      - name: Commit generated atlas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- generated/omega_org_fam_t_r01
          if git diff --cached --quiet; then
            echo 'Generated atlas already current.'
          else
            git commit -m 'feat(org-fam): materialize 1,048,576 linked family objects'
            git push origin HEAD:feat/omega-org-fam-t-r0-1-million
          fi
