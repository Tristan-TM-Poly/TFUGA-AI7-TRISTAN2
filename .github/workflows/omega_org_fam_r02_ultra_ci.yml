name: omega-org-fam-r02-ultra
on:
  pull_request:
    paths:
      - 'omega_org_fam_t/**'
      - 'tests/test_omega_org_fam_ultra.py'
      - 'tools/generate_omega_org_fam_r02_ultra.py'
      - 'schemas/omega_org_*_r02.schema.json'
      - 'pyproject.toml'
      - '.github/workflows/omega_org_fam_r02_ultra_ci.yml'
  push:
    paths:
      - 'omega_org_fam_t/**'
      - 'tests/test_omega_org_fam_ultra.py'
      - 'tools/generate_omega_org_fam_r02_ultra.py'
      - 'schemas/omega_org_*_r02.schema.json'
      - 'pyproject.toml'
      - '.github/workflows/omega_org_fam_r02_ultra_ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_omega_org_fam_t.py tests/test_omega_org_fam_massive.py tests/test_omega_org_fam_ultra.py
      - name: Generate and audit 1,048,576 linked packed objects
        run: |
          python tools/generate_omega_org_fam_r02_ultra.py --root "$RUNNER_TEMP/omega-r02" --family-records 262144 --shard-families 65536 --clean
          python -m omega_org_fam_t.ultra_cli audit "$RUNNER_TEMP/omega-r02/generated/omega_org_fam_t_r02_ultra"
