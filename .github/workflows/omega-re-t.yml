# Human validation trigger for the crystallized RE256 snapshot.
name: Omega RE T

on:
  pull_request:
    paths:
      - "omega_re_t/**"
      - "tests/test_omega_re_*.py"
      - "docs/omega-re-t/**"
      - "schemas/omega-re-case.schema.json"
      - "pyproject.toml"
      - ".github/workflows/omega-re-t.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_omega_re_*.py
      - run: python -m omega_re_t.cli demo --output /tmp/omega-re-demo.json
      - run: python -m omega_re_t.cli benchmark --cases 8 --output /tmp/omega-re-benchmark.json
