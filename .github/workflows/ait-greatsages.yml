name: AIT GreatSages Gauss R0.1 OAKBench

on:
  pull_request:
    paths:
      - "sage_tristan/greatsages.py"
      - "sage_tristan/ait_pantheon.py"
      - "omega_histosci_hg_t/**"
      - "tests/test_ait_greatsages.py"
      - "docs/canon/AIT-GREATSAGES-GAUSS-R01.md"
      - "pyproject.toml"
      - ".github/workflows/ait-greatsages.yml"
  push:
    branches: ["feat/ait-greatsages-gauss-r01"]
    paths:
      - "sage_tristan/greatsages.py"
      - "sage_tristan/ait_pantheon.py"
      - "omega_histosci_hg_t/**"
      - "tests/test_ait_greatsages.py"
      - "docs/canon/AIT-GREATSAGES-GAUSS-R01.md"
      - "pyproject.toml"
      - ".github/workflows/ait-greatsages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m compileall -q sage_tristan/greatsages.py tests/test_ait_greatsages.py
      - name: Targeted tests
        run: pytest -q tests/test_ait_greatsages.py
      - name: Deterministic chronological OAK gates
        run: |
          python -m sage_tristan.greatsages --sage gauss --year 1795 > /tmp/gauss-1795.json
          python -m sage_tristan.greatsages --sage gauss --year 1801 --discovery gauss_1801_ceres > /tmp/gauss-1801.json
          python - <<'PY'
          import json
          from pathlib import Path

          y1795 = json.loads(Path('/tmp/gauss-1795.json').read_text())['report']
          y1801 = json.loads(Path('/tmp/gauss-1801.json').read_text())
          assert 'gauss_1796_17gon' in y1795['snapshot']['blocked_discovery_ids']
          assert y1795['snapshot']['leakage_free'] is True
          assert y1801['replay']['target_withheld'] is True
          assert y1801['report']['historical_truth_certified'] is False
          assert y1801['report']['historical_impersonation_claimed'] is False
          assert y1801['report']['counterfactuals_are_history'] is False
          assert y1801['report']['histoscience_graph']['valid'] is True
          assert len(y1801['mirrors']) == 8
          print('PROMOTE: software chronology/mirror gates only')
          PY
