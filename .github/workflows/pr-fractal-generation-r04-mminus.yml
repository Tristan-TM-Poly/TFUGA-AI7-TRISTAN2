name: Ω PR 5K2N R0.4 M-minus

on:
  pull_request:
    paths:
      - "omega_capability_os_t/github_pr_generation_r04.py"
      - "tests/test_omega_github_pr_generation_r04.py"
      - "tests/test_omega_github_pr_generation_r04_hardening.py"
      - ".github/workflows/pr-fractal-generation-r04-mminus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m-minus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact-hydration and metadata-only regressions
        run: |
          python -m compileall -q omega_capability_os_t/github_pr_generation_r04.py
          python -m pip install pytest
          python -m pytest -q \
            tests/test_omega_github_pr_generation_r04.py \
            tests/test_omega_github_pr_generation_r04_hardening.py
