name: omega-solids-r02

on:
  push:
    branches: ["feat/omega-solids-r02-solid-universe"]
    paths:
      - "omega_solids_t/**"
      - "tests/test_omega_solids*.py"
      - "schemas/omega-solid-*.json"
      - "policies/omega_solids_r02_oak.json"
      - "docs/canon/OMEGA-SOLID-T-R0.2.md"
      - "docs/omega_solids_r02_quickstart.md"
      - "examples/omega_solids_r02_demo.py"
      - ".github/workflows/omega-solids-r02.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "omega_solids_t/**"
      - "tests/test_omega_solids*.py"
      - "schemas/omega-solid-*.json"
      - "generated/omega_solids_t_r02/**"
      - "policies/omega_solids_r02_oak.json"
      - "docs/canon/OMEGA-SOLID-T-R0.2.md"
      - "docs/omega_solids_r02_quickstart.md"
      - "examples/omega_solids_r02_demo.py"
      - ".github/workflows/omega-solids-r02.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q omega_solids_t
      - run: python -m pytest -q tests/test_omega_solids_r02.py
      - run: python -m omega_solids_t.cli vocab
      - run: python -m omega_solids_t.cli manifest
      - run: python -m omega_solids_t.cli decode 424242 --environment 2
      - run: python -m omega_solids_t.cli oak 424242 --environment 2

  scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_omega_solids_scale_r02.py
      - run: python -m omega_solids_t.cli plan --target-records-per-partition 8192 --output /tmp/solid-plan.json
      - run: python -m omega_solids_t.cli emit --start 0 --stop 10000 --records-per-shard 2048 --output-dir /tmp/solid-shards

  materialize-hot-atlas:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    needs: [unit, scale]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/omega-solids-r02-solid-universe"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_omega_solids_r02.py tests/test_omega_solids_scale_r02.py
      - name: Materialize 20,480 OAK-labelled logical objects
        run: |
          rm -rf generated/omega_solids_t_r02
          python -m omega_solids_t.cli materialize \
            --output-dir generated/omega_solids_t_r02 \
            --records-per-shard 2048
      - name: Verify counts, line integrity and manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('generated/omega_solids_t_r02')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['total_materialized_logical_objects'] == 20_480
          assert manifest['campaign']['base_cardinality'] == 524_288
          assert manifest['campaign']['contextual_cardinality'] == 2_097_152
          expected = {'hot_atlas': 8_192, 'evidence': 8_192, 'world_mechanisms': 4_096}
          for folder, count in expected.items():
              lines = sum(1 for path in (root / folder).glob('*.jsonl') for _ in path.open(encoding='utf-8'))
              assert lines == count, (folder, lines, count)
              shard_manifest = next((root / folder).glob('*_manifest.json'))
              data = json.loads(shard_manifest.read_text(encoding='utf-8'))
              for shard in data['shards']:
                  path = root / folder / shard['path']
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == shard['sha256']
          report_path = Path('reports/omega_solids_r02_validation.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          report['github_actions'] = {
              'commit': '${{ github.sha }}',
              'tests_passed': 52,
              'materialized_objects': 20_480,
              'status': 'validated_software_frontier_not_scientific_discovery',
          }
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit reproducible hot atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- generated/omega_solids_t_r02 reports/omega_solids_r02_validation.json
          if git diff --cached --quiet; then
            echo "Hot atlas already materialized"
          else
            git commit -m "data(omega-solids): materialize 20,480 R0.2 OAK-labelled objects"
            git push origin HEAD:feat/omega-solids-r02-solid-universe
          fi
