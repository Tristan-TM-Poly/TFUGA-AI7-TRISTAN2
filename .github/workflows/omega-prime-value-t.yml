name: Omega Prime Value R0.1

on:
  pull_request:
    paths:
      - "omega_prime_value_t/**"
      - "tests/test_omega_prime_value_t.py"
      - "schemas/omega_prime_*_v1.schema.json"
      - "docs/omega-prime-value-t/**"
      - "examples/omega_prime_value_demo.py"
      - ".github/workflows/omega-prime-value-t.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile
        run: python -m compileall -q omega_prime_value_t tests/test_omega_prime_value_t.py examples/omega_prime_value_demo.py
      - name: Test
        run: pytest -q tests/test_omega_prime_value_t.py
      - name: Deterministic benchmark
        run: |
          python -m omega_prime_value_t benchmark --output /tmp/prime-a.json
          python -m omega_prime_value_t benchmark --output /tmp/prime-b.json
          cmp /tmp/prime-a.json /tmp/prime-b.json
      - name: Validate certificate schema and OAK gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          candidate_schema = json.loads(Path('schemas/omega_prime_candidate_v1.schema.json').read_text())
          certificate_schema = json.loads(Path('schemas/omega_prime_certificate_v1.schema.json').read_text())
          jsonschema.Draft202012Validator.check_schema(candidate_schema)
          jsonschema.Draft202012Validator.check_schema(certificate_schema)
          benchmark = json.loads(Path('/tmp/prime-a.json').read_text())
          assert benchmark['status'] == 'CERTIFIED_PUBLIC_ENGINEERING_PRIME_FIXTURES_R0_1'
          assert benchmark['all_certificates_verified'] is True
          for campaign in benchmark['campaigns']:
              for certificate in campaign['certificates']:
                  jsonschema.validate(certificate, certificate_schema)
                  assert certificate['oak']['record_claimed'] is False
                  assert certificate['oak']['novelty_claimed'] is False
                  assert certificate['oak']['cryptographic_secret_material'] is False
          print('CERTIFIED_PUBLIC_ENGINEERING_PRIME_FIXTURES_R0_1')
          PY
      - name: Upload deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: omega-prime-value-r01-${{ matrix.python-version }}
          path: /tmp/prime-a.json
          if-no-files-found: error
          retention-days: 14
