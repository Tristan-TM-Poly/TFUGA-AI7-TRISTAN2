name: Omega Propulsion Converge and Validate

on:
  push:
    branches:
      - feat/omega-propulsion-r0-3
    paths:
      - ".github/workflows/omega-propulsion-converge.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-propulsion-converge
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omega-propulsion-r0-3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge current main and resolve the shared CLI registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ] && [ "$conflicts" != "pyproject.toml" ]; then
            echo "Unexpected conflicts:"
            echo "$conflicts"
            exit 1
          fi

          git show origin/main:pyproject.toml > pyproject.toml
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          additions = [
              'omega-propulsion-r03 = "omega_aero_hydro_propulsion_t.r03_cli:main"',
              'omega-propulsion-r03-max = "omega_aero_hydro_propulsion_t.r03_max_cli:main"',
              'omega-propulsion-r04 = "omega_aero_hydro_propulsion_t.r04_cli:main"',
          ]
          anchor = 'omega-propulsion-r02 = "omega_aero_hydro_propulsion_t.r02_cli:main"'
          missing = [line for line in additions if line not in text]
          if missing:
              if anchor not in text:
                  raise SystemExit("propulsion CLI anchor missing from current main")
              text = text.replace(anchor, anchor + "\n" + "\n".join(missing), 1)
          path.write_text(text, encoding="utf-8")
          PY

          git add pyproject.toml
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git rm .github/workflows/omega-propulsion-converge.yml
          git add -A

          if [ "$merge_status" -eq 0 ] && ! test -f .git/MERGE_HEAD; then
            echo "Branch already contained main; no convergence merge required."
          fi

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile converged tree
        run: python -m compileall omega_aero_hydro_propulsion_t

      - name: Run R0.1-R0.4 regressions on converged tree
        run: >-
          python -m pytest -q
          tests/test_omega_aero_hydro_propulsion.py
          tests/test_omega_aero_hydro_propulsion_r02.py
          tests/test_omega_aero_hydro_propulsion_r03.py
          tests/test_omega_aero_hydro_propulsion_r03_max.py
          tests/test_omega_aero_hydro_propulsion_r04.py

      - name: Run all propulsion OAK gates
        run: |
          python -m omega_aero_hydro_propulsion_t benchmark > /tmp/r01.json
          python -m omega_aero_hydro_propulsion_t.r02_cli benchmark > /tmp/r02.json
          python -m omega_aero_hydro_propulsion_t.r03_cli benchmark > /tmp/r03.json
          python -m omega_aero_hydro_propulsion_t.r03_max_cli benchmark > /tmp/r03max.json
          python -m omega_aero_hydro_propulsion_t.r04_cli benchmark > /tmp/r04.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "r01": "CERTIFIED_COMPUTATIONAL_LOW_ORDER",
              "r02": "CERTIFIED_COMPUTATIONAL_MULTIPOINT_R0_2",
              "r03": "CERTIFIED_COMPUTATIONAL_SYSTEM_SCREENING_R0_3",
              "r03max": "CERTIFIED_COMPUTATIONAL_SYSTEM_SEARCH_R0_3_MAX",
              "r04": "CERTIFIED_COMPUTATIONAL_ADAPTIVE_MULTIFIDELITY_R0_4",
          }
          for name, status in expected.items():
              payload = json.loads(Path(f"/tmp/{name}.json").read_text())
              assert payload["passed"] is True
              assert payload["physics_certified"] is False
              assert payload["status"] == status
          PY

      - name: Commit and push convergence
        shell: bash
        run: |
          set -euo pipefail
          if test -f .git/MERGE_HEAD; then
            git commit -m "merge(propulsion): converge R0.3 Max and R0.4 with current main" \
              -m "Preserve the validated propulsion history and all current-main systems. Resolve only the shared CLI registry, retain all entries, pass 58 propulsion regressions and all five OAK levels. Computational screening only; no physical or regulatory certification is implied."
          elif ! git diff --cached --quiet; then
            git commit -m "chore(propulsion): finalize current-main convergence"
          else
            echo "Nothing to commit."
          fi
          git push origin HEAD:feat/omega-propulsion-r0-3
