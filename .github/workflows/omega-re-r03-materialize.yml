name: Omega RE R0.3 Materialize

on:
  push:
    branches:
      - feat/omega-re-t-r0-3-max
    paths:
      - "tools/omega_re_r03_payload/**"
      - "tools/omega_re_r03_materialize.py"
      - ".github/workflows/omega-re-r03-materialize.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/omega_re_r03_payload/**"
      - "tools/omega_re_r03_materialize.py"
      - ".github/workflows/omega-re-r03-materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-re-r03-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validators
        run: python -m pip install --upgrade pip pytest jsonschema

      - name: Verify and extract allowlisted payload
        run: python tools/omega_re_r03_materialize.py --extract --require-extracted

      - name: Compile R0.3 sources
        run: python -m compileall -q omega_re_t

      - name: Run complete Omega RE tests
        run: python -m pytest -q tests/test_omega_re_*.py tests/test_r03_*.py

      - name: Exercise R0.3 CLI surfaces
        run: |
          mkdir -p /tmp/omega-re-r03
          python -m omega_re_t.r03_cli catalog --output /tmp/omega-re-r03/catalog.json
          python -m omega_re_t.r03_cli learn-demo --output /tmp/omega-re-r03/learn.json
          python -m omega_re_t.r03_cli grammar-demo --output /tmp/omega-re-r03/grammar.json
          python -m omega_re_t.r03_cli protocol-demo --output /tmp/omega-re-r03/protocol.json
          python -m omega_re_t.r03_cli causal-demo --output /tmp/omega-re-r03/causal.json
          python -m omega_re_t.r03_cli cleanroom-demo --output /tmp/omega-re-r03/cleanroom.json
          python -m omega_re_t.r03_cli genealogy-demo --output /tmp/omega-re-r03/genealogy.json

      - name: Materialize deterministic RE-1024 frontier
        run: |
          mkdir -p benchmarks/omega-re
          rm -f benchmarks/omega-re/re1024.json
          python -m omega_re_t.r03_cli frontier \
            --materialize benchmarks/omega-re/re1024.json \
            --shard-size 128 \
            --output /tmp/omega-re-r03/frontier.json

      - name: Verify frontier claims, schema and digest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          snapshot = Path("benchmarks/omega-re/re1024.json")
          schema = json.loads(Path("schemas/omega-re-r03.schema.json").read_text(encoding="utf-8"))
          payload = json.loads(snapshot.read_text(encoding="utf-8"))
          jsonschema.validate(payload, schema)
          manifest = payload["manifest"]
          assert manifest["schema"] == "omega-re-frontier/0.3"
          assert manifest["seed_count"] == 64
          assert manifest["perturbation_count"] == 16
          assert manifest["case_count"] == 1024
          assert len(payload["cases"]) == 1024
          assert set(manifest["family_counts"].values()) == {64}
          assert set(manifest["perturbation_counts"].values()) == {64}
          assert manifest["merkle_like_digest"] == "b1e029f7d80e55f4d0e746b2c2e3a9cd3528b94e8352035e3df76b6d5df60e85"
          claims = manifest["claims"]
          assert claims["logical_cases"] == 1024
          assert claims["materialized_cases"] == 1024
          assert claims["executed_cases"] == 0
          assert claims["software_tested_cases"] == 0
          assert claims["scientifically_verified_cases"] == 0
          assert claims["logical_space_is_not_execution"] is True
          assert claims["materialization_is_not_validation"] is True
          authority = manifest["authority"]
          assert not any(authority.values())
          assert len(snapshot.read_text(encoding="utf-8").splitlines()) > 190_000
          PY

      - name: Re-verify source payload after tests
        run: python tools/omega_re_r03_materialize.py --require-extracted

      - name: Commit validated R0.3 sources and frontier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            omega_re_t/active_learning.py \
            omega_re_t/causal.py \
            omega_re_t/cleanroom_agents.py \
            omega_re_t/genealogy.py \
            omega_re_t/grammar.py \
            omega_re_t/hybrid.py \
            omega_re_t/nondeterministic.py \
            omega_re_t/protocol.py \
            omega_re_t/r03_cli.py \
            omega_re_t/r03_frontier.py \
            omega_re_t/sharding.py \
            tests/test_r03_active_nd.py \
            tests/test_r03_causal_grammar_protocol.py \
            tests/test_r03_hybrid_genealogy_cleanroom.py \
            tests/test_r03_sharding_frontier_cli.py \
            docs/omega-re-t/FOUNDATION_R0_3.md \
            schemas/omega-re-r03.schema.json \
            benchmarks/omega-re/re1024.json \
            pyproject.toml
          if git diff --cached --quiet; then
            echo "R0.3 sources and RE-1024 are already synchronized."
            exit 0
          fi
          git commit -m "feat(omega-re-r03): materialize active causal RE-1024 forge"
          git push origin HEAD:${TARGET_BRANCH}
