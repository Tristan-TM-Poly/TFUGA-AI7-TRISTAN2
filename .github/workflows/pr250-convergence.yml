name: PR 250 One-Shot Convergence

on:
  push:
    branches:
      - feat/omega-mail-t-r0-1
    paths:
      - .github/workflows/pr250-convergence.yml

permissions:
  contents: write

concurrency:
  group: pr250-one-shot-convergence
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/omega-mail-t-r0-1
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Merge current main with strict conflict allowlist
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          if [ "$merge_status" -ne 0 ]; then
            echo "Detected conflicts:"
            printf '%s\n' "$conflicts"
            if [ "$conflicts" != "pyproject.toml" ]; then
              echo "OAK BLOCK: only pyproject.toml is authorized for automatic reconciliation."
              git merge --abort || true
              exit 1
            fi
            # The branch version already contains main's metadata and CLI entries
            # plus the Company/Mail entry points, so preserve it as the reviewed union.
            git checkout --ours -- pyproject.toml
            git add -- pyproject.toml
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "OAK BLOCK: unresolved files remain:"
            printf '%s\n' "$unresolved"
            git merge --abort || true
            exit 1
          fi

          git commit -m 'merge: converge current main into PR 250 branch'
          git push origin HEAD:feat/omega-mail-t-r0-1
