name: omega-latex-t-oak

on:
  pull_request:
    paths:
      - "omega_latex_t/**"
      - "tests/test_omega_latex_t.py"
      - "tests/test_omega_latex_t_r08.py"
      - "schemas/omega_latex_*.schema.json"
      - "examples/omega_latex_t_*"
      - "docs/theories/OMEGA_LATEX_T_INFINITY.md"
      - "pyproject.toml"
      - ".github/workflows/omega-latex-t-oak.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-latex-t-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oak:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q omega_latex_t tests/test_omega_latex_t.py tests/test_omega_latex_t_r08.py
      - name: Run R0.1-R0.8 focused tests
        run: python -m unittest -v tests.test_omega_latex_t tests.test_omega_latex_t_r08
      - name: Parse schemas
        run: python -c 'import json,glob; [json.load(open(p)) for p in glob.glob("schemas/omega_latex_*.schema.json")]'
      - name: Deterministic R0.8 bundle
        run: |
          python -m omega_latex_t build examples/omega_latex_t_r08_demo.json --output-dir /tmp/r08-a
          python -m omega_latex_t build examples/omega_latex_t_r08_demo.json --output-dir /tmp/r08-b
          cmp /tmp/r08-a/document.tex /tmp/r08-b/document.tex
          cmp /tmp/r08-a/manifest.json /tmp/r08-b/manifest.json
          test -f /tmp/r08-a/bibliography-report.json
          test -f /tmp/r08-a/figure-manifest.json
          test -f /tmp/r08-a/uncertainty-ledger.json
          test -f /tmp/r08-a/verifier-receipts.json
      - name: R0.8 evidence surfaces
        run: |
          python -m omega_latex_t audit examples/omega_latex_t_r08_demo.json
          python -m omega_latex_t figure-render examples/omega_latex_t_r08_demo.json --node-id fig.demo > /tmp/figure.tex
          grep -q "tikzpicture" /tmp/figure.tex
          python -m omega_latex_t uncertainty examples/omega_latex_t_r08_demo.json > /tmp/uncertainty.json
          python -m omega_latex_t verifier-receipts examples/omega_latex_t_r08_demo.json > /tmp/receipts.json
          grep -q '"verified_count": 1' /tmp/receipts.json
          python -m omega_latex_t theorem-bundle examples/omega_latex_t_r08_demo.json --theorem-id thm.demo --output-dir /tmp/theorem-r08
          grep -q 'verified-external-receipt' /tmp/theorem-r08/bundle-manifest.json
      - name: Bibliography and MetaDocumentGraph
        run: |
          python -m omega_latex_t from-bibtex examples/omega_latex_t_r08_demo.json examples/omega_latex_t_refs.bib --output /tmp/with-bib.json
          python -m omega_latex_t bibliography /tmp/with-bib.json > /tmp/bib-report.json
          python -m omega_latex_t metadocument examples/omega_latex_t_r08_demo.json /tmp/with-bib.json --output /tmp/meta.json
          test -s /tmp/meta.json
      - name: Universe plan, build, resume
        run: |
          python -m omega_latex_t universe-plan examples/omega_latex_t_universe_manifest.json --output /tmp/universe-plan.json
          python -m omega_latex_t build-universe examples/omega_latex_t_universe_manifest.json --output-dir /tmp/universe --cache-dir /tmp/universe-cache
          python -m omega_latex_t build-universe examples/omega_latex_t_universe_manifest.json --output-dir /tmp/universe --cache-dir /tmp/universe-cache
          test -f /tmp/universe/checkpoint.json
          test -f /tmp/universe/r08-demo/D5/document.tex
