name: omega-cognitive-computer

on:
  pull_request:
    paths:
      - "omega_cognitive_computer_t/**"
      - "tests/test_omega_cognitive_computer_t.py"
      - "docs/OMEGA_COGNITIVE_COMPUTER_T.md"
      - ".github/workflows/omega-cognitive-computer.yml"
  push:
    branches: [main]
    paths:
      - "omega_cognitive_computer_t/**"
      - "tests/test_omega_cognitive_computer_t.py"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q omega_cognitive_computer_t
      - run: pytest -q tests/test_omega_cognitive_computer_t.py
