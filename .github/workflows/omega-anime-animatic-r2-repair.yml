name: Finalize Omega Anime Animatic R2

on:
  push:
    branches: ["feat/omega-anime-t-r0-1"]
    paths:
      - ".github/workflows/omega-anime-animatic-r2-repair.yml"
  pull_request:
    paths:
      - ".github/workflows/omega-anime-animatic-r2-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-anime-animatic-r2-direct-finalize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout writable Anime branch
        uses: actions/checkout@v4
        with:
          ref: feat/omega-anime-t-r0-1
          fetch-depth: 1

      - name: Compile and test against the real R1 package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pytest jsonschema
          python -m compileall \
            omega_anime_animatic_t \
            omega_anime_studio_t \
            tests/test_omega_anime_animatic_t_r2.py \
            examples/omega_anime_animatic_r2_demo.py
          pytest -q tests/test_omega_anime_animatic_t_r2.py --durations=20
          python -m omega_anime_animatic_t validate-demo
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from omega_anime_animatic_t import build_eighth_fire_animatic_r2
          from omega_anime_studio_t import build_eighth_fire_r1

          r1 = build_eighth_fire_r1()
          r1.require_valid()
          timeline = build_eighth_fire_animatic_r2()
          schema = json.loads(Path('schemas/animatic-timeline-r2.schema.json').read_text())
          Draft202012Validator(schema).validate(timeline.to_dict())
          assert [shot.shot_id for shot in timeline.shots] == [shot.shot_id for shot in r1.shots]
          assert len(timeline.scenes) == 5
          assert len(timeline.shots) == 30
          assert timeline.duration_s == 180.0
          assert timeline.shots[-1].dialogue == 'Et maintenant, elle te voit.'
          print({'r1_shots': len(r1.shots), 'r2_shots': len(timeline.shots), 'duration_s': timeline.duration_s})
          PY

      - name: Materialize twice and prove byte determinism
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/eighth-fire-r2 generated/omega_anime_animatic_t/eighth_fire_r2
          python -m omega_anime_animatic_t compile-demo --output-dir /tmp/eighth-fire-r2
          python -m omega_anime_animatic_t compile-demo \
            --output-dir generated/omega_anime_animatic_t/eighth_fire_r2
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          first = Path('/tmp/eighth-fire-r2')
          tracked = Path('generated/omega_anime_animatic_t/eighth_fire_r2')
          names = {
              'audio-cues.jsonl',
              'edit-decision-list.csv',
              'eighth-fire-animatic.html',
              'manifest.json',
              'report.md',
              'storyboard-contact-sheet.svg',
              'subtitles.fr.vtt',
              'timeline.json',
          }
          assert {path.name for path in first.iterdir()} == names
          assert {path.name for path in tracked.iterdir()} == names
          for name in sorted(names):
              left = hashlib.sha256((first / name).read_bytes()).hexdigest()
              right = hashlib.sha256((tracked / name).read_bytes()).hexdigest()
              assert left == right, (name, left, right)

          manifest = json.loads((tracked / 'manifest.json').read_text())
          timeline = json.loads((tracked / 'timeline.json').read_text())
          player = (tracked / 'eighth-fire-animatic.html').read_text()
          storyboard = (tracked / 'storyboard-contact-sheet.svg').read_text()
          assert manifest['external_network_dependencies'] == 0
          assert manifest['self_contained_browser_player'] is True
          assert manifest['guide_audio_only'] is True
          assert timeline['duration_s'] == 180.0
          assert len(timeline['shots']) == 30
          assert '<canvas' in player and 'AudioContext' in player
          assert 'fetch(' not in player and 'http://' not in player and 'https://' not in player
          assert storyboard.count('data-shot=') == 30
          print({'artifacts': 8, 'manifest_sha256': manifest['manifest_sha256'], 'network_dependencies': 0})
          PY

      - name: Commit clean validated R2 tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/omega_anime_animatic_t
          printf '%s\n' 'omega-anime-animatic/r2' > generated/omega_anime_animatic_t/.materialized-r2
          rm -f generated/omega_anime_animatic_t/materializer-diagnostic.txt
          rm -rf tools/anime_animatic_r2_payload
          rm -f tools/anime_animatic_r2_force.ready
          rm -f .github/workflows/omega-anime-animatic-r2-materialize.yml
          rm -f .github/workflows/omega-anime-animatic-r2-force-materialize.yml
          rm -f .github/workflows/omega-anime-animatic-r2-repair.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- generated/omega_anime_animatic_t
          git add -u -- \
            tools/anime_animatic_r2_payload \
            tools/anime_animatic_r2_force.ready \
            .github/workflows/omega-anime-animatic-r2-materialize.yml \
            .github/workflows/omega-anime-animatic-r2-force-materialize.yml \
            .github/workflows/omega-anime-animatic-r2-repair.yml
          git diff --cached --stat
          git commit -m "feat(anime): materialize validated Omega Anime Animatic R2"
          git push origin HEAD:feat/omega-anime-t-r0-1
