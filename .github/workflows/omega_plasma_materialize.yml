name: omega-plasma-materialize-atlas

on:
  push:
    branches:
      - feat/omega-plasma-t-infinite-r0.1
    paths:
      - omega_plasma_t/materialize_atlas.py
      - omega_plasma_t/tests/test_materialize_atlas.py
      - omega_plasma_t/generation_nonce.txt
      - .github/workflows/omega_plasma_materialize.yml
  workflow_dispatch:
    inputs:
      shard_size:
        description: Rows per generated JSONL shard
        required: false
        default: '400'

permissions:
  contents: write

concurrency:
  group: omega-plasma-materialize-atlas
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest

      - name: Test package before generation
        run: python -m pytest omega_plasma_t/tests -q

      - name: Materialize atlas
        env:
          SHARD_SIZE: ${{ inputs.shard_size || '400' }}
        run: |
          rm -rf generated/omega_plasma_t/materialized_atlas
          python -m omega_plasma_t.materialize_atlas \
            --shard-size "$SHARD_SIZE" \
            --output-dir generated/omega_plasma_t/materialized_atlas

      - name: Verify materialized evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('generated/omega_plasma_t/materialized_atlas')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['counts']['regime_cells'] > 10_000
          assert manifest['permanent_cap'] is False
          assert manifest['authority']['hardware_actions'] == 0
          assert manifest['authority']['automatic_main_merge'] is False
          for item in manifest['files']:
              path = root / item['file']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
          PY

      - name: Commit generated atlas to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/omega_plasma_t/materialized_atlas
          if git diff --cached --quiet; then
            echo 'Materialized atlas already synchronized.'
            exit 0
          fi
          git commit -m 'data(omega-plasma): materialize 10k+ OAK atlas objects'
          git push origin HEAD:${GITHUB_REF_NAME}
