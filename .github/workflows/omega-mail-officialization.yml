name: Ω-MAIL-T Officialization OAKBench

on:
  pull_request:
    paths:
      - 'omega_mail_t/**'
      - 'tests/test_omega_mail_t.py'
      - 'tests/test_omega_mail_catalog.py'
      - 'tests/test_omega_mail_officialization.py'
      - 'tests/test_omega_mail_r04_hardening.py'
      - 'schemas/omega_mail_*.schema.json'
      - 'examples/omega_mail_t/**'
      - 'docs/omega_mail_t/**'
      - 'pyproject.toml'
      - '.github/workflows/omega-mail-officialization.yml'
  push:
    branches:
      - main
      - feat/omega-mail-r04-hardening
    paths:
      - 'omega_mail_t/**'
      - 'tests/test_omega_mail_t.py'
      - 'tests/test_omega_mail_catalog.py'
      - 'tests/test_omega_mail_officialization.py'
      - 'tests/test_omega_mail_r04_hardening.py'
      - 'schemas/omega_mail_*.schema.json'
      - 'examples/omega_mail_t/**'
      - 'docs/omega_mail_t/**'
      - 'pyproject.toml'
      - '.github/workflows/omega-mail-officialization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-oakbench:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile Ω-MAIL-T
        run: python -m compileall -q omega_mail_t tests/test_omega_mail_r04_hardening.py
      - name: Run targeted tests
        run: >-
          python -m pytest -q
          tests/test_omega_mail_t.py
          tests/test_omega_mail_catalog.py
          tests/test_omega_mail_officialization.py
          tests/test_omega_mail_r04_hardening.py
      - name: Verify CLI surfaces without network
        run: |
          python -m omega_mail_t.official_cli --help
          python -m omega_mail_t.official_cli audit-ledger /tmp/nonexistent-ledger.jsonl
          python -m omega_mail_t.cvcd_atlas --help
