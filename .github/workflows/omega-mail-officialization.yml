name: Ω-MAIL-T Officialization OAKBench

on:
  pull_request:
    paths:
      - 'omega_mail_t/**'
      - 'tests/test_omega_mail_t.py'
      - 'tests/test_omega_mail_catalog.py'
      - 'tests/test_omega_mail_officialization.py'
      - 'schemas/omega_mail_company.schema.json'
      - 'examples/omega_mail_t/**'
      - 'docs/omega_mail_t/**'
      - 'pyproject.toml'
      - '.github/workflows/omega-mail-officialization.yml'
  push:
    branches:
      - feat/omega-mail-t-r0-1
    paths:
      - 'omega_mail_t/**'
      - 'tests/test_omega_mail_t.py'
      - 'tests/test_omega_mail_catalog.py'
      - 'tests/test_omega_mail_officialization.py'
      - 'schemas/omega_mail_company.schema.json'
      - 'examples/omega_mail_t/**'
      - 'docs/omega_mail_t/**'
      - 'pyproject.toml'
      - '.github/workflows/omega-mail-officialization.yml'

permissions:
  contents: read

jobs:
  targeted-oakbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile Ω-MAIL-T
        run: python -m compileall omega_mail_t
      - name: Run targeted tests
        run: >-
          python -m pytest -q
          tests/test_omega_mail_t.py
          tests/test_omega_mail_catalog.py
          tests/test_omega_mail_officialization.py
      - name: Verify dry-run CLI imports
        run: |
          python -m omega_mail_t.official_cli --help
          python -m omega_mail_t.cvcd_atlas --help
