name: Omega Polyglot Bench T

on:
  push:
    branches: [feat/omega-polyglot-bench-r01]
    paths:
      - "omega_polyglot_bench_t/**"
      - "native/omega_polyglot/**"
      - "tests/test_omega_polyglot_bench_t.py"
      - "docs/omega-polyglot-bench-t/**"
      - "pyproject.toml"
      - ".github/workflows/omega-polyglot-bench-t.yml"
  pull_request:
    paths:
      - "omega_polyglot_bench_t/**"
      - "native/omega_polyglot/**"
      - "tests/test_omega_polyglot_bench_t.py"
      - "docs/omega-polyglot-bench-t/**"
      - "pyproject.toml"
      - ".github/workflows/omega-polyglot-bench-t.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oak-polyglot-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile Python
        run: python -m compileall -q omega_polyglot_bench_t tests/test_omega_polyglot_bench_t.py
      - name: Run unit tests
        run: python -m pytest -q tests/test_omega_polyglot_bench_t.py
      - name: Build C, C++, and Rust backends
        run: python -m omega_polyglot_bench_t build
      - name: Compare all implementations
        run: |
          python -m omega_polyglot_bench_t compare \
            --size 4096 \
            --warmups 2 \
            --repetitions 7 \
            --output /tmp/omega-polyglot-report.json
      - name: Enforce OAK conformance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/omega-polyglot-report.json').read_text())
          measurements = {item['backend']: item for item in report['measurements']}
          assert set(measurements) == {'python', 'c', 'cpp', 'rust'}
          assert all(item['available'] for item in measurements.values())
          assert all(item['correct'] for item in measurements.values())
          assert all(item['max_abs_error'] <= 1e-12 for item in measurements.values())
          assert report['selected_backend'] in measurements
          assert report['includes_ffi_conversion'] is True
          assert report['status'] == 'OAK_SOFTWARE_BENCHMARK_ONLY'
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
