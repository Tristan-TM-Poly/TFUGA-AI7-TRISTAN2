name: Ω WorkMax Git R0.1-R0.8

on:
  pull_request:
    paths:
      - 'omega_workmax_t/**'
      - 'tests/test_omega_workmax_t.py'
      - 'tests/test_omega_workmax_r02_r05.py'
      - 'tests/test_omega_workmax_r06_r08.py'
      - 'docs/OMEGA_WORKMAX_GIT_T_R0_1.md'
      - 'docs/OMEGA_WORKMAX_GIT_T_R0_2_R0_5.md'
      - 'docs/OMEGA_WORKMAX_GIT_T_R0_6_R0_8.md'
      - 'examples/omega_workmax_repository_fixture.json'
      - 'examples/omega_workmax_github_snapshot_pr370.json'
      - 'examples/omega_workmax_workir_r03.json'
      - 'examples/omega_workmax_beam_r06.json'
      - 'examples/omega_workmax_policy_lab_r08.json'
      - '.github/workflows/omega-workmax-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'omega_workmax_t/**'
      - 'tests/test_omega_workmax_t.py'
      - 'tests/test_omega_workmax_r02_r05.py'
      - 'tests/test_omega_workmax_r06_r08.py'
      - 'docs/OMEGA_WORKMAX_GIT_T_R0_1.md'
      - 'docs/OMEGA_WORKMAX_GIT_T_R0_2_R0_5.md'
      - 'docs/OMEGA_WORKMAX_GIT_T_R0_6_R0_8.md'
      - 'examples/omega_workmax_repository_fixture.json'
      - 'examples/omega_workmax_github_snapshot_pr370.json'
      - 'examples/omega_workmax_workir_r03.json'
      - 'examples/omega_workmax_beam_r06.json'
      - 'examples/omega_workmax_policy_lab_r08.json'
      - '.github/workflows/omega-workmax-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-workmax-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workmax-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused WorkMax court
        run: python -m pytest -q tests/test_omega_workmax_t.py tests/test_omega_workmax_r02_r05.py tests/test_omega_workmax_r06_r08.py

      - name: Compile deterministic R0.1 fixture twice
        run: |
          python -m omega_workmax_t.cli plan examples/omega_workmax_repository_fixture.json --output /tmp/workmax-a.json
          python -m omega_workmax_t.cli plan examples/omega_workmax_repository_fixture.json --output /tmp/workmax-b.json
          diff -u /tmp/workmax-a.json /tmp/workmax-b.json

      - name: Compile immutable R0.2 snapshot twice
        run: |
          python -m omega_workmax_t.cli telemetry examples/omega_workmax_github_snapshot_pr370.json --output /tmp/telemetry-a.json
          python -m omega_workmax_t.cli telemetry examples/omega_workmax_github_snapshot_pr370.json --output /tmp/telemetry-b.json
          diff -u /tmp/telemetry-a.json /tmp/telemetry-b.json

      - name: Compile R0.3 WorkIR
        run: |
          python -m omega_workmax_t.cli workir examples/omega_workmax_workir_r03.json --output /tmp/workir.json
          test -s /tmp/workir.json

      - name: Exercise Ω-ACTIONS bridge
        run: |
          python -m omega_workmax_t.cli actions-hotspots --root . --output /tmp/workmax-hotspots.json
          test -s /tmp/workmax-hotspots.json

      - name: Exercise R0.6 beam search and R0.8 policy lab
        run: |
          python -m omega_workmax_t.cli beam-search examples/omega_workmax_beam_r06.json --output /tmp/beam.json
          python -m omega_workmax_t.cli policy-lab examples/omega_workmax_policy_lab_r08.json --output /tmp/policy.json
          test -s /tmp/beam.json
          test -s /tmp/policy.json
