name: Ω WorkMax Git R0.1

on:
  pull_request:
    paths:
      - 'omega_workmax_t/**'
      - 'tests/test_omega_workmax_t.py'
      - 'docs/OMEGA_WORKMAX_GIT_T_R0_1.md'
      - 'examples/omega_workmax_repository_fixture.json'
      - '.github/workflows/omega-workmax-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'omega_workmax_t/**'
      - 'tests/test_omega_workmax_t.py'
      - 'docs/OMEGA_WORKMAX_GIT_T_R0_1.md'
      - 'examples/omega_workmax_repository_fixture.json'
      - '.github/workflows/omega-workmax-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-workmax-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workmax-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run focused WorkMax court
        run: python -m pytest -q tests/test_omega_workmax_t.py

      - name: Compile deterministic fixture twice
        run: |
          python -m omega_workmax_t.cli plan examples/omega_workmax_repository_fixture.json --output /tmp/workmax-a.json
          python -m omega_workmax_t.cli plan examples/omega_workmax_repository_fixture.json --output /tmp/workmax-b.json
          diff -u /tmp/workmax-a.json /tmp/workmax-b.json

      - name: Exercise Ω-ACTIONS bridge
        run: |
          python -m omega_workmax_t.cli actions-hotspots --root . --output /tmp/workmax-hotspots.json
          test -s /tmp/workmax-hotspots.json
