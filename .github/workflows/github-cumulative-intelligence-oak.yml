name: Ω GitHub Cumulative Intelligence OAK

on:
  pull_request:
    paths:
      - "omega_capability_os_t/github_cumulative_intelligence*.py"
      - "omega_capability_os_t/github_retrieval_arena.py"
      - "omega_research_abi_t/github_cumulative_intelligence_bridge.py"
      - "tests/test_omega_github_cumulative_intelligence.py"
      - "examples/github_cumulative_intelligence_request.json"
      - "schemas/github_cumulative_intelligence_r12.schema.json"
      - "docs/OMEGA_GITHUB_CUMULATIVE_INTELLIGENCE_R0_8_R1_2.md"
      - ".agents/skills/github-cumulative-intelligence/**"
      - ".github/workflows/github-cumulative-intelligence-oak.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  cumulative-intelligence-oak:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Deterministic court
        run: python -m pytest -q tests/test_omega_github_cumulative_intelligence.py

      - name: Compile sources
        run: python -m compileall -q omega_capability_os_t omega_research_abi_t

      - name: Refresh canonical state=all PR memory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m omega_capability_os_t.github_memory_cli build \
            --repository "$GITHUB_REPOSITORY" \
            --registry examples/capability_os_registry.json \
            --without-files \
            --output /tmp/omega-history-index.json

      - name: Run leakage-controlled PR retrieval arena
        run: |
          python -m omega_capability_os_t.github_retrieval_arena court \
            /tmp/omega-history-index.json \
            --top-k 8 \
            --output /tmp/omega-pr-retrieval-arena.json

      - name: Compile cumulative intelligence capsule
        run: |
          python -m omega_capability_os_t.github_cumulative_intelligence_cli \
            examples/github_cumulative_intelligence_request.json \
            --index "$GITHUB_REPOSITORY=/tmp/omega-history-index.json" \
            --max-items 8 \
            --output /tmp/omega-cumulative-intelligence.json

      - name: OAK live assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/omega-cumulative-intelligence.json").read_text())
          arena = json.loads(Path("/tmp/omega-pr-retrieval-arena.json").read_text())
          assert report["schema"] == "omega-github-cumulative-intelligence/v1.2.0"
          coverage = report["history_coverage"]
          assert coverage["pr_count"] >= 1
          assert coverage["exact_state_partition"] is True
          assert coverage["pr_count"] == (
              coverage["open_count"]
              + coverage["draft_count"]
              + coverage["merged_count"]
              + coverage["closed_not_merged_count"]
          )
          constitution = report["generation_constitution"]
          assert constitution["search_all_history_before_create"] is True
          assert constitution["reuse_before_create"] is True
          assert constitution["create_only_residual"] is True
          assert constitution["write_authority_granted"] is False
          assert "MERGED != M+" in report["oak_boundaries"]
          assert len(report["fingerprint"]) == 64

          assert arena["schema"] == "omega-pr-retrieval-arena/v0.1.0"
          assert arena["oak"]["status"] == "PASS", arena["oak"]
          assert arena["oak"]["temporal_leakage_free"] is True
          assert arena["strategies"]["lexical_jaccard"]["target_leakage_count"] == 0
          assert arena["strategies"]["lexical_jaccard"]["future_leakage_count"] == 0
          winner = arena["strategies"][arena["winner"]]
          baseline = arena["strategies"]["lexical_jaccard"]
          assert winner["micro_recall_at_k"] >= baseline["micro_recall_at_k"]
          assert len(arena["fingerprint"]) == 64

          print(json.dumps({
              "pr_count": coverage["pr_count"],
              "open": coverage["open_count"],
              "draft": coverage["draft_count"],
              "merged": coverage["merged_count"],
              "closed_not_merged": coverage["closed_not_merged_count"],
              "reuse_coverage_ratio": report["minimal_reuse_coalition"]["reuse_coverage_ratio"],
              "retrieval_targets": arena["eligible_target_count"],
              "retrieval_gold_refs": arena["gold_lineage_ref_count"],
              "retrieval_winner": arena["winner"],
              "baseline_recall_at_8": baseline["micro_recall_at_k"],
              "winner_recall_at_8": winner["micro_recall_at_k"],
              "winner_mrr": winner["mrr"],
              "retrieval_improved": arena["improved_over_baseline"],
              "fingerprint": report["fingerprint"],
              "arena_fingerprint": arena["fingerprint"],
          }, indent=2))
          PY

      - name: Retain bounded historical intelligence
        uses: actions/upload-artifact@v4
        with:
          name: omega-github-cumulative-intelligence-${{ github.run_id }}
          path: |
            /tmp/omega-history-index.json
            /tmp/omega-pr-retrieval-arena.json
            /tmp/omega-cumulative-intelligence.json
          retention-days: 14
