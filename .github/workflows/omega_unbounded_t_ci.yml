name: omega-unbounded-t-ci

on:
  pull_request:
    paths:
      - 'omega_unbounded_t/**'
      - 'tests/test_omega_unbounded_t.py'
      - 'tests/test_omega_unbounded_github_planner.py'
      - 'schemas/omega_unbounded_addition.schema.json'
      - 'policies/omega_unbounded_growth.json'
      - '.github/workflows/omega_unbounded_t_ci.yml'
  push:
    branches:
      - main
    paths:
      - 'omega_unbounded_t/**'
      - 'tests/test_omega_unbounded_t.py'
      - 'tests/test_omega_unbounded_github_planner.py'
      - 'schemas/omega_unbounded_addition.schema.json'
      - 'policies/omega_unbounded_growth.json'
      - '.github/workflows/omega_unbounded_t_ci.yml'
  workflow_dispatch:

jobs:
  test-and-frontier-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Compile package
        run: python -m compileall -q omega_unbounded_t

      - name: Run targeted tests
        run: python -m pytest tests/test_omega_unbounded_t.py tests/test_omega_unbounded_github_planner.py -q

      - name: Build a 100k-addition dry-run plan
        run: |
          python -m omega_unbounded_t.cli synthetic-plan \
            --work-items 100000 \
            --namespaces 16 \
            --initial-shard-bytes 32768 \
            --shard-growth-factor 2 \
            --output-dir generated/omega-unbounded-ci-100k

      - name: Verify dry-run invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('generated/omega-unbounded-ci-100k')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          oak = json.loads((root / 'oak-report.json').read_text(encoding='utf-8'))
          assert manifest['raw_records'] == 100000
          assert manifest['unique_additions'] == 100000
          assert manifest['no_total_addition_cap'] is True
          assert oak['checks']['remote_mutations'] == 0
          assert oak['checks']['rollback_ledger'] is True
          assert (root / 'commit-plan.jsonl').stat().st_size > 0
          assert (root / 'rollback.jsonl').stat().st_size > 0
          PY

      - name: Upload frontier report
        uses: actions/upload-artifact@v4
        with:
          name: omega-unbounded-ci-100k
          path: |
            generated/omega-unbounded-ci-100k/manifest.json
            generated/omega-unbounded-ci-100k/semantic-diff.json
            generated/omega-unbounded-ci-100k/oak-report.json
            generated/omega-unbounded-ci-100k/tree.jsonl
            generated/omega-unbounded-ci-100k/commit-plan.jsonl
            generated/omega-unbounded-ci-100k/rollback.jsonl
