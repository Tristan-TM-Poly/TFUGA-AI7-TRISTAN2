name: Omega Polyglot Throughput R0.3

on:
  push:
    branches: [feat/omega-polyglot-bench-r01]
    paths:
      - "omega_polyglot_bench_t/r03/**"
      - "native/omega_polyglot/**"
      - "tests/test_omega_polyglot_throughput_r03.py"
      - "schemas/omega_polyglot_throughput_report_v3.schema.json"
      - "benchmarks/omega_polyglot/**"
      - "docs/omega-polyglot-throughput-r03/**"
      - "pyproject.toml"
      - ".github/workflows/omega-polyglot-r03.yml"
  pull_request:
    paths:
      - "omega_polyglot_bench_t/r03/**"
      - "native/omega_polyglot/**"
      - "tests/test_omega_polyglot_throughput_r03.py"
      - "schemas/omega_polyglot_throughput_report_v3.schema.json"
      - "benchmarks/omega_polyglot/**"
      - "docs/omega-polyglot-throughput-r03/**"
      - "pyproject.toml"
      - ".github/workflows/omega-polyglot-r03.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oak-throughput-r03:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pytest jsonschema

      - name: Compile Python R0.3
        run: |
          python -m compileall -q \
            omega_polyglot_bench_t/r03 \
            tests/test_omega_polyglot_throughput_r03.py

      - name: Build C, C++, and Rust backends
        run: python -m omega_polyglot_bench_t.r03 build --backends c,cpp,rust

      - name: Run R0.3 tests
        run: python -m pytest -q tests/test_omega_polyglot_throughput_r03.py

      - name: Run separated-boundary benchmark
        run: |
          python -m omega_polyglot_bench_t.r03 benchmark \
            --backends c,cpp,rust \
            --sizes 4096,100000 \
            --warmups 3 \
            --repetitions 11 \
            --output /tmp/omega-polyglot-r03-${{ matrix.python-version }}.json

      - name: Validate schema and OAK speedup evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          report_path = Path('/tmp/omega-polyglot-r03-${{ matrix.python-version }}.json')
          report = json.loads(report_path.read_text())
          schema = json.loads(
              Path('schemas/omega_polyglot_throughput_report_v3.schema.json').read_text()
          )
          jsonschema.validate(report, schema)

          assert report['status'] == 'OAK_LOCAL_SOFTWARE_BENCHMARK_ONLY'
          assert report['universal_language_winner_claimed'] is False
          assert report['energy_measured'] is False
          assert [item['size'] for item in report['sizes']] == [4096, 100000]

          for size in report['sizes']:
              measurements = {
                  (item['backend'], item['mode']): item
                  for item in size['measurements']
              }
              assert len(measurements) == 9
              assert all(item['available'] for item in measurements.values())
              assert all(item['correct'] for item in measurements.values())
              assert all(item['max_abs_error'] <= 1e-12 for item in measurements.values())
              for backend in ('c', 'cpp', 'rust'):
                  end_to_end = measurements[(backend, 'end_to_end_list')]
                  zero_copy = measurements[(backend, 'zero_copy_buffer')]
                  prepared = measurements[(backend, 'kernel_only_prepared')]
                  assert zero_copy['median_ns'] < end_to_end['median_ns']
                  assert prepared['median_ns'] < end_to_end['median_ns']
              assert size['best_speedup_vs_python'] > 1.0
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: omega-polyglot-r03-python-${{ matrix.python-version }}
          path: /tmp/omega-polyglot-r03-${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 30
