name: Omega Aero Hydro Propulsion T

on:
  pull_request:
    paths:
      - "omega_aero_hydro_propulsion_t/**"
      - "tests/test_omega_aero_hydro_propulsion*.py"
      - "schemas/rotor_design.schema.json"
      - "schemas/propulsion_*.json"
      - "docs/omega-aero-hydro-propulsion-t/**"
      - "examples/omega_aero_hydro_propulsion_demo.py"
      - "pyproject.toml"
      - ".github/workflows/omega-aero-hydro-propulsion-t.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propulsion-oak:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile
        run: python -m compileall omega_aero_hydro_propulsion_t
      - name: Test R0.1 and R0.2
        run: python -m pytest -q tests/test_omega_aero_hydro_propulsion*.py
      - name: R0.1 OAK benchmark
        run: python -m omega_aero_hydro_propulsion_t benchmark
      - name: R0.2 OAK benchmark
        run: python -m omega_aero_hydro_propulsion_t.r02_cli benchmark > /tmp/r02-oak.json
      - name: Analyze aerodynamic and hydrodynamic demos
        run: |
          python -m omega_aero_hydro_propulsion_t analyze-demo --medium air --velocity 22 --rpm 2200 > /tmp/aero.json
          python -m omega_aero_hydro_propulsion_t analyze-demo --medium water --velocity 3 --rpm 700 > /tmp/hydro.json
      - name: Optimize R0.1 design grid
        run: python -m omega_aero_hydro_propulsion_t optimize-demo --medium air --velocity 22 --rpm 2200 > /tmp/optimize.json
      - name: Run annular BEM analytic and tabulated cases
        run: |
          python -m omega_aero_hydro_propulsion_t.r02_cli annular-demo > /tmp/annular.json
          python -m omega_aero_hydro_propulsion_t.r02_cli annular-demo --tabulated-polar > /tmp/annular-tabulated.json
      - name: Run polar and mission demonstrations
        run: |
          python -m omega_aero_hydro_propulsion_t.r02_cli polar-demo > /tmp/polar.json
          python -m omega_aero_hydro_propulsion_t.r02_cli mission-demo > /tmp/mission.json
      - name: Audit R0.2 evidence and epistemic boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r02 = json.loads(Path('/tmp/r02-oak.json').read_text())
          assert r02['passed'] is True
          assert r02['status'] == 'CERTIFIED_COMPUTATIONAL_MULTIPOINT_R0_2'
          assert r02['physics_certified'] is False

          annular = json.loads(Path('/tmp/annular.json').read_text())
          tabulated = json.loads(Path('/tmp/annular-tabulated.json').read_text())
          assert annular['converged'] is True
          assert annular['model'] == 'annular-bem-propeller-momentum-r0.2'
          assert annular['physics_certified'] is False
          assert tabulated['converged'] is True
          assert all(section['polar_model'].startswith('tabulated') for section in tabulated['sections'])

          polar = json.loads(Path('/tmp/polar.json').read_text())
          assert 'not measured' in polar['epistemic_status']
          assert polar['interpolation']['model'] == 'tabulated-polar-idw-r0.2'

          mission = json.loads(Path('/tmp/mission.json').read_text())
          assert mission['feasible'] is True
          assert len(mission['phases']) == 3
          assert 0.0 <= mission['mission_efficiency'] <= 1.0
          assert 'not flight' in mission['certification_notice']

          report = json.loads(Path('/tmp/optimize.json').read_text())
          assert report['best'] is not None
          assert report['candidate_count'] == 75
          assert report['feasible_count'] > 0
          print(json.dumps({
              'status': 'passed',
              'r01_candidates': report['candidate_count'],
              'r02_mission_phases': len(mission['phases']),
              'r02_annuli': len(annular['sections']),
          }, sort_keys=True))
          PY
