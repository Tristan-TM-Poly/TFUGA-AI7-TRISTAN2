name: Omega Convergence OS R0.1

on:
  pull_request:
    paths:
      - "omega_convergence_os/**"
      - "tests/test_omega_convergence_*.py"
      - "schemas/omega-convergence-*.json"
      - "policies/omega-convergence-*.json"
      - "docs/canon/OMEGA-CONVERGENCE-OS-R0.1.md"
      - "examples/omega_convergence_*.json"
      - "pyproject.toml"
      - ".github/workflows/omega-convergence-os-r0-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convergence-r01:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: python -m pip install pytest

      - name: Compile
        run: python -m compileall omega_convergence_os tests

      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_omega_convergence_os.py \
            tests/test_omega_convergence_receipt_cli.py

      - name: Execute Branch DNA example
        run: |
          python -m omega_convergence_os.cli branch-dna \
            examples/omega_convergence_branch_input.json \
            --output /tmp/branch-dna.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/branch-dna.json').read_text())
          assert len(payload['sha256']) == 64
          assert payload['scripts']['omega-example'] == 'pkg.cli:main'
          assert payload['workflow_permissions'][
              '.github/workflows/example.yml:contents'
          ] == 'read'
          PY

      - name: Validate machine contracts and authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              'schemas/omega-convergence-branch-dna.schema.json',
              'schemas/omega-convergence-merge-receipt.schema.json',
              'policies/omega-convergence-oak-r0-1.json',
          ]:
              json.loads(Path(path).read_text())
          policy = json.loads(Path('policies/omega-convergence-oak-r0-1.json').read_text())
          assert policy['automatic_merge'] is False
          assert policy['automatic_scientific_promotion'] is False
          PY
