name: Omega University R0.1

on:
  pull_request:
    paths:
      - 'omega_university_t/**'
      - '.github/workflows/omega-university-r01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run focused OAK court
        run: python -m unittest discover -s omega_university_t/tests -p 'test_*.py' -v
