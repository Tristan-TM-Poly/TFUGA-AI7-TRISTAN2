name: omega-meta-science-t

on:
  pull_request:
    paths:
      - "omega_meta_science_t/**"
      - "tests/test_omega_meta_science_t.py"
      - "docs/omega-meta-science-t/**"
      - ".github/workflows/omega-meta-science-t.yml"
  push:
    branches: [main]
    paths:
      - "omega_meta_science_t/**"
      - "tests/test_omega_meta_science_t.py"
      - "docs/omega-meta-science-t/**"
      - ".github/workflows/omega-meta-science-t.yml"

permissions:
  contents: read

jobs:
  meta-science-bench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run MetaScienceBench tests
        run: python -m pytest -q tests/test_omega_meta_science_t.py
      - name: Replay benchmark JSON
        run: python -m omega_meta_science_t --compact > /tmp/meta_science_report.json
