name: Ω Actions Telemetry R0.2

on:
  workflow_dispatch:
    inputs:
      run_limit:
        description: Recent workflow runs to sample
        required: false
        default: '50'
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: omega-actions-telemetry
  cancel-in-progress: true

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Collect recent run and job telemetry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_LIMIT: ${{ github.event.inputs.run_limit || '50' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ['GITHUB_TOKEN']
          repository = os.environ['REPOSITORY']
          limit = max(1, min(int(os.environ.get('RUN_LIMIT', '50')), 100))
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'omega-actions-telemetry',
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          runs_url = f'https://api.github.com/repos/{repository}/actions/runs?per_page=100'
          payload = get_json(runs_url)
          runs = list(payload.get('workflow_runs', []))[:limit]
          for run in runs:
              jobs_url = run.get('jobs_url')
              if not jobs_url:
                  run['jobs'] = []
                  continue
              separator = '&' if '?' in jobs_url else '?'
              jobs_payload = get_json(f'{jobs_url}{separator}per_page=100')
              run['jobs'] = jobs_payload.get('jobs', [])

          output = {
              'repository': repository,
              'sample_limit': limit,
              'workflow_runs': runs,
          }
          with open('OMEGA_ACTIONS_TELEMETRY_INPUT.json', 'w', encoding='utf-8') as handle:
              json.dump(output, handle, indent=2)
              handle.write('\n')
          PY

      - name: Analyze telemetry
        run: |
          python -m omega_actions_t.telemetry OMEGA_ACTIONS_TELEMETRY_INPUT.json \
            --json-out OMEGA_ACTIONS_TELEMETRY.json \
            --markdown-out OMEGA_ACTIONS_TELEMETRY.md
          test -s OMEGA_ACTIONS_TELEMETRY.json
          test -s OMEGA_ACTIONS_TELEMETRY.md
          cat OMEGA_ACTIONS_TELEMETRY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload telemetry evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omega-actions-telemetry-${{ github.run_id }}
          path: |
            OMEGA_ACTIONS_TELEMETRY_INPUT.json
            OMEGA_ACTIONS_TELEMETRY.json
            OMEGA_ACTIONS_TELEMETRY.md
          if-no-files-found: error
          retention-days: 14
