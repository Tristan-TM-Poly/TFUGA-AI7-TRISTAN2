name: Omega VLA R0.3 Wave 2 MAX OAKBench

on:
  push:
    branches: [feat/omega-vla-t-r0-3-wave2-operator-max]
    paths:
      - "omega_vla_t/r03/wave2/**"
      - "tests/test_omega_vla_r03_wave2_*.py"
      - "examples/omega_vla_r03_wave2_operator_max_demo.py"
      - "docs/omega_vla_t/r03/WAVE2_OPERATOR_MAX.md"
      - "schemas/omega_vla_operator_genome_v2.schema.json"
      - "schemas/omega_vla_wave2_campaign_plan_v1.schema.json"
      - "pyproject.toml"
      - ".github/workflows/omega-vla-r03-wave2-max.yml"
  pull_request:
    paths:
      - "omega_vla_t/r03/wave2/**"
      - "tests/test_omega_vla_r03_wave2_*.py"
      - "examples/omega_vla_r03_wave2_operator_max_demo.py"
      - "docs/omega_vla_t/r03/WAVE2_OPERATOR_MAX.md"
      - "schemas/omega_vla_operator_genome_v2.schema.json"
      - "schemas/omega_vla_wave2_campaign_plan_v1.schema.json"
      - "pyproject.toml"
      - ".github/workflows/omega-vla-r03-wave2-max.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oakbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime and validators
        run: >-
          python -m pip install --disable-pip-version-check
          numpy pytest jsonschema

      - name: Compile Wave 2
        run: >-
          python -m compileall -q
          omega_vla_t/r03/wave2
          tests/test_omega_vla_r03_wave2_sparse_functions.py
          tests/test_omega_vla_r03_wave2_catalog_commutant.py
          tests/test_omega_vla_r03_wave2_cli_oak.py
          tests/test_omega_vla_r03_wave2_campaigns.py
          examples/omega_vla_r03_wave2_operator_max_demo.py

      - name: Run focused test suites
        run: |
          pytest -q \
            tests/test_omega_vla_r03_wave2_sparse_functions.py \
            tests/test_omega_vla_r03_wave2_catalog_commutant.py \
            tests/test_omega_vla_r03_wave2_cli_oak.py \
            tests/test_omega_vla_r03_wave2_campaigns.py

      - name: Generate deterministic operator artifacts
        run: |
          python -m omega_vla_t.r03.wave2.cli manifest --output /tmp/manifest-a.json
          python -m omega_vla_t.r03.wave2.cli manifest --output /tmp/manifest-b.json
          cmp /tmp/manifest-a.json /tmp/manifest-b.json

          python -m omega_vla_t.r03.wave2.cli catalog \
            --realm physics \
            --limit 20 \
            --output /tmp/catalog.json

          python -m omega_vla_t.r03.wave2.cli materialize \
            discrete_geometry.graphs_complexes.combinatorial_laplacian \
            --dimension 8 \
            --dense \
            --output /tmp/laplacian.json

          python -m omega_vla_t.r03.wave2.cli properties \
            '[[1,0],[0,2]]' \
            --output /tmp/properties.json

          python -m omega_vla_t.r03.wave2.cli commutant \
            '[[1,0],[0,2]]' \
            --output /tmp/commutant.json

          python -m omega_vla_t.r03.wave2.cli benchmark \
            --dimensions 4,8 \
            --seed 2026 \
            --output /tmp/benchmark-a.json
          python -m omega_vla_t.r03.wave2.cli benchmark \
            --dimensions 4,8 \
            --seed 2026 \
            --output /tmp/benchmark-b.json
          cmp /tmp/benchmark-a.json /tmp/benchmark-b.json

          python -m omega_vla_t.r03.wave2.cli genome-demo \
            --database /tmp/operator-genomes.sqlite3 \
            --output /tmp/genome.json

          python -m omega_vla_t.r03.wave2.cli oak \
            --output /tmp/oak.json

      - name: Generate deterministic campaign artifacts
        run: |
          python -m omega_vla_t.r03.wave2.campaign_cli manifest \
            --output /tmp/campaign-manifest-a.json
          python -m omega_vla_t.r03.wave2.campaign_cli manifest \
            --output /tmp/campaign-manifest-b.json
          cmp /tmp/campaign-manifest-a.json /tmp/campaign-manifest-b.json

          python -m omega_vla_t.r03.wave2.campaign_cli plan \
            --count 1024 \
            --seed 2026 \
            --start-offset 4096 \
            --output /tmp/campaign-plan-a.json
          python -m omega_vla_t.r03.wave2.campaign_cli plan \
            --count 1024 \
            --seed 2026 \
            --start-offset 4096 \
            --output /tmp/campaign-plan-b.json
          cmp /tmp/campaign-plan-a.json /tmp/campaign-plan-b.json

          python -m omega_vla_t.r03.wave2.campaign_cli audit-roundtrip \
            --count 4096 \
            --seed 2026 \
            --output /tmp/campaign-roundtrip.json

      - name: Execute deterministic demonstration
        run: >-
          python examples/omega_vla_r03_wave2_operator_max_demo.py
          > /tmp/demo.json

      - name: Validate schemas, OAK and claim boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          genome_schema = json.loads(
              Path('schemas/omega_vla_operator_genome_v2.schema.json').read_text()
          )
          campaign_schema = json.loads(
              Path('schemas/omega_vla_wave2_campaign_plan_v1.schema.json').read_text()
          )
          jsonschema.Draft202012Validator.check_schema(genome_schema)
          jsonschema.Draft202012Validator.check_schema(campaign_schema)

          manifest = json.loads(Path('/tmp/manifest-a.json').read_text())
          assert manifest['catalog']['families'] >= 300
          assert manifest['benchmark_frontier']['logical_cases'] > 10**12
          assert manifest['theorem_claimed'] is False
          assert manifest['formal_proof_claimed'] is False
          assert manifest['scientific_validation_claimed'] is False

          genome_bundle = json.loads(Path('/tmp/genome.json').read_text())
          jsonschema.validate(genome_bundle['genome'], genome_schema)
          assert genome_bundle['genome']['theorem_claimed'] is False
          assert genome_bundle['genome']['formal_proof_claimed'] is False
          assert genome_bundle['genome']['scientific_validation_claimed'] is False

          campaign = json.loads(Path('/tmp/campaign-plan-a.json').read_text())
          jsonschema.validate(campaign, campaign_schema)
          assert campaign['generated'] == 1024
          assert campaign['logical_frontier_size'] > 10**12
          assert campaign['permanent_total_cap'] is None
          assert campaign['theorem_claimed'] is False
          assert campaign['formal_proof_claimed'] is False
          assert campaign['scientific_validation_claimed'] is False

          roundtrip = json.loads(Path('/tmp/campaign-roundtrip.json').read_text())
          assert roundtrip['passed'] is True
          assert roundtrip['unique_indices'] == 4096

          benchmark = json.loads(Path('/tmp/benchmark-a.json').read_text())
          assert benchmark['all_passed'] is True
          assert benchmark['environmental_timing_included'] is False
          assert benchmark['theorem_claimed'] is False

          oak = json.loads(Path('/tmp/oak.json').read_text())
          assert oak['passed'] is True
          assert oak['status'] == 'OAK_PASS_SOFTWARE_RESEARCH_FIXTURES_R0_3_WAVE_2'
          assert oak['family_count'] >= 300
          assert oak['logical_benchmark_cases'] > 10**12
          assert oak['theorem_claimed'] is False
          assert oak['formal_proof_claimed'] is False
          assert oak['scientific_validation_claimed'] is False

          demo = json.loads(Path('/tmp/demo.json').read_text())
          assert demo['catalog']['families'] >= 300
          assert demo['matrix_exponential']['passed'] is True
          assert demo['campaign']['logical_frontier_size'] > 10**12
          assert demo['theorem_claimed'] is False
          assert demo['formal_proof_claimed'] is False
          assert demo['scientific_validation_claimed'] is False

          print('OAK_PASS_VLA_R0_3_WAVE_2_MAX')
          PY
