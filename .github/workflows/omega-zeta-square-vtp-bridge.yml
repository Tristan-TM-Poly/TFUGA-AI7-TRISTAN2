name: Omega Zeta Square VTP Bridge

on:
  pull_request:
    paths:
      - "omega_zeta_square_t/vtp_bridge.py"
      - "omega_zeta_square_t/symbolic_hankel.py"
      - "omega_vtp_t/**"
      - "tests/test_omega_zeta_square_principal_xi_vtp.py"
      - ".github/workflows/omega-zeta-square-vtp-bridge.yml"
  push:
    branches: [main]
    paths:
      - "omega_zeta_square_t/vtp_bridge.py"
      - "omega_zeta_square_t/symbolic_hankel.py"
      - "omega_vtp_t/**"
      - "tests/test_omega_zeta_square_principal_xi_vtp.py"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install VTP runtime dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile bridge surfaces
        run: python -m compileall -q omega_vtp_t omega_zeta_square_t/vtp_bridge.py omega_zeta_square_t/symbolic_hankel.py tests/test_omega_zeta_square_principal_xi_vtp.py
      - name: Run VTP bridge tests
        run: python -m unittest tests.test_omega_zeta_square_principal_xi_vtp
      - name: Direct bridge smoke
        run: |
          python - <<'PY'
          from omega_zeta_square_t.symbolic_hankel import tensor_lift_constraint
          from omega_zeta_square_t.vtp_bridge import constraint_to_vtp_linear_form, evaluate_vtp_linear_form
          c = tensor_lift_constraint(2, 0)
          form = constraint_to_vtp_linear_form(c)
          assert form.nonzero_feature_count == 3
          value = evaluate_vtp_linear_form([13/36, 1/36, 0.0], form)
          assert value > 0
          assert form.proves_rh is False
          print("vtp-bridge-oak: PROMOTE_INTEROP_ONLY")
          PY
