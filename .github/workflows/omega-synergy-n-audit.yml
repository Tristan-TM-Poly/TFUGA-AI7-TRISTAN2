name: Omega Synergy Foundry Audit

on:
  workflow_dispatch:
    inputs:
      max_order:
        description: Maximum synergy order, from 2 to 8
        required: false
        default: '4'
  schedule:
    - cron: '27 6 * * 3'
  push:
    branches:
      - agent/omega-synergy-n-research-engine
    paths:
      - 'omega_synergy_t/**'
      - 'tools/github_reactor/synergy_n_engine.py'
      - 'tests/test_synergy_n_engine.py'
      - 'tests/test_synergy_foundry.py'
      - 'tests/test_synergy_foundry_cli.py'
      - 'docs/canon/OMEGA_SYNERGY_N_T.md'
      - 'docs/canon/OMEGA_SYNERGY_T_INFINITY_R1.md'
      - 'docs/architecture/OMEGA_SYNERGY_ARCHITECTURE.md'
      - 'docs/security/OMEGA_SYNERGY_THREAT_MODEL.md'
      - 'schemas/omega_synergy_n_report.schema.json'
      - 'schemas/creation_dna.schema.json'
      - 'schemas/interface_contract.schema.json'
      - 'schemas/synergy_experiment.schema.json'
      - 'schemas/pr_gene.schema.json'
      - 'pyproject.toml'
      - '.github/workflows/omega-synergy-n-audit.yml'
  pull_request:
    paths:
      - 'omega_synergy_t/**'
      - 'tools/github_reactor/synergy_n_engine.py'
      - 'tests/test_synergy_n_engine.py'
      - 'tests/test_synergy_foundry.py'
      - 'tests/test_synergy_foundry_cli.py'
      - 'docs/canon/OMEGA_SYNERGY_N_T.md'
      - 'docs/canon/OMEGA_SYNERGY_T_INFINITY_R1.md'
      - 'docs/architecture/OMEGA_SYNERGY_ARCHITECTURE.md'
      - 'docs/security/OMEGA_SYNERGY_THREAT_MODEL.md'
      - 'schemas/omega_synergy_n_report.schema.json'
      - 'schemas/creation_dna.schema.json'
      - 'schemas/interface_contract.schema.json'
      - 'schemas/synergy_experiment.schema.json'
      - 'schemas/pr_gene.schema.json'
      - 'pyproject.toml'
      - '.github/workflows/omega-synergy-n-audit.yml'

permissions:
  contents: read

concurrency:
  group: omega-synergy-foundry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout root reactor
        uses: actions/checkout@v4
        with:
          path: workspace/root
          persist-credentials: false

      - name: Checkout public deep corpus
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Tristan-TM-Poly/Tristan_Tardif-Morency_TFUG
          path: workspace/deep-corpus
          persist-credentials: false

      - name: Checkout public AIT generator
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Tristan-TM-Poly/Tristan_Tardif-Morency_TFUGAG
          path: workspace/ait-generator
          persist-credentials: false

      - name: Checkout public variant
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Tristan-TM-Poly/TTM-TFUGA-AI7-TRISTAN2
          path: workspace/variant
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Synergy Foundry tests
        working-directory: workspace/root
        run: |
          python -m pip install --upgrade pip pytest
          pytest -q \
            tests/test_synergy_n_engine.py \
            tests/test_synergy_foundry.py \
            tests/test_synergy_foundry_cli.py

      - name: Compile Python modules
        working-directory: workspace/root
        run: |
          python -m compileall -q omega_synergy_t tools/github_reactor/synergy_n_engine.py

      - name: Generate bounded multi-repository Foundry analysis
        env:
          MAX_ORDER: ${{ inputs.max_order || '4' }}
        run: |
          roots=(--repo-root workspace/root)
          [ -d workspace/deep-corpus/.git ] && roots+=(--repo-root workspace/deep-corpus)
          [ -d workspace/ait-generator/.git ] && roots+=(--repo-root workspace/ait-generator)
          [ -d workspace/variant/.git ] && roots+=(--repo-root workspace/variant)
          python workspace/root/tools/github_reactor/synergy_n_engine.py \
            "${roots[@]}" \
            --out reports/github-autonomous-reactor/synergy-foundry \
            --max-order "$MAX_ORDER" \
            --beam-width 96 \
            --top-k 25 \
            --max-nodes 800 \
            --portfolio-budget 4.0

      - name: Validate generated JSON and authority boundary
        run: |
          python -m json.tool workspace/root/reports/github-autonomous-reactor/synergy-foundry/creation_dna.json >/dev/null
          python -m json.tool workspace/root/reports/github-autonomous-reactor/synergy-foundry/synergy_report.json >/dev/null
          python -m json.tool workspace/root/reports/github-autonomous-reactor/synergy-foundry/experiment_queue.json >/dev/null
          python -m json.tool workspace/root/reports/github-autonomous-reactor/synergy-foundry/pr_orchestra.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('workspace/root/reports/github-autonomous-reactor/synergy-foundry')
          report = json.loads((root / 'synergy_report.json').read_text())
          orchestra = json.loads((root / 'pr_orchestra.json').read_text())
          assert report['authority'] == 'review_only_heuristic'
          assert orchestra['authority'] == 'review_only_plan'
          assert 'No merge is authorized by this manifest.' in orchestra['rules']
          PY

      - name: Upload review-only evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: omega-synergy-foundry-${{ github.run_id }}
          path: workspace/root/reports/github-autonomous-reactor/synergy-foundry
          if-no-files-found: error
          retention-days: 30
