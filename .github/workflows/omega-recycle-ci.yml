name: omega-recycle-ci

on:
  pull_request:
    paths:
      - "omega_recycle_t/**"
      - ".github/workflows/omega-recycle-ci.yml"
  push:
    branches: [main]
    paths:
      - "omega_recycle_t/**"
      - ".github/workflows/omega-recycle-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install ./omega_recycle_t
      - name: Unit tests
        run: pytest -q omega_recycle_t/tests
      - name: OAKBench smoke test
        run: python -m omega_recycle oakbench > /tmp/omega-recycle-oakbench.json
