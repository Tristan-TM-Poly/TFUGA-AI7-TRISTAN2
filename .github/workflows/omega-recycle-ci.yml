name: omega-recycle-ci

on:
  pull_request:
    paths:
      - "omega_recycle_t/**"
      - ".github/workflows/omega-recycle-ci.yml"
  push:
    paths:
      - "omega_recycle_t/**"
      - ".github/workflows/omega-recycle-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install ./omega_recycle_t
      - name: Compile package
        run: python -m compileall -q omega_recycle_t/omega_recycle
      - name: Unit tests
        run: pytest -q omega_recycle_t/tests
      - name: OAKBench R0.3-R0.4 compatibility courts
        run: |
          python -m omega_recycle oakbench > /tmp/omega-recycle-oakbench.json
          python - <<'PY'
          from omega_recycle.bench import run_oakbench
          report = run_oakbench()
          solver = report["solver_crosscheck"]
          assert solver["score_equal"] is True
          assert solver["modes_equal"] is True
          assert solver["optimality_certified"] is True
          assert report["lca_inventory"]["claim_boundary"] == "inventory_only_no_lifecycle_impact_claim"
          r04 = report["r04_courts"]
          assert r04["symbiosis"]["quantity_regret_detected"] is True
          assert r04["transport"]["optimality_certified"] is True
          assert r04["dataset_snapshot"]["hash_reproducible"] is True
          assert r04["lcia"]["certified_lca"] is False
          PY
      - name: R0.5 source, drift, negative-control and multi-hop courts
        run: |
          python -m omega_recycle evidence-r05 > /tmp/omega-recycle-r05.json
          python - <<'PY'
          from omega_recycle.r05_evidence import run_r05_evidence
          report = run_r05_evidence()
          assert report["bench_version"] == "0.5.0"
          assert report["eurostat"]["latest_status"] == "p"
          assert report["revision"]["changed"] is True
          assert report["calibration_drift"]["deterioration_detected"] is True
          assert report["negative_control_campaign"]["canonical_is_best"] is False
          assert report["multi_hop_flow"]["optimality_certified"] is True
          assert report["time_expanded_flow"]["optimality_certified"] is True
          PY
