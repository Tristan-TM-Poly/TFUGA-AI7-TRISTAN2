name: Ω PR 5K2N Fractal Generation OAK

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-5k2n-oak:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic court dependencies
        run: python -m pip install pytest jsonschema

      - name: Compile R0.1-R0.5 sources
        run: |
          python -m compileall -q \
            omega_capability_os_t/github_pr_generation_forest.py \
            omega_capability_os_t/github_pr_generation_r02.py \
            omega_capability_os_t/github_pr_generation_r03.py \
            omega_capability_os_t/github_pr_generation_r04.py \
            omega_capability_os_t/github_pr_generation_r05.py \
            tools/compile_pr_5k2n_event.py

      - name: Deterministic R0.1-R0.5 OAK court
        run: |
          python -m pytest -q \
            tests/test_omega_github_pr_generation_forest.py \
            tests/test_omega_github_pr_generation_r02.py \
            tests/test_omega_github_pr_generation_r03.py \
            tests/test_omega_github_pr_generation_r04.py \
            tests/test_omega_github_pr_generation_r04_hardening.py \
            tests/test_omega_github_pr_generation_r05.py

      - name: Compile canonical R0.1 bounded receipt and n=0..3 campaign
        run: |
          python -m omega_capability_os_t.github_pr_generation_forest \
            examples/pr_5k2n_generation_request.json \
            --output /tmp/omega-pr-5k2n-r01.json
          python -m omega_capability_os_t.github_pr_generation_forest \
            examples/pr_5k2n_generation_request.json \
            --generation 0 \
            --campaign-generations 4 \
            --output /tmp/omega-pr-5k2n-campaign.json

      - name: Compile deterministic R0.2, R0.3 and R0.5 fixtures
        run: |
          python -m omega_capability_os_t.github_pr_generation_r02 \
            examples/pr_5k2n_generation_r02_request.json \
            --output /tmp/omega-pr-5k2n-r02.json
          python -m omega_capability_os_t.github_pr_generation_r03 \
            examples/pr_5k2n_generation_r03_request.json \
            --output /tmp/omega-pr-5k2n-r03.json
          python -m omega_capability_os_t.github_pr_generation_r05 \
            examples/pr_5k2n_generation_r05_request.json \
            --output /tmp/omega-pr-5k2n-r05.json

      - name: Compile current PR event receipt without GitHub API
        if: github.event_name == 'pull_request'
        run: |
          python tools/compile_pr_5k2n_event.py \
            --output /tmp/omega-pr-5k2n-event.json \
            --generation 0 \
            --budget 32

      - name: Validate schemas and permanent non-authority invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          def load(path):
              return json.loads(Path(path).read_text())

          r01 = load('/tmp/omega-pr-5k2n-r01.json')
          campaign = load('/tmp/omega-pr-5k2n-campaign.json')
          r02 = load('/tmp/omega-pr-5k2n-r02.json')
          r03 = load('/tmp/omega-pr-5k2n-r03.json')
          r05 = load('/tmp/omega-pr-5k2n-r05.json')

          Draft202012Validator(load('schemas/omega-pr-5k2n-generation-r01.schema.json')).validate(r01)
          Draft202012Validator(load('schemas/omega-pr-5k2n-generation-r02.schema.json')).validate(r02)
          Draft202012Validator(load('schemas/omega-pr-5k2n-generation-r03.schema.json')).validate(r03)
          Draft202012Validator(load('schemas/omega-pr-5k2n-generation-r05.schema.json')).validate(r05)

          assert r01['seed_count'] == 5000
          assert r01['logical_population_materialized'] is False
          assert r01['physical_patch_compiler']['write_authority_granted'] is False
          assert campaign['architecture_hard_cap'] is False
          assert campaign['generation_budget_is_runtime_budget'] is True

          assert r02['historical_context']['decision'] == 'EXTEND'
          assert r02['physical_patch_compiler']['code_change_generated'] is False
          assert r02['physical_patch_compiler']['automatic_merge_allowed'] is False

          assert r03['process_reuse_plane']['process_reuse_complete'] is True
          assert r03['artifact_residual_plane']['decision'] == 'INSPECT'
          assert r03['physical_patch_contract_count'] == 0
          assert r03['heuristic_failure_memory_numeric_penalty'] == 0.0

          assert r05['verdict_counts']['COMPATIBLE'] == 1
          assert r05['receipts'][0]['action_candidate'] == 'REUSE_CANDIDATE'
          assert r05['receipts'][0]['action_authorized'] is False
          assert r05['automatic_reuse_authorized'] is False
          assert r05['automatic_memory_promotion_authorized'] is False
          assert r05['source_renderer_authorized'] is False
          assert r05['automatic_merge_allowed'] is False
          PY

      - name: Validate event receipt boundary
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          event = json.loads(Path('/tmp/omega-pr-5k2n-event.json').read_text())
          assert event['event_context']['event_only'] is True
          assert event['event_context']['history_enriched'] is False
          assert event['event_context']['physical_materialization_blocked_until_reuse_inspection'] is True
          assert event['physical_patch_compiler']['write_authority_granted'] is False
          PY

      - name: Retain deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: omega-pr-5k2n-deterministic-${{ github.run_id }}
          path: |
            /tmp/omega-pr-5k2n-r01.json
            /tmp/omega-pr-5k2n-campaign.json
            /tmp/omega-pr-5k2n-r02.json
            /tmp/omega-pr-5k2n-r03.json
            /tmp/omega-pr-5k2n-r05.json
            /tmp/omega-pr-5k2n-event.json
          if-no-files-found: ignore
          retention-days: 14
