definition: >-
  Reusable deterministic kernel for empirical theory quotienting,
  anchor-preserving adversarial twins, evidence-dependence discounting,
  finite-difference Hessians of declared utilities, finite claim UNSAT cores,
  proof-carrying transform certification, and OAK-first finite scientific
