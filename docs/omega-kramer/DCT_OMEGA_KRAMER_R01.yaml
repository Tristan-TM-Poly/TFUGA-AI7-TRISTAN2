    Structure-aware backend routing can outperform any single determinant or
    solve representation on a heterogeneous benchmark atlas.
equation_or_model: >-
  D=det(A); adj(A)^T=grad_A det(A); N=adj(A)b; AN=Db;
  det([[A,b],[z^T,alpha]])=alpha*D-z^T*N.
