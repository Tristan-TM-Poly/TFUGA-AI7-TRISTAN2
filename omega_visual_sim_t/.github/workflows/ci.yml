name: omega-visual-sim-t

on:
  push:
    paths: ["omega_visual_sim_t/**"]
  pull_request:
    paths: ["omega_visual_sim_t/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e omega_visual_sim_t
      - run: cd omega_visual_sim_t && python -m unittest discover -s tests -v
