[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-visual-sim-t"
version = "0.3.0"
description = "OAK-safe executable world, scientific simulation and audiovisual compiler"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
omega-visual = "omega_visual.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["omega_visual*"]
